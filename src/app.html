<!--
  The page shell. Everything else lives in modules:

    src/core/     the site — nothing in here knows what an experiment does
    src/exp/<id>/ one experiment, with its own screens, CSS and save paths
    src/app.js    the only place that knows both

  Two targets come out of this one source:

  - Claude Artifact: published with its module files alongside it.
  - Static hosting (Vercel): `node build.js` writes index.html with a real
    <head>. Without that wrapper a phone lays the page out at 980px and
    shrinks it to fit.

  Never serve this file directly. Edit here; run the build; never hand-edit
  index.html.
-->
