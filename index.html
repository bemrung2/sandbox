<title>나의 실험실</title>
<meta name="description" content="실험을 하나씩 만들어 모아두는 개인 실험실. 첫 실험은 여행 계획.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --paper: #F5F7F3;
    --surface: #FFFFFF;
    --surface-sunk: #EDF1EB;
    --ink: #131816;
    --ink-soft: #5A6560;
    --ink-faint: #8B958F;
    --line: #DFE5DD;
    --line-strong: #C6D0C6;

    --signal: #0E5C4F;
    --signal-soft: #DCEDE7;
    --travel: #9C6427;
    --travel-soft: #F6E7D5;
    --danger: #A32C22;
    --danger-soft: #F8DFDC;

    --shadow: rgba(19, 30, 25, 0.10);
  }

  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper: #0F1413;
      --surface: #161D1B;
      --surface-sunk: #1D2523;
      --ink: #E9EEEA;
      --ink-soft: #9DA9A3;
      --ink-faint: #6F7B76;
      --line: #253029;
      --line-strong: #35423A;

      --signal: #63D4B9;
      --signal-soft: #143C34;
      --travel: #E3A96C;
      --travel-soft: #40301C;
      --danger: #FF9E92;
      --danger-soft: #4A1E1A;

      --shadow: rgba(0, 0, 0, 0.5);
    }
  }

  :root[data-theme="dark"]{
    --paper: #0F1413;
    --surface: #161D1B;
    --surface-sunk: #1D2523;
    --ink: #E9EEEA;
    --ink-soft: #9DA9A3;
    --ink-faint: #6F7B76;
    --line: #253029;
    --line-strong: #35423A;

    --signal: #63D4B9;
    --signal-soft: #143C34;
    --travel: #E3A96C;
    --travel-soft: #40301C;
    --danger: #FF9E92;
    --danger-soft: #4A1E1A;

    --shadow: rgba(0, 0, 0, 0.5);
  }

  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  button, label, a, .row-tap{ touch-action: manipulation; }

  html, body{ height: 100%; }

  body{
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "IBM Plex Sans KR", system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.55;
    display: flex;
    justify-content: center;
  }

  .app{
    width: 100%;
    max-width: 440px;
    min-height: 100%;
    display: flex;
    flex-direction: column;
    background: var(--paper);
  }

  .mono{ font-family: "IBM Plex Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }

  .icon{ width: 22px; height: 22px; display: block; flex-shrink: 0; }

  /* ---------- top bar ---------- */
  #topbar{
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 6px;
    min-height: 58px;
    padding: 0 10px;
    background: var(--paper);
    border-bottom: 1px solid var(--line);
  }
  .bar-title{
    flex: 1;
    min-width: 0;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: -0.01em;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .bar-pad{ padding-left: 8px; }

  .icon-btn{
    width: 40px; height: 40px;
    border: none;
    background: transparent;
    color: var(--ink);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
  }
  .icon-btn:hover{ background: var(--surface-sunk); }
  .icon-btn.tapped{ background: var(--surface-sunk); }
  .icon-btn:focus-visible{ outline: 2px solid var(--signal); outline-offset: 2px; }
  .icon-btn.danger{ color: var(--danger); }

  /* ---------- view ---------- */
  #view{ flex: 1; padding: 22px 18px 96px; }

  .eyebrow{
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin: 0 0 6px;
  }
  h1.page-title{
    font-size: 25px;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin: 0 0 6px;
    text-wrap: balance;
  }
  .page-sub{
    font-size: 13.5px;
    color: var(--ink-soft);
    margin: 0 0 26px;
    max-width: 34em;
  }

  /* ---------- lab list (home) ---------- */
  .lab-list{
    border-top: 1px solid var(--line);
  }
  .lab-row{
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    padding: 18px 4px;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--line);
    color: inherit;
    text-align: left;
    font: inherit;
    cursor: pointer;
  }
  .lab-row.tapped{ background: var(--surface-sunk); }
  .lab-row:focus-visible{ outline: 2px solid var(--signal); outline-offset: -2px; }

  .lab-mark{
    width: 42px; height: 42px;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .lab-mark.travel{ background: var(--travel-soft); color: var(--travel); }

  .lab-text{ flex: 1; min-width: 0; }
  .lab-index{
    font-size: 10.5px;
    letter-spacing: 0.1em;
    color: var(--ink-faint);
    display: block;
    margin-bottom: 1px;
  }
  .lab-name{ display: block; font-size: 15.5px; font-weight: 600; margin: 0; }
  .lab-desc{ display: block; font-size: 12.5px; color: var(--ink-soft); margin: 2px 0 0; }
  .lab-go{ color: var(--ink-faint); }

  .lab-row.vacant{ cursor: default; opacity: 0.75; }
  .lab-row.vacant .lab-mark{
    background: transparent;
    border: 1px dashed var(--line-strong);
    color: var(--ink-faint);
  }

  .build-stamp{
    margin: 26px 0 0;
    font-size: 10.5px;
    color: var(--ink-faint);
    text-align: center;
  }

  /* ---------- trips ---------- */
  .section-head{
    display: flex; align-items: baseline; gap: 8px;
    margin: 0 0 10px;
  }
  .section-head h2{
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin: 0;
  }
  .section-count{ font-size: 11px; color: var(--ink-faint); }
  .section + .section{ margin-top: 30px; }

  .trip-list{ display: flex; flex-direction: column; }

  .trip-row{
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    padding: 15px 4px;
    background: transparent;
    border: none;
    border-top: 1px solid var(--line);
    color: inherit;
    text-align: left;
    font: inherit;
    cursor: pointer;
  }
  .trip-list .trip-row:last-child{ border-bottom: 1px solid var(--line); }
  .trip-row.tapped{ background: var(--surface-sunk); }
  .trip-row:focus-visible{ outline: 2px solid var(--signal); outline-offset: -2px; }
  .trip-row.past{ color: var(--ink-soft); }

  .trip-text{ flex: 1; min-width: 0; }
  .trip-name{
    display: block;
    font-size: 15.5px; font-weight: 600; margin: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .trip-meta{
    font-size: 12px; color: var(--ink-soft); margin: 3px 0 0;
    display: flex; align-items: center; gap: 6px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .dot{ color: var(--ink-faint); }

  .dday{
    font-size: 12px;
    font-weight: 600;
    padding: 4px 9px;
    border-radius: 7px;
    flex-shrink: 0;
    background: var(--surface-sunk);
    color: var(--ink-soft);
  }
  .dday.soon{ background: var(--travel-soft); color: var(--travel); }
  .dday.now{ background: var(--signal-soft); color: var(--signal); }

  /* ---------- empty ---------- */
  .empty{
    border: 1px dashed var(--line-strong);
    border-radius: 14px;
    padding: 34px 20px;
    text-align: center;
    color: var(--ink-soft);
  }
  .empty p{ margin: 0 0 16px; font-size: 13.5px; }

  /* ---------- buttons ---------- */
  .btn{
    display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    border: none;
    border-radius: 11px;
    padding: 13px 18px;
    font-family: inherit;
    font-size: 14.5px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-primary{ background: var(--signal); color: var(--paper); }
  .btn-primary.tapped{ filter: brightness(1.12); }
  .btn-primary:disabled{ opacity: 0.35; cursor: not-allowed; }
  .btn-quiet{ background: var(--surface-sunk); color: var(--ink); }
  .btn-plain{ background: transparent; color: var(--ink-soft); padding: 12px 10px; }
  .btn-plain.danger{ color: var(--danger); }
  .btn:focus-visible{ outline: 2px solid var(--signal); outline-offset: 2px; }
  .btn-block{ width: 100%; }

  .fab{
    position: fixed;
    bottom: 22px;
    right: max(18px, calc(50vw - 220px + 18px));
    display: inline-flex; align-items: center; gap: 8px;
    padding: 14px 20px;
    border: none;
    border-radius: 14px;
    background: var(--signal);
    color: var(--paper);
    font-family: inherit;
    font-size: 14.5px;
    font-weight: 600;
    box-shadow: 0 6px 18px var(--shadow);
    cursor: pointer;
    z-index: 8;
  }
  .fab.tapped{ filter: brightness(1.12); }
  .fab:focus-visible{ outline: 2px solid var(--ink); outline-offset: 2px; }

  /* ---------- form ---------- */
  .field{ margin-bottom: 18px; }
  .field label{
    display: block;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: var(--ink-soft);
    margin-bottom: 6px;
  }
  .field input{
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--line-strong);
    border-radius: 10px;
    padding: 12px 13px;
    font-family: inherit;
    font-size: 15px;
    color: var(--ink);
  }
  .field input:focus{ outline: none; border-color: var(--signal); }
  .field-pair{ display: flex; gap: 10px; }
  .field-pair .field{ flex: 1; min-width: 0; }
  .field-note{ font-size: 11.5px; color: var(--ink-faint); margin: 6px 0 0; }

  /* ---------- detail ---------- */
  .detail-head{
    padding-bottom: 18px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 18px;
  }
  .detail-name{
    font-size: 23px; font-weight: 700; letter-spacing: -0.02em;
    margin: 0 0 8px; text-wrap: balance;
  }
  .detail-badges{ display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

  .fact-list{ display: flex; flex-direction: column; gap: 0; }
  .fact{
    display: flex; align-items: flex-start; gap: 12px;
    padding: 14px 0;
    border-bottom: 1px solid var(--line);
  }
  .fact .icon{ width: 19px; height: 19px; color: var(--ink-faint); margin-top: 1px; }
  .fact-body{ flex: 1; min-width: 0; }
  .fact-label{ font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-faint); margin: 0; }
  .fact-value{ font-size: 15px; font-weight: 500; margin: 2px 0 0; word-break: break-word; }

  .stub-note{
    margin-top: 26px;
    padding: 16px;
    border-radius: 12px;
    background: var(--surface-sunk);
    font-size: 12.5px;
    color: var(--ink-soft);
  }
  .stub-note strong{ color: var(--ink); font-weight: 600; }

  /* ---------- dialog / toast ---------- */
  .scrim{
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(10, 16, 14, 0.45);
    display: flex; align-items: center; justify-content: center;
    padding: 22px;
    z-index: 40;
  }
  .dialog{
    background: var(--surface);
    border-radius: 16px;
    padding: 22px;
    width: 100%;
    max-width: 330px;
    box-shadow: 0 18px 40px var(--shadow);
  }
  .dialog h3{ margin: 0 0 8px; font-size: 17px; font-weight: 700; }
  .dialog p{ margin: 0 0 20px; font-size: 13.5px; color: var(--ink-soft); }
  .dialog-actions{ display: flex; justify-content: flex-end; gap: 4px; }

  .toast{
    position: fixed;
    left: 50%;
    bottom: 92px; /* clears the add button */
    transform: translateX(-50%) translateY(8px);
    background: var(--ink);
    color: var(--paper);
    padding: 12px 18px;
    border-radius: 11px;
    font-size: 13px;
    font-weight: 500;
    z-index: 60;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.18s ease, transform 0.18s ease;
    max-width: 88%;
    text-align: center;
  }
  .toast.show{ opacity: 1; transform: translateX(-50%) translateY(0); }

  .notice{
    display: flex; align-items: flex-start; gap: 8px;
    background: var(--travel-soft);
    color: var(--travel);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 11.5px;
    font-weight: 500;
    margin-bottom: 18px;
  }
  .notice .icon{ width: 16px; height: 16px; margin-top: 1px; }

  @media (prefers-reduced-motion: reduce){
    .toast{ transition: none; }
  }

  [hidden]{ display: none !important; }
</style>

<div class="app">
  <div id="topbar"></div>
  <div id="view"></div>
</div>
<div id="overlay"></div>
<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  var BUILD = "2026.09.08 · r1";

  /* ================= tiny helpers ================= */
  function el(html){
    var t = document.createElement("template");
    t.innerHTML = html.trim();
    return t.content.firstElementChild;
  }
  var ESC = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return ESC[c]; });
  }
  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

  /* Inline SVG only — an icon font that fails to load leaves raw words
     overlapping the layout, which is exactly what we are avoiding. */
  var ICONS = {
    back: '<polyline points="14 5 7 12 14 19"/>',
    close: '<line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/>',
    plus: '<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
    go: '<polyline points="10 5 17 12 10 19"/>',
    trash: '<polyline points="4 7 20 7"/><path d="M6 7l1 13h10l1-13"/><path d="M9 7V4h6v3"/>',
    compass: '<circle cx="12" cy="12" r="9"/><polygon points="15.6 8.4 10.4 10.4 8.4 15.6 13.6 13.6" fill="currentColor" stroke="none"/>',
    pin: '<path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.6"/>',
    calendar: '<rect x="4" y="6" width="16" height="14" rx="2"/><line x1="4" y1="10" x2="20" y2="10"/><line x1="8" y1="4" x2="8" y2="8"/><line x1="16" y1="4" x2="16" y2="8"/>',
    info: '<circle cx="12" cy="12" r="9"/><line x1="12" y1="11" x2="12" y2="16"/><circle cx="12" cy="7.6" r="1" fill="currentColor" stroke="none"/>',
    clock: '<circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 16 14"/>'
  };
  function icon(name, cls){
    return '<svg class="icon' + (cls ? " " + cls : "") + '" viewBox="0 0 24 24" fill="none" ' +
      'stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
      (ICONS[name] || "") + "</svg>";
  }

  /* Press feedback lands on pointerdown so a tap feels immediate, but the
     action itself waits for `click`. Acting on pointerdown would re-render
     under the finger and let the trailing click hit whatever replaced it —
     one tap, two screens — and it would also swallow scrolls that start on a
     row. `touch-action: manipulation` is what removes the old tap delay. */
  function tap(node, handler){
    function off(){ node.classList.remove("tapped"); }
    node.addEventListener("pointerdown", function(e){
      if (e.button && e.button !== 0) return;
      node.classList.add("tapped");
    });
    node.addEventListener("pointerup", off);
    node.addEventListener("pointercancel", off);
    node.addEventListener("pointerleave", off);
    node.addEventListener("click", function(e){
      off();
      handler(e);
    });
    return node;
  }

  var toastTimer = null;
  function toast(msg){
    var t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.classList.remove("show"); }, 2300);
  }

  function closeOverlay(){ document.getElementById("overlay").innerHTML = ""; }
  function confirmDialog(opts){
    return new Promise(function(resolve){
      var d = el(
        '<div class="scrim"><div class="dialog" role="alertdialog">' +
          '<h3>' + esc(opts.title) + '</h3>' +
          '<p>' + esc(opts.body) + '</p>' +
          '<div class="dialog-actions">' +
            '<button class="btn btn-plain" data-a="no">취소</button>' +
            '<button class="btn btn-plain' + (opts.danger ? " danger" : "") + '" data-a="yes">' + esc(opts.ok || "확인") + '</button>' +
          '</div>' +
        '</div></div>'
      );
      d.addEventListener("click", function(e){ if (e.target === d){ closeOverlay(); resolve(false); } });
      d.querySelector('[data-a="no"]').addEventListener("click", function(){ closeOverlay(); resolve(false); });
      d.querySelector('[data-a="yes"]').addEventListener("click", function(){ closeOverlay(); resolve(true); });
      document.getElementById("overlay").appendChild(d);
    });
  }

  /* ================= dates ================= */
  function today0(){ var d = new Date(); d.setHours(0,0,0,0); return d; }
  function parseDay(s){ return s ? new Date(s + "T00:00:00") : null; }
  function fmtDay(s){
    var d = parseDay(s);
    if (!d) return "";
    return d.getFullYear() + "." + String(d.getMonth()+1).padStart(2,"0") + "." + String(d.getDate()).padStart(2,"0");
  }
  function daysBetween(a, b){ return Math.round((a - b) / 86400000); }
  function nights(startS, endS){
    var s = parseDay(startS), e = parseDay(endS);
    if (!s || !e) return null;
    var n = daysBetween(e, s);
    return n >= 0 ? n : null;
  }
  /* Where a trip sits relative to today, as both a label and a sort key. */
  function tripStatus(trip){
    var t = today0();
    var s = parseDay(trip.startDate), e = parseDay(trip.endDate) || parseDay(trip.startDate);
    if (!s) return { key: "someday", label: "날짜 미정", cls: "" };
    if (e && e < t) return { key: "past", label: "다녀옴", cls: "" };
    if (s <= t) return { key: "now", label: "여행 중", cls: "now" };
    var d = daysBetween(s, t);
    return { key: "upcoming", label: "D-" + d, cls: d <= 30 ? "soon" : "", days: d };
  }

  /* ================= storage ================= */
  /* Uses the artifact's own store when it's there, and falls back to this
     browser's localStorage anywhere else (a plain static host, for one). */
  var Store = {
    backend: "local",
    db: null,

    async init(){
      try{
        if (window.claude && typeof window.claude.use === "function"){
          var db = await window.claude.use("db");
          if (db){ this.db = db; this.backend = "db"; return; }
        }
      }catch(e){ /* stay local */ }
      this.backend = "local";
    },
    _all(){
      try{ return JSON.parse(localStorage.getItem("lab.trips.v1") || "[]"); }
      catch(e){ return []; }
    },
    _save(list){ localStorage.setItem("lab.trips.v1", JSON.stringify(list)); },

    async listTrips(){
      if (this.backend === "db"){
        var snap = await this.db.collection("trips").get();
        return snap.docs.map(function(d){ return Object.assign({ id: d.id }, d.data()); });
      }
      return this._all();
    },
    async addTrip(data){
      var id = uid();
      var doc = Object.assign({ id: id }, data);
      if (this.backend === "db"){
        await this.db.collection("trips").doc(id).set(data);
        return doc;
      }
      var list = this._all();
      list.push(doc);
      this._save(list);
      return doc;
    },
    async deleteTrip(id){
      if (this.backend === "db"){
        await this.db.collection("trips").doc(id).delete();
        return;
      }
      this._save(this._all().filter(function(t){ return t.id !== id; }));
    }
  };

  /* ================= labs registry ================= */
  /* One entry per experiment. Adding the next lab is adding a row here. */
  var LABS = [
    {
      id: "travel",
      index: "EXP 01",
      name: "여행 계획",
      desc: "가고 싶은 여행을 적어두고 남은 날을 센다",
      mark: "travel",
      iconName: "compass",
      open: function(){ go({ view: "trips" }); }
    }
  ];

  /* ================= routing ================= */
  var state = { view: "home", trips: [], tripId: null, loaded: false };
  var topbar = document.getElementById("topbar");
  var view = document.getElementById("view");

  function go(next){
    Object.assign(state, next);
    render();
  }

  function setBar(parts){
    topbar.innerHTML = "";
    if (parts.back){
      topbar.appendChild(tap(el('<button class="icon-btn" aria-label="뒤로">' + icon("back") + '</button>'), parts.back));
    }
    topbar.appendChild(el('<span class="bar-title' + (parts.back ? "" : " bar-pad") + '">' + esc(parts.title) + '</span>'));
    (parts.actions || []).forEach(function(a){ topbar.appendChild(a); });
  }

  function setView(node){
    view.innerHTML = "";
    view.appendChild(node);
    window.scrollTo(0, 0);
  }

  /* ================= home ================= */
  function renderHome(){
    setBar({ title: "나의 실험실" });

    var wrap = el(
      '<div>' +
        '<p class="eyebrow mono">Lab index</p>' +
        '<h1 class="page-title">실험 목록</h1>' +
        '<p class="page-sub">하나씩 만들어보는 개인 실험들. 들어가서 써보고, 마음에 안 들면 갈아엎습니다.</p>' +
        '<div class="lab-list" id="labs"></div>' +
        '<p class="build-stamp mono">build ' + BUILD + '</p>' +
      '</div>'
    );
    setView(wrap);

    var list = wrap.querySelector("#labs");
    LABS.forEach(function(lab){
      var row = el(
        '<button class="lab-row" type="button">' +
          '<span class="lab-mark ' + lab.mark + '">' + icon(lab.iconName) + '</span>' +
          '<span class="lab-text">' +
            '<span class="lab-index mono">' + esc(lab.index) + '</span>' +
            '<span class="lab-name">' + esc(lab.name) + '</span>' +
            '<span class="lab-desc">' + esc(lab.desc) + '</span>' +
          '</span>' +
          icon("go", "lab-go") +
        '</button>'
      );
      tap(row, lab.open);
      list.appendChild(row);
    });

    list.appendChild(el(
      '<div class="lab-row vacant">' +
        '<span class="lab-mark">' + icon("plus") + '</span>' +
        '<span class="lab-text">' +
          '<span class="lab-index mono">EXP 02</span>' +
          '<span class="lab-name">비어 있음</span>' +
          '<span class="lab-desc">다음 실험이 들어갈 자리</span>' +
        '</span>' +
      '</div>'
    ));
  }

  /* ================= travel: list ================= */
  async function renderTrips(){
    setBar({ title: "여행 계획", back: function(){ go({ view: "home" }); } });

    var wrap = el('<div id="trips-body"></div>');
    setView(wrap);

    if (!state.loaded){
      state.trips = await Store.listTrips();
      state.loaded = true;
    }

    if (Store.backend === "local"){
      wrap.appendChild(el(
        '<div class="notice">' + icon("info") +
        '<span>이 브라우저에만 저장돼요. 다른 기기에서는 보이지 않습니다.</span></div>'
      ));
    }

    var trips = state.trips.slice();
    var upcoming = [], past = [];
    trips.forEach(function(t){
      var st = tripStatus(t);
      (st.key === "past" ? past : upcoming).push(t);
    });
    upcoming.sort(function(a, b){ return (a.startDate || "9999").localeCompare(b.startDate || "9999"); });
    past.sort(function(a, b){ return (b.startDate || "").localeCompare(a.startDate || ""); });

    if (trips.length === 0){
      var empty = el(
        '<div class="empty">' +
          '<p>아직 적어둔 여행이 없어요.<br>가고 싶은 곳부터 하나 추가해보세요.</p>' +
          '<button class="btn btn-primary" id="empty-add">' + icon("plus") + '여행 추가</button>' +
        '</div>'
      );
      tap(empty.querySelector("#empty-add"), function(){ go({ view: "trip-new" }); });
      wrap.appendChild(empty);
    } else {
      if (upcoming.length) wrap.appendChild(tripSection("다가오는 여행", upcoming, false));
      if (past.length) wrap.appendChild(tripSection("다녀온 여행", past, true));
    }

    var fab = el('<button class="fab" type="button">' + icon("plus") + '여행 추가</button>');
    tap(fab, function(){ go({ view: "trip-new" }); });
    view.appendChild(fab);
  }

  function tripSection(title, list, isPast){
    var sec = el(
      '<section class="section">' +
        '<div class="section-head"><h2>' + esc(title) + '</h2>' +
        '<span class="section-count mono">' + list.length + '</span></div>' +
        '<div class="trip-list"></div>' +
      '</section>'
    );
    var box = sec.querySelector(".trip-list");
    list.forEach(function(t){
      var st = tripStatus(t);
      /* Nights live on the detail screen; the row keeps only what fits on
         one line so nothing gets clipped mid-word. */
      var meta = [];
      if (t.destination) meta.push(esc(t.destination));
      if (t.startDate) meta.push(fmtDay(t.startDate) + (t.endDate && t.endDate !== t.startDate ? " – " + fmtDay(t.endDate) : ""));

      var row = el(
        '<button class="trip-row' + (isPast ? " past" : "") + '" type="button">' +
          '<span class="trip-text">' +
            '<span class="trip-name">' + esc(t.title) + '</span>' +
            '<span class="trip-meta mono">' + meta.join(' <span class="dot">·</span> ') + '</span>' +
          '</span>' +
          '<span class="dday mono ' + st.cls + '">' + esc(st.label) + '</span>' +
        '</button>'
      );
      tap(row, function(){ go({ view: "trip", tripId: t.id }); });
      box.appendChild(row);
    });
    return sec;
  }

  /* ================= travel: new ================= */
  function renderTripNew(){
    setBar({ title: "여행 추가", back: function(){ go({ view: "trips" }); } });

    var wrap = el(
      '<div>' +
        '<div class="field">' +
          '<label for="f-title">여행 이름</label>' +
          '<input id="f-title" type="text" placeholder="예: 교토 단풍 보러">' +
        '</div>' +
        '<div class="field">' +
          '<label for="f-dest">목적지</label>' +
          '<input id="f-dest" type="text" placeholder="예: 일본 교토">' +
        '</div>' +
        '<div class="field-pair">' +
          '<div class="field">' +
            '<label for="f-start">출발일</label>' +
            '<input id="f-start" type="date">' +
          '</div>' +
          '<div class="field">' +
            '<label for="f-end">도착일</label>' +
            '<input id="f-end" type="date">' +
          '</div>' +
        '</div>' +
        '<p class="field-note">날짜는 나중에 정해도 됩니다. 이름만 있으면 저장돼요.</p>' +
        '<div style="height:18px"></div>' +
        '<button class="btn btn-primary btn-block" id="save" disabled>저장</button>' +
      '</div>'
    );
    setView(wrap);

    var titleEl = wrap.querySelector("#f-title");
    var destEl = wrap.querySelector("#f-dest");
    var startEl = wrap.querySelector("#f-start");
    var endEl = wrap.querySelector("#f-end");
    var saveBtn = wrap.querySelector("#save");

    function validate(){ saveBtn.disabled = !titleEl.value.trim(); }
    titleEl.addEventListener("input", validate);
    startEl.addEventListener("change", function(){
      if (startEl.value && (!endEl.value || endEl.value < startEl.value)) endEl.value = startEl.value;
    });

    saveBtn.addEventListener("click", async function(){
      if (saveBtn.disabled) return;
      saveBtn.disabled = true;
      saveBtn.textContent = "저장 중...";
      try{
        var created = await Store.addTrip({
          title: titleEl.value.trim(),
          destination: destEl.value.trim(),
          startDate: startEl.value || null,
          endDate: endEl.value || startEl.value || null,
          createdAt: new Date().toISOString()
        });
        state.trips.push(created);
        toast("여행을 추가했어요.");
        go({ view: "trip", tripId: created.id });
      }catch(e){
        toast("저장하지 못했어요. 다시 시도해주세요.");
        saveBtn.disabled = false;
        saveBtn.textContent = "저장";
      }
    });
  }

  /* ================= travel: detail ================= */
  function renderTrip(){
    var t = state.trips.filter(function(x){ return x.id === state.tripId; })[0];
    if (!t){ go({ view: "trips" }); return; }

    var del = tap(el('<button class="icon-btn danger" aria-label="삭제">' + icon("trash") + '</button>'), async function(){
      var ok = await confirmDialog({
        title: "이 여행을 지울까요?",
        body: "지우면 되돌릴 수 없습니다.",
        ok: "삭제",
        danger: true
      });
      if (!ok) return;
      await Store.deleteTrip(t.id);
      state.trips = state.trips.filter(function(x){ return x.id !== t.id; });
      toast("삭제했어요.");
      go({ view: "trips" });
    });

    setBar({ title: "여행", back: function(){ go({ view: "trips" }); }, actions: [del] });

    var st = tripStatus(t);
    var n = nights(t.startDate, t.endDate);

    var wrap = el(
      '<div>' +
        '<div class="detail-head">' +
          '<h1 class="detail-name">' + esc(t.title) + '</h1>' +
          '<div class="detail-badges">' +
            '<span class="dday mono ' + st.cls + '">' + esc(st.label) + '</span>' +
            (n !== null && n > 0 ? '<span class="dday mono">' + n + '박 ' + (n + 1) + '일</span>' : "") +
          '</div>' +
        '</div>' +
        '<div class="fact-list">' +
          '<div class="fact">' + icon("pin") +
            '<div class="fact-body"><p class="fact-label">목적지</p>' +
            '<p class="fact-value">' + (t.destination ? esc(t.destination) : "아직 미정") + '</p></div>' +
          '</div>' +
          '<div class="fact">' + icon("calendar") +
            '<div class="fact-body"><p class="fact-label">일정</p>' +
            '<p class="fact-value mono">' + (t.startDate
              ? fmtDay(t.startDate) + (t.endDate && t.endDate !== t.startDate ? " – " + fmtDay(t.endDate) : "")
              : "날짜 미정") + '</p></div>' +
          '</div>' +
          '<div class="fact">' + icon("clock") +
            '<div class="fact-body"><p class="fact-label">등록</p>' +
            '<p class="fact-value mono">' + esc(fmtDay((t.createdAt || "").slice(0, 10))) + '</p></div>' +
          '</div>' +
        '</div>' +
        '<div class="stub-note">' +
          '<strong>여기부터가 비어 있습니다.</strong><br>' +
          '일정표, 예산, 준비물, 지도 — 어떤 걸 넣을지 정해서 알려주시면 이 아래에 붙입니다.' +
        '</div>' +
      '</div>'
    );
    setView(wrap);
  }

  /* ================= render ================= */
  function render(){
    closeOverlay();
    if (state.view === "home") renderHome();
    else if (state.view === "trips") renderTrips();
    else if (state.view === "trip-new") renderTripNew();
    else if (state.view === "trip") renderTrip();
  }

  (async function boot(){
    await Store.init();
    render();
  })();
})();
</script>
