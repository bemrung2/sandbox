<!--
  The page shell. Everything else lives in modules:

    src/ui/     the parts every screen is made of
    src/plan/   the plan: its data, its screens, where you are in it
    src/app.js  the address, and which screen it means

  Two targets come out of this one source:

  - Claude Artifact: published with its module files alongside it.
  - Static hosting (Vercel): `node build.js` writes index.html with a real
    <head>. Without that wrapper a phone lays the page out at 980px and
    shrinks it to fit.

  Never serve this file directly. Edit here; run the build; never hand-edit
  index.html.
-->
<!--head-->
<title>여행 계획</title>
<meta name="description" content="같이 보고 같이 고치는 여행 계획.">
<!-- The web fonts must never hold up the first paint: the stack falls back to
     the system font, and the page swaps when they arrive. 500 is not used. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&family=IBM+Plex+Mono:wght@400;600;700&display=swap">
<noscript><link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&family=IBM+Plex+Mono:wght@400;600;700&display=swap"></noscript>
<link rel="stylesheet" href="style/core.css">
<link rel="stylesheet" href="plan/plan.css">
<!--/head-->
<!--body-->
<div class="app">
  <!-- The waiting state is written here, not drawn by script: this way it is
       on screen with the first paint, before a single module has arrived.
       The first real render replaces it. -->
  <div id="view">
    <div class="pad">
      <div class="page-head"><div class="page-title"><h1>여행 계획</h1></div></div>
      <div class="trip-list">
        <div class="trip-card ghost">
          <span class="bar bar-s"></span><span class="bar bar-m"></span><span class="bar bar-l"></span>
        </div>
        <div class="trip-card ghost">
          <span class="bar bar-s"></span><span class="bar bar-m"></span><span class="bar bar-l"></span>
        </div>
      </div>
    </div>
  </div>
</div>
<div id="overlay"></div>
<div class="toast" id="toast"></div>
<script type="module" src="app.js"></script>
<!--/body-->
