<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F6F7F9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101115" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="여행 계획">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>여행 계획</title>
<meta name="description" content="같이 보고 같이 고치는 여행 계획.">
<!-- The web fonts must never hold up the first paint: the stack falls back to
     the system font, and the page swaps when they arrive. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@600;700&family=IBM+Plex+Mono:wght@400;600;700&display=swap">
<noscript><link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@600;700&family=IBM+Plex+Mono:wght@400;600;700&display=swap"></noscript>
<link rel="stylesheet" href="style/core.css">
<link rel="stylesheet" href="plan/plan.css">
</head>
<body>
<div class="app">
  <!-- The waiting state is written here, not drawn by script: this way it is
       on screen with the first paint, before a single module has arrived.
       The first real render replaces it. -->
  <div id="view">
    <div class="pad">
      <div class="page-head"><div class="page-title"><h1>여행 계획</h1></div></div>
      <div class="trip-list">
        <div class="trip-card ghost">
          <span class="bar bar-s"></span><span class="bar bar-m"></span><span class="bar bar-l"></span>
        </div>
        <div class="trip-card ghost">
          <span class="bar bar-s"></span><span class="bar bar-m"></span><span class="bar bar-l"></span>
        </div>
      </div>
    </div>
  </div>
</div>
<div id="overlay"></div>
<div class="toast" id="toast"></div>
<script type="module" src="app.js"></script>
</body>
</html>
