<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F6F7F9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101115" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="나의 실험실">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>BEMLAB</title>
<meta name="description" content="실험을 하나씩 만들어 모아두는 개인 실험실. 첫 실험은 후쿠오카 여행 계획표.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap">
<style>
  :root{
    --paper: #F6F7F9;
    --surface: #FFFFFF;
    --surface-2: #EDEFF4;
    --surface-3: #E1E5EC;
    --ink: #14161B;
    --ink-soft: #545A66;
    --ink-faint: #6E7583;
    --line: #E1E4EA;
    --line-strong: #C6CBD5;

    --signal: #3446B5;
    --signal-soft: #E4E7FA;
    --on-signal: #FFFFFF;
    --travel: #9A6224;
    --travel-soft: #F7E7D3;
    --danger: #A32C22;
    --airline: #D4541A;

    --c-air: #3E6FA8;
    --c-move: #667A86;
    --c-food: #B26A22;
    --c-shop: #9B3F6A;
    --c-stay: #157F6C;
    --c-free: #6B54B5;
    --c-todo: #6E7671;

    --shadow: rgba(18, 22, 32, 0.10);
    --scrim: rgba(14, 16, 24, 0.44);

    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-t: env(safe-area-inset-top, 0px);
  }

  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper: #101115;
      --surface: #171A20;
      --surface-2: #1E2129;
      --surface-3: #282D36;
      --ink: #E9EBF0;
      --ink-soft: #A0A6B2;
      --ink-faint: #717784;
      --line: #24272F;
      --line-strong: #373C47;

      --signal: #97A6FF;
      --signal-soft: #1F2550;
      --on-signal: #0A0F2E;
      --travel: #E3A96C;
      --travel-soft: #3D2F1C;
      --danger: #FF9E92;
      --airline: #FF8E5E;

      --c-air: #8FB8E8;
      --c-move: #A3B2BC;
      --c-food: #E3A96C;
      --c-shop: #E38BB4;
      --c-stay: #5FD3C0;
      --c-free: #AE9BF0;
      --c-todo: #9DA9A3;

      --shadow: rgba(0, 0, 0, 0.5);
      --scrim: rgba(0, 0, 0, 0.62);
    }
  }
  :root[data-theme="dark"]{
    --paper: #101115;
    --surface: #171A20;
    --surface-2: #1E2129;
    --surface-3: #282D36;
    --ink: #E9EBF0;
    --ink-soft: #A0A6B2;
    --ink-faint: #717784;
    --line: #24272F;
    --line-strong: #373C47;

    --signal: #97A6FF;
    --signal-soft: #1F2550;
    --on-signal: #0A0F2E;
    --travel: #E3A96C;
    --travel-soft: #3D2F1C;
    --danger: #FF9E92;
    --airline: #FF8E5E;

    --c-air: #8FB8E8;
    --c-move: #A3B2BC;
    --c-food: #E3A96C;
    --c-shop: #E38BB4;
    --c-stay: #5FD3C0;
    --c-free: #AE9BF0;
    --c-todo: #9DA9A3;

    --shadow: rgba(0, 0, 0, 0.5);
    --scrim: rgba(0, 0, 0, 0.62);
  }

  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  button, label, a, summary{ touch-action: manipulation; }

  html{ height: 100%; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body{
    min-height: 100%;
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "IBM Plex Sans KR", system-ui, -apple-system, sans-serif;
    font-size: 15px;
    line-height: 1.55;
    display: flex;
    justify-content: center;
    /* the page scrolls one way only */
    overflow-x: hidden;
  }

  .app{ width: 100%; max-width: 440px; min-width: 0; background: var(--paper); }
  .mono{ font-family: "IBM Plex Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  .icon{ width: 22px; height: 22px; display: block; flex-shrink: 0; }

  /* No app bar and no back button: the title line carries the only control,
     so the screen starts at the content. */
  .icon-btn{
    width: 40px; height: 40px;
    border: none; background: transparent; color: var(--ink);
    border-radius: 20px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; flex-shrink: 0;
  }
  .icon-btn:hover, .icon-btn.tapped{ background: var(--surface-2); }
  .icon-btn:focus-visible{ outline: 2px solid var(--signal); outline-offset: 2px; }
  .icon-btn .icon{ width: 20px; height: 20px; }

  /* ---------- home ---------- */
  .pad{ padding: calc(var(--safe-t) + 18px) 18px 0; }
  .wordmark-row{ display: flex; align-items: center; gap: 8px; }
  .wordmark{
    flex: 1; min-width: 0;
    font-family: "IBM Plex Mono", monospace;
    font-size: 21px; font-weight: 700; letter-spacing: 0.18em;
    margin: 0 0 2px;
  }
  .wordmark-sub{ font-size: 12px; color: var(--ink-faint); margin: 0 0 26px; letter-spacing: 0.02em; }

  .lab-list{ display: flex; flex-direction: column; gap: 10px; }
  .lab-row{
    display: flex; align-items: center; gap: 14px;
    width: 100%; padding: 16px;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 20px;
    color: inherit; text-align: left; font: inherit; cursor: pointer;
  }
  .lab-row.tapped{ background: var(--surface-2); }
  .lab-row:focus-visible{ outline: 2px solid var(--signal); outline-offset: 2px; }
  .lab-mark{
    width: 44px; height: 44px; border-radius: 14px;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    background: var(--travel-soft); color: var(--travel);
  }
  .lab-text{ flex: 1; min-width: 0; }
  .lab-index{ display: block; font-size: 10.5px; letter-spacing: 0.12em; color: var(--ink-faint); }
  .lab-name{ display: block; font-size: 16px; font-weight: 600; margin-top: 1px; }
  .lab-desc{ display: block; font-size: 12.5px; color: var(--ink-soft); margin-top: 3px; }
  .lab-go{ color: var(--ink-faint); }
  .lab-row.vacant{
    cursor: default; background: transparent; border-style: dashed; color: var(--ink-faint);
  }
  .lab-row.vacant .lab-mark{ background: var(--surface-2); color: var(--ink-faint); }
  .build-stamp{ margin: 18px 0 30px; font-size: 10.5px; color: var(--ink-faint); text-align: center; }
  .moverow{ display: flex; justify-content: center; gap: 4px; margin-top: 22px; flex-wrap: wrap; }
  .linkbtn{
    display: inline-flex; align-items: center; gap: 5px;
    border: none; background: transparent; color: var(--ink-faint);
    font: inherit; font-size: 12px; font-weight: 600;
    padding: 7px 11px; border-radius: 999px; cursor: pointer;
  }
  .linkbtn .icon{ width: 14px; height: 14px; }
  .linkbtn:hover, .linkbtn.tapped{ color: var(--signal); background: var(--surface-2); }

  /* ---------- trip list ---------- */
  .page-head{ display: flex; align-items: center; gap: 4px; margin: 0 0 22px; }
  .page-head .back{ margin-left: -10px; }
  .page-title{ flex: 1; min-width: 0; }
  .page-kicker{ display: block; font-size: 10.5px; letter-spacing: 0.12em; color: var(--ink-faint); }
  .page-title h1{ font-size: 22px; font-weight: 700; letter-spacing: -0.02em; margin: 0; }

  .trip-list{ display: flex; flex-direction: column; gap: 12px; }
  .trip-card{
    display: flex; flex-direction: column;
    width: 100%; padding: 16px 16px 13px;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 22px;
    font: inherit; color: inherit; text-align: left; cursor: pointer;
  }
  .trip-card.tapped{ background: var(--surface-2); }
  .trip-card:focus-visible{ outline: 2px solid var(--signal); outline-offset: 2px; }
  .trip-card.live{ border-color: var(--travel); }
  .trip-card.past{ opacity: 0.66; }

  .trip-top{ display: flex; align-items: center; gap: 11px; }
  .trip-flag{
    width: 42px; height: 42px; border-radius: 14px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: var(--surface-2); font-size: 21px; line-height: 1;
    color: var(--ink-faint);
  }
  .trip-id{ flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .trip-city{ font-size: 18px; font-weight: 700; letter-spacing: -0.02em; }
  .trip-country{ font-size: 10.5px; letter-spacing: 0.14em; color: var(--ink-faint); }
  .trip-status{
    flex-shrink: 0; font-size: 11px; font-weight: 700; letter-spacing: 0.02em;
    padding: 4px 10px; border-radius: 9px;
    background: var(--surface-2); color: var(--ink-soft);
  }
  .trip-status.soon{ background: var(--signal-soft); color: var(--signal); }
  .trip-status.live{ background: var(--travel); color: var(--paper); }

  .trip-dates{
    display: flex; align-items: center; gap: 7px; flex-wrap: wrap;
    font-size: 12px; color: var(--ink-soft); margin-top: 13px;
  }
  .trip-nights{
    font-family: "IBM Plex Sans KR", system-ui, sans-serif;
    font-size: 11px; padding: 2px 7px; border-radius: 7px;
    background: var(--surface-2); color: var(--ink-faint);
  }
  .trip-theme{
    font-size: 12.5px; color: var(--ink-faint); margin-top: 6px;
    word-break: keep-all; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .trip-stats{
    display: flex; align-items: center; gap: 14px;
    margin-top: 13px; padding-top: 11px; border-top: 1px solid var(--line);
  }
  .trip-stat{ font-size: 11px; color: var(--ink-faint); }
  .trip-stat b{ font-size: 13px; font-weight: 700; color: var(--ink-soft); margin-right: 3px; }
  .trip-go{ margin-left: auto; color: var(--ink-faint); display: flex; }
  .trip-add{ margin-top: 2px; }

  /* ---------- trip header ---------- */
  .hero{ padding: calc(var(--safe-t) + 16px) 18px 14px; }
  .hero-top{ display: flex; align-items: baseline; gap: 9px; }
  .hero-top .icon-btn{ align-self: center; }
  /* The way back sits on the title line — no app bar, no extra row. */
  .hero-back{ margin-left: -10px; margin-right: -2px; color: var(--ink-soft); }
  .hero-top .icon-btn:last-child{ margin-left: auto; }
  .hero-flag{ margin-right: 6px; }
  .hero-city{ font-size: 28px; font-weight: 700; letter-spacing: -0.03em; margin: 0; }
  .hero-country{ font-size: 11.5px; color: var(--ink-faint); letter-spacing: 0.14em; }
  .hero-dates{
    display: flex; align-items: center; gap: 6px;
    font-size: 13px; color: var(--ink-soft); margin: 5px 0 0;
  }

  .countdown{
    display: flex; align-items: center; gap: 11px;
    margin-top: 14px; padding: 13px 15px; border-radius: 18px;
    background: var(--signal-soft); color: var(--signal);
  }
  .countdown.live{ background: var(--travel-soft); color: var(--travel); }
  .countdown-big{ font-size: 19px; font-weight: 700; }
  .countdown-sub{ font-size: 12px; opacity: 0.9; }

  /* ---------- tabs ---------- */
  .tabs{
    position: sticky; top: var(--safe-t); z-index: 15;
    display: flex; padding: 0 10px;
    background: var(--paper); border-bottom: 1px solid var(--line);
  }
  .tab{
    flex: 1; min-width: 0; padding: 14px 2px 12px;
    border: none; background: transparent; color: var(--ink-faint);
    font: inherit; font-size: 13.5px; font-weight: 600; cursor: pointer;
    border-bottom: 2.5px solid transparent; margin-bottom: -1px;
  }
  .tab[aria-selected="true"]{ color: var(--signal); border-bottom-color: var(--signal); }
  .tab:focus-visible{ outline: 2px solid var(--signal); outline-offset: -3px; }

  /* ---------- day switch ---------- */
  .dayrow{ display: flex; gap: 8px; padding: 16px 18px 0; overflow-x: auto; }
  .dayrow::-webkit-scrollbar{ display: none; }
  .daybtn{
    flex: 1 1 0; min-width: 74px; padding: 9px 6px;
    border: 1px solid var(--line-strong); border-radius: 14px;
    background: transparent; color: var(--ink-soft);
    font: inherit; font-size: 12px; font-weight: 600; cursor: pointer; line-height: 1.35;
  }
  .daybtn b{ display: block; font-size: 14px; font-weight: 700; }
  .daybtn[aria-pressed="true"]{ background: var(--signal); color: var(--on-signal); border-color: var(--signal); }
  .daybtn.today:not([aria-pressed="true"]){ border-color: var(--signal); color: var(--signal); }
  .daybtn:focus-visible{ outline: 2px solid var(--signal); outline-offset: 2px; }

  .theme-row{
    display: flex; align-items: center; gap: 8px;
    margin: 16px 18px 0; padding: 12px 14px;
    background: var(--surface-2); border-radius: 16px;
    border: none; width: calc(100% - 36px);
    font: inherit; text-align: left; color: inherit; cursor: pointer;
  }
  .theme-row.tapped{ background: var(--surface-3); }
  .theme-row:focus-visible{ outline: 2px solid var(--signal); outline-offset: 2px; }
  .theme-body{ flex: 1; min-width: 0; }
  .theme-label{ display: block; font-size: 10.5px; letter-spacing: 0.1em; color: var(--ink-faint); }
  .theme-text{ display: block; font-size: 14.5px; font-weight: 600; margin-top: 1px; word-break: keep-all; }
  .theme-text.empty{ color: var(--ink-faint); font-weight: 400; }
  .theme-row .icon{ width: 15px; height: 15px; color: var(--ink-faint); }

  /* ---------- day route ---------- */
  .routerow{
    display: flex; align-items: flex-start; gap: 9px;
    margin: 8px 18px 0; padding: 11px 14px;
    width: calc(100% - 36px);
    background: transparent; border: 1px dashed var(--line-strong); border-radius: 16px;
    font: inherit; text-align: left; color: inherit; cursor: pointer;
  }
  .routerow.tapped{ background: var(--surface-2); }
  .routerow:focus-visible{ outline: 2px solid var(--signal); outline-offset: 2px; }
  .route-label{
    flex-shrink: 0; font-size: 10px; letter-spacing: 0.1em; color: var(--ink-faint);
    padding-top: 3px;
  }
  .route-chain{ flex: 1; min-width: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 0; }
  .route-seg{ display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; margin-right: 5px; }
  .route-chain.empty{ font-size: 12.5px; color: var(--ink-faint); }
  .route-stop{
    font-size: 11.5px; line-height: 1.3; padding: 3px 8px; border-radius: 8px;
    background: var(--surface-2); color: var(--ink-soft); word-break: keep-all;
  }
  .route-arrow{ font-size: 10.5px; color: var(--ink-faint); }
  .route-stop{ white-space: normal; }
  .route-pen{ width: 14px; height: 14px; color: var(--ink-faint); flex-shrink: 0; margin-top: 3px; }

  .day-stat{ font-size: 11.5px; color: var(--ink-faint); margin: 10px 18px 0; }

  /* ---------- now banner ---------- */
  .now{ margin: 12px 18px 0; border: 1px solid var(--travel); border-radius: 16px; overflow: hidden; }
  .now-part{ display: flex; gap: 10px; padding: 11px 13px; align-items: flex-start; }
  .now-part + .now-part{ border-top: 1px solid var(--line); }
  .now-tag{
    font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em;
    padding: 2px 8px; border-radius: 6px; flex-shrink: 0; margin-top: 2px;
  }
  .now-tag.on{ background: var(--travel); color: var(--paper); }
  .now-tag.next{ background: var(--surface-2); color: var(--ink-soft); }
  .now-title{ font-size: 14px; font-weight: 600; margin: 0; }
  .now-time{ font-size: 11.5px; color: var(--ink-faint); margin: 1px 0 0; }

  /* ---------- timeline ---------- */
  .tl{ padding: 10px 18px 0; }
  .tl-item{ display: flex; gap: 11px; align-items: stretch; }
  .tl-time{
    width: 44px; flex-shrink: 0; padding-top: 13px;
    font-size: 12.5px; font-weight: 600; line-height: 1.25; text-align: right;
  }
  .tl-time small{ display: block; font-size: 10.5px; font-weight: 400; color: var(--ink-faint); }

  .tl-rail{ width: 13px; flex-shrink: 0; position: relative; display: flex; justify-content: center; }
  .tl-rail::before{ content: ""; position: absolute; top: 0; bottom: 0; width: 1px; background: var(--line); }
  .tl-item:first-child .tl-rail::before{ top: 17px; }
  .tl-dot{
    position: relative; margin-top: 13px;
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--paper); border: 2px solid var(--c-todo);
  }

  .tl-body{ flex: 1; min-width: 0; padding: 11px 0 14px; border-bottom: 1px solid var(--line); }
  .tl-title{ font-size: 14.5px; font-weight: 600; margin: 0; word-break: keep-all; }
  .tl-title .emo, .card-name .emo{ margin-right: 4px; }
  .tl-line{ font-size: 12.5px; color: var(--ink-soft); margin: 3px 0 0; word-break: keep-all; }
  .tl-line::before{ content: "— "; color: var(--ink-faint); }
  .tl-meta{ display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .tl-actions{ margin-left: auto; display: flex; gap: 2px; flex-shrink: 0; }
  .tl-item.current .tl-body{
    background: var(--travel-soft);
    margin-left: -10px; padding-left: 10px; padding-right: 10px;
    border-radius: 14px; border-bottom-color: transparent;
  }

  .placelink{ color: inherit; text-decoration: none; border-bottom: 1px dashed var(--line-strong); padding-bottom: 1px; }
  .placelink .pinch{
    width: 12px; height: 12px; display: inline-block;
    vertical-align: -1px; margin-left: 3px; color: var(--ink-faint);
  }
  .placelink:hover{ border-bottom-color: var(--signal); }

  /* ---------- attachments ---------- */
  .att{ margin-top: 10px; display: flex; flex-direction: column; gap: 7px; }
  .att-photos{ display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
  .att-photos::-webkit-scrollbar{ display: none; }
  .att-thumb{
    width: 68px; height: 68px; flex-shrink: 0;
    border-radius: 12px; border: 1px solid var(--line);
    background: var(--surface-2); object-fit: cover; cursor: pointer; padding: 0; display: block;
  }
  .att-note{
    font-size: 12.5px; color: var(--ink-soft);
    border-left: 2px solid var(--line-strong); padding: 1px 0 1px 10px;
    white-space: pre-wrap; word-break: break-word;
  }
  .att-link{
    display: inline-flex; align-items: center; gap: 6px;
    align-self: flex-start; max-width: 100%;
    background: var(--surface-2); color: var(--ink);
    border-radius: 10px; padding: 7px 11px;
    font-size: 12.5px; font-weight: 600; text-decoration: none;
  }
  .att-link .icon{ width: 14px; height: 14px; color: var(--signal); }
  .att-link span{ overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .quietbtn{
    display: inline-flex; align-items: center; gap: 4px;
    border: none; background: transparent; color: var(--ink-faint);
    font: inherit; font-size: 11.5px; font-weight: 600;
    padding: 4px 7px; cursor: pointer; border-radius: 8px;
  }
  .quietbtn .icon{ width: 13px; height: 13px; }
  .quietbtn:hover, .quietbtn.tapped{ color: var(--signal); background: var(--surface-2); }
  .quietbtn:focus-visible{ outline: 2px solid var(--signal); outline-offset: 1px; }
  .quietbtn.has{ color: var(--signal); }

  /* ---------- add affordances ---------- */
  .tl-add{ display: flex; gap: 11px; align-items: stretch; }
  .tl-add .tl-time{ color: transparent; }
  .tl-add .tl-rail::before{ bottom: calc(100% - 17px); }
  .tl-add .tl-dot{ border-style: dashed; border-color: var(--line-strong); }
  .addrow{
    flex: 1; display: flex; align-items: center; gap: 7px;
    border: none; background: transparent; color: var(--ink-faint);
    font: inherit; font-size: 13px; font-weight: 600;
    padding: 12px 0; cursor: pointer; text-align: left;
  }
  .addrow .icon{ width: 16px; height: 16px; }
  .addrow:hover, .addrow.tapped{ color: var(--signal); }

  .addcard{
    display: flex; align-items: center; justify-content: center; gap: 7px;
    width: calc(100% - 36px); margin: 6px 18px 0;
    border: 1px dashed var(--line-strong); border-radius: 16px;
    background: transparent; color: var(--ink-faint);
    font: inherit; font-size: 13.5px; font-weight: 600; padding: 15px; cursor: pointer;
  }
  .addcard .icon{ width: 16px; height: 16px; }
  .addcard:hover, .addcard.tapped{ color: var(--signal); border-color: var(--signal); }

  /* ---------- chips ---------- */
  .chiprow{ display: flex; gap: 7px; padding: 16px 18px 2px; overflow-x: auto; }
  .chiprow::-webkit-scrollbar{ display: none; }
  .chip{
    flex-shrink: 0;
    border: 1px solid var(--line-strong); border-radius: 999px;
    background: transparent; color: var(--ink-soft);
    padding: 8px 15px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .chip[aria-pressed="true"]{ background: var(--signal-soft); color: var(--signal); border-color: transparent; }
  .chip:focus-visible{ outline: 2px solid var(--signal); outline-offset: 2px; }

  .badge{
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 11px; font-weight: 600;
    padding: 3px 9px; border-radius: 8px;

  /* ================= time ================= */
  /* Korea and Japan share UTC+9, so the device clock needs no conversion. */
  function mins(hhmm){
    if (!hhmm) return null;
    var p = String(hhmm).split(":");

  }
  function isoOf(d){
    return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
  }

  function dowOf(iso){ return DOW[new Date(iso + "T00:00:00").getDay()]; }

  /* ================= saved state ================= */
  /* Three places this page can keep a plan, and one shape for all of them:
     a flat map of document path to body.

       trips/<id>                    여행
       trips/<id>/days/<YYYY-MM-DD>  그날 요약 + 동선
       trips/<id>/items/<id>         일정 하나
       trips/<id>/<목록>/<id>         가게 · 항공 · 숙소 · 예약 · 링크 · 준비물 · 메모
       trips/<id>/attach/<id>        일정에 붙인 자료
       photos/<id>                   사진 한 장 (동기화에서 제외 — 무겁다)

     A record is a document, so an edit writes one path and two people
     editing different things never overwrite each other.

       LocalStore     이 브라우저에만. 혼자 쓰는 사본.
       ArtifactStore  아티팩트 저장소. 아티팩트를 함께 보는 사람과 공유.
       RemoteStore    /api/plan. 링크를 아는 사람이면 누구나 같은 계획.

     What you have OPEN is never in the store — it stays in this browser, or
     one person tapping a trip would drag everyone else's screen along. */
  var LISTS = ["items", "shops", "flights", "stays", "books", "links", "packList", "notes"];
  var GROUPS = ["days", "attach"].concat(LISTS);
  var LOCAL_KEY = "lab.fukuoka2026";

  function byOrd(a, b){
    return (a.ord || 0) - (b.ord || 0) || String(a.id).localeCompare(String(b.id));
  }
  function ordered(list){ return (list || []).slice().sort(byOrd); }

  function metaOf(t){
    return { emoji: t.emoji || "", city: t.city, country: t.country || "", start: t.start, end: t.end };
  }
  function bodyOf(rec){
    var body = Object.assign({}, rec);
    delete body.id;
    return body;
  }

  /* ---------- the map is the truth; trips are a reading of it ---------- */
  function modelFrom(map){
    var trips = {};
    function tripFor(id){
      return trips[id] || (trips[id] = { t: newTrip({ id: id }), meta: false });
    }
    Object.keys(map).forEach(function(path){
      var body = map[path];
      if (!body) return;                       /* deleted */
      var p = path.split("/");
      if (p[0] !== "trips" || !p[1]) return;
      var slot = tripFor(p[1]), t = slot.t;
      if (p.length === 2){
        if (body.trips || !body.city) return;  /* the old whole-plan document */
        Object.assign(t, metaOf(body));
        slot.meta = true;
      } else if (p[2] === "days" && p[3]){
        if (body.theme) t.dayThemes[p[3]] = body.theme;
        if (body.route && body.route.length) t.dayRoutes[p[3]] = body.route;
      } else if (p[2] === "attach" && p[3]){
        var a = Object.assign({ id: p[3] }, body);
        (t.attach[a.itemId] = t.attach[a.itemId] || []).push(a);
      } else if (LISTS.indexOf(p[2]) >= 0 && p[3]){
        t[p[2]].push(Object.assign({ id: p[3] }, body));
      }
    });
    return Object.keys(trips)
      .filter(function(id){ return trips[id].meta; })
      .map(function(id){ return trips[id].t; });
  }

  function tripToMap(t, into){
    var base = "trips/" + t.id + "/";
    into["trips/" + t.id] = metaOf(t);
    var days = {};
    Object.keys(t.dayThemes || {}).concat(Object.keys(t.dayRoutes || {})).forEach(function(d){ days[d] = true; });
    Object.keys(days).forEach(function(d){
      into[base + "days/" + d] = { theme: t.dayThemes[d] || "", route: t.dayRoutes[d] || [] };
    });
    LISTS.forEach(function(key){
      (t[key] || []).forEach(function(rec, i){
        into[base + key + "/" + rec.id] = bodyOf(Object.assign({ ord: i }, rec));
      });
    });
    Object.keys(t.attach || {}).forEach(function(itemId){
      (t.attach[itemId] || []).forEach(function(a){
        into[base + "attach/" + a.id] = Object.assign(bodyOf(a), { itemId: itemId });
      });
    });
    return into;
  }

  /* Older saves kept the whole plan in one document. Fold whatever is there
     into the map; the Fukuoka itinerary itself was rewritten by hand since,
     so for the oldest shape the seed wins and only what the user typed is
     carried across. */
  function mapFromLegacy(raw){
    var out = {};
    var trips;
    if (raw.trips && raw.trips.length){
      var attach = raw.attach || {};
      trips = raw.trips.map(function(x){
        var t = newTrip(x);
        t.attach = x.attach || {};
        (t.items || []).forEach(function(it){ if (attach[it.id]) t.attach[it.id] = attach[it.id]; });
        return t;
      });
    } else {
      var t = seedTrip();
      if (raw.attach) t.attach = raw.attach;
      if (raw.trip && raw.trip.city){
        t.city = raw.trip.city;
        t.country = raw.trip.country || t.country;
      }
      if (raw.links && raw.links.length) t.links = raw.links;
      if (raw.flights && raw.flights.length) t.flights = raw.flights;
      if (raw.stays && raw.stays.length) t.stays = raw.stays;
      if (raw.books && raw.books.length) t.books = raw.books;
      if (raw.notes && raw.notes.length){
        t.notes = raw.notes.map(function(n){
          return typeof n === "string" ? { id: uid("n"), text: n } : n;
        });
      }
      if (raw.packList && raw.packList.length){
        t.packList = raw.packList.map(function(k, i){
          return typeof k === "string"
            ? { id: uid("k"), text: k, on: !!(raw.pack && raw.pack[k]), ord: i }
            : Object.assign({ ord: i }, k);
        });
      }
      if (raw.shops && raw.shops.length){
        var kept = {};
        raw.shops.forEach(function(sh){ if (sh.items && sh.items.length) kept[sh.name] = sh.items; });
        t.shops.forEach(function(sh){ if (kept[sh.name]) sh.items = kept[sh.name]; });
      }
      trips = [t];
    }
    trips.forEach(function(t){ tripToMap(t, out); });
    out["meta/store"] = { v: DATA_V, seeded: true };
    return out;
  }

  LocalStore.prototype.write = function(path, body){

    this._t = setTimeout(function(){
      try{
        localStorage.setItem(LOCAL_KEY, JSON.stringify({ v: DATA_V, seeded: true, docs: self.map }));
      }catch(e){ /* private mode; the plan stays in memory */ }

  LocalStore.prototype.blobPut = async function(pid, data){ localStorage.setItem("lab.photo." + pid, data); };
  LocalStore.prototype.blobGet = async function(pid){ return localStorage.getItem("lab.photo." + pid); };

  /* ---------- store: the artifact's own ---------- */
  function ArtifactStore(db){
    this.kind = "artifact";
    this.shared = true;
    this.label = "함께 쓰는 저장소";
    this.db = db;
    this.map = {};
    this.subs = {};
    this.cb = null;
  }
  ArtifactStore.prototype.open = async function(){
    var meta = await this.db.doc("meta/store").get();
    if (meta.exists) this.map["meta/store"] = meta.data();
    var snap = await this.db.collection("trips").get();
    for (var i = 0; i < snap.docs.length; i++){
      var d = snap.docs[i], body = d.data() || {};
      this.map["trips/" + d.id] = body;
      if (body.trips || !body.city) continue;        /* a legacy document, not a trip */
      await this.readTrip(d.id);
    }
  };
  ArtifactStore.prototype.readTrip = async function(id){
    var base = "trips/" + id + "/", self = this;
    for (var i = 0; i < GROUPS.length; i++){
      var group = GROUPS[i];
      var snap = await this.db.collection(base + group).get();
      snap.docs.forEach(function(d){ self.map[base + group + "/" + d.id] = d.data(); });
    }
  };
  ArtifactStore.prototype.write = function(path, body){
    if (body === null){
      delete this.map[path];
      this.db.doc(path).delete().catch(function(){ Saved.failed(); });
    } else {
      this.map[path] = body;
      this.db.doc(path).set(body).catch(function(){ Saved.failed(); });
    }
  };
  ArtifactStore.prototype.lease = async function(){
    var got = await this.db.doc("meta/store").acquire({ holder: uid("w"), ttlMs: 30000 });
    return !!got.acquired;
  };
  ArtifactStore.prototype.watch = function(cb){
    var self = this;
    this.cb = cb;
    this.subs.__list = [this.db.collection("trips").onSnapshot(function(snap){
      var seen = {};
      snap.docs.forEach(function(d){
        seen[d.id] = true;
        var body = d.data() || {};
        self.map["trips/" + d.id] = body;
        if (body.trips || !body.city) return;
        if (self.subs[d.id]) return;
        self.readTrip(d.id).then(function(){ self.watchTrip(d.id); cb(); });
      });
      Object.keys(self.subs).forEach(function(id){
        if (id === "__list" || seen[id]) return;
        self.unwatchTrip(id);
        self.forget("trips/" + id);
      });
      cb();
    }, function(){ /* the listener is gone; what is on screen still works */ })];
    Object.keys(this.map).forEach(function(path){
      var p = path.split("/");
      if (p[0] === "trips" && p.length === 2) self.watchTrip(p[1]);
    });
  };
  ArtifactStore.prototype.forget = function(prefix){
    var self = this;
    Object.keys(this.map).forEach(function(path){
      if (path === prefix || path.indexOf(prefix + "/") === 0) delete self.map[path];
    });
  };
  ArtifactStore.prototype.subCount = function(){
    var n = 0, self = this;
    Object.keys(this.subs).forEach(function(k){ n += self.subs[k].length; });
    return n;
  };
  ArtifactStore.prototype.watchTrip = function(id){
    if (this.subs[id]) return;
    /* with a lot of trips there are not enough subscriptions to go round; the
       ones left out still load, they just do not update live */
    if (this.subCount() + GROUPS.length > SUB_BUDGET) return;
    var self = this, base = "trips/" + id + "/", subs = [];
    GROUPS.forEach(function(group){
      subs.push(self.db.collection(base + group).onSnapshot(function(snap){
        var prefix = base + group + "/";
        Object.keys(self.map).forEach(function(path){
          if (path.indexOf(prefix) === 0) delete self.map[path];
        });
        snap.docs.forEach(function(d){ self.map[prefix + d.id] = d.data(); });
        if (self.cb) self.cb();
      }));
    });
    this.subs[id] = subs;
  };
  ArtifactStore.prototype.unwatchTrip = function(id){
    (this.subs[id] || []).forEach(function(off){ try{ off(); }catch(e){} });
    delete this.subs[id];
  };
  ArtifactStore.prototype.blobPut = async function(pid, data){
    await this.db.doc("photos/" + pid).set({ data: data });
  };
  ArtifactStore.prototype.blobGet = async function(pid){
    var snap = await this.db.doc("photos/" + pid).get();
    return snap.exists ? snap.data().data : null;
  };
  ArtifactStore.prototype.blobDrop = function(pid){
    this.db.doc("photos/" + pid).delete().catch(function(){});
  };

  /* ---------- store: a plan anyone with the link can edit ---------- */
  /* Talks to /api/plan on the same origin. The whole plan is small, so a poll
     asks "anything new since rev N?" and the server answers with the lot or
     with nothing at all. Photos never ride along — they are fetched by id. */
  function RemoteStore(){
    this.kind = "remote";
    this.shared = true;
    this.label = "함께 쓰는 저장소";
    this.map = {};
    this.rev = 0;
    this.cb = null;
    this.pending = {};
    this._t = null;
    this._poll = null;
    this.key = "";
    try{ this.key = localStorage.getItem("lab.key") || ""; }catch(e){ this.key = ""; }
  }
  RemoteStore.prototype.headers = function(){
    var h = { "content-type": "application/json" };
    if (this.key) h["x-lab-key"] = this.key;
    return h;
  };
  RemoteStore.prototype.open = async function(){
    var res = await fetch(API, { headers: this.headers(), cache: "no-store" });
    if (!res.ok) throw new Error("plan " + res.status);
    var data = await res.json();
    if (!data || !data.ok) throw new Error("plan not ready");
    this.map = data.docs || {};
    this.rev = data.rev || 0;
    if (data.locked){
      /* the server has no passcode set, so nobody can write yet */
      this.locked = true;
      this.label = "함께 쓰는 저장소 (읽기 전용)";
    }
  };
  RemoteStore.prototype.write = function(path, body){
    if (body === null) delete this.map[path]; else this.map[path] = body;
    this.pending[path] = body === null ? null : body;
    this.send();
  };
  RemoteStore.prototype.send = function(){
    var self = this;
    clearTimeout(this._t);
    this._t = setTimeout(function(){ self.flush(); }, 300);
  };
  RemoteStore.prototype.flush = async function(){
    var all = Object.keys(this.pending);
    if (this.locked || !all.length) return;
    /* the endpoint takes 200 paths at a time; an import can be bigger */
    var writes = {}, self = this;
    all.slice(0, 150).forEach(function(path){
      writes[path] = self.pending[path];
      delete self.pending[path];
    });
    if (Object.keys(this.pending).length) setTimeout(function(){ self.flush(); }, 60);
    try{
      var res = await fetch(API, {
        method: "POST", headers: this.headers(),
        body: JSON.stringify({ writes: writes })
      });
      if (res.status === 401){
        /* put them back; they go out once a key is entered */
        Object.assign(this.pending, writes);
        Saved.askKey();
        return;
      }
      if (res.status === 403){
        /* editing is not turned on at all — retrying cannot help */
        Object.assign(this.pending, writes);
        this.locked = true;
        this.label = "함께 쓰는 저장소 (읽기 전용)";
        Saved.refuse();
        return;
      }
      if (!res.ok) throw new Error("write " + res.status);
      var data = await res.json();
      this.rev = data.rev || this.rev;
    }catch(e){
      Object.assign(this.pending, writes);
      Saved.failed();
      var self = this;
      setTimeout(function(){ self.send(); }, 4000);
    }
  };
  RemoteStore.prototype.watch = function(cb){
    var self = this;
    this.cb = cb;
    var tick = async function(){
      if (document.hidden) return;
      try{
        var res = await fetch(API + "?rev=" + self.rev, { headers: self.headers(), cache: "no-store" });
        if (!res.ok) return;
        var data = await res.json();
        if (!data.ok || data.unchanged) return;
        self.map = data.docs || {};
        self.rev = data.rev || self.rev;
        cb();
      }catch(e){ /* a poll that fails is simply the next one's problem */ }
    };
    this._poll = setInterval(tick, 4000);
    document.addEventListener("visibilitychange", function(){ if (!document.hidden) tick(); });
  };
  RemoteStore.prototype.setKey = function(key){
    this.key = key;
    this.locked = false;
    this.label = "함께 쓰는 저장소";
    try{ localStorage.setItem("lab.key", key); }catch(e){ /* private mode */ }
    this.flush();
  };
  RemoteStore.prototype.blobPut = async function(pid, data){
    await fetch(API, {
      method: "POST", headers: this.headers(),
      body: JSON.stringify({ writes: { ["photos/" + pid]: { data: data } } })
    });
  };
  RemoteStore.prototype.blobGet = async function(pid){
    var res = await fetch(API + "?path=" + encodeURIComponent("photos/" + pid), {
      headers: this.headers(), cache: "no-store"
    });
    if (!res.ok) return null;
    var data = await res.json();
    return data.doc ? data.doc.data : null;
  };
  RemoteStore.prototype.blobDrop = function(pid){
    fetch(API, {
      method: "POST", headers: this.headers(),
      body: JSON.stringify({ writes: { ["photos/" + pid]: null } })
    }).catch(function(){});
  };

  /* ---------- picking one, and everything above it ---------- */
  var Saved = {
    store: null,
    backend: "local",
    shared: false,
    data: null,
    active: null,
    onRemote: null,
    _r: null,
    _warned: false,

    async init(){
      this.store = await this.pick();
      this.backend = this.store.kind;
      this.shared = this.store.shared;

      await this.moveIn();
      this.reread();
      /* A backend anyone can reach is not seeded behind the user's back: the
         first write there is theirs to make, and it needs their passcode. */
      if (!this.data.trips.length && !this.seeded() && this.store.kind !== "remote"){
        await this.plant();
      }

      var self = this;
      this.store.watch(function(){ self.reread(); self.touch(); });

      this.active = this.lastTrip();
      if (!this.cur() && this.data.trips.length) this.active = this.data.trips[0].id;
    },

    async pick(){
      var db = null;
      try{
        if (window.claude && typeof window.claude.use === "function") db = await window.claude.use("db");
      }catch(e){ db = null; }
      if (db){
        var artifact = new ArtifactStore(db);
        try{ await artifact.open(); return artifact; }catch(e){ /* fall through */ }
      }
      if (location.protocol === "http:" || location.protocol === "https:"){
        var remote = new RemoteStore();
        try{ await remote.open(); return remote; }catch(e){ /* no backend deployed */ }
      }
      var local = new LocalStore();
      await local.open();
      return local;
    },

    seeded(){
      var meta = this.store.map["meta/store"];
      return !!(meta && meta.seeded);
    },

    /* An empty shared store is bootstrapped from whatever this browser had,
       so switching a copy over to a backend does not throw its plan away. */
    async plant(){
      var local = new LocalStore();
      await local.open();
      var carried = modelFrom(local.map);
      var trips = carried.length ? carried : [seedTrip()];
      var map = {};
      trips.forEach(function(t){ tripToMap(t, map); });
      var self = this;
      Object.keys(map).forEach(function(path){ self.store.write(path, map[path]); });
      this.store.write("meta/store", { v: DATA_V, seeded: true });
      this.reread();
    },

    /* One-time move off the single whole-plan document. */
    async moveIn(){
      var map = this.store.map;
      var meta = map["meta/store"];
      if (meta && (meta.v || 0) >= DATA_V) return;
      var old = map["trips/fukuoka2026"];
      if (!old || !(old.trips || old.items || old.trip)){
        if (Object.keys(map).length) this.store.write("meta/store", { v: DATA_V, seeded: true });
        return;
      }
      if (this.store.lease && !(await this.store.lease())) return;   /* someone else is moving it */
      this.store.write("meta/backup_v2", { at: new Date().toISOString(), plan: old });
      var fresh = mapFromLegacy(old);
      var self = this;
      if (!fresh["trips/fukuoka2026"]) this.store.write("trips/fukuoka2026", null);
      Object.keys(fresh).forEach(function(path){ self.store.write(path, fresh[path]); });
    },

    reread(){
      this.data = { trips: modelFrom(this.store.map) };
    },

    touch(){
      var self = this;
      clearTimeout(this._r);
      this._r = setTimeout(function(){ if (self.onRemote) self.onRemote(); }, 90);
    },

    failed(){
      if (this._warned) return;
      this._warned = true;
      toast("저장하지 못했어요. 연결을 확인해주세요.");
      setTimeout(function(){ Saved._warned = false; }, 8000);
    },
    askKey(){
      if (this._asking) return;
      this._asking = true;
      var self = this;
      openTextDialog({
        title: "편집 암호",
        placeholder: "계획을 함께 쓰는 사람에게 받은 암호",
        hint: "이 기기에 저장되고, 보는 건 암호 없이도 됩니다."
      }, function(v){
        self._asking = false;
        self.store.setKey(v);
        toast("암호를 저장했어요.");
      }, null, function(){ self._asking = false; });
    },

    /* ---------- moving a plan between copies ---------- */
    /* An artifact cannot reach the outside network, so the two copies can
       never sync themselves. Text is the bridge. */
    exportText(){
      var map = this.store.map, out = {};
      Object.keys(map).forEach(function(path){
        if (path.indexOf("trips/") === 0 && map[path]) out[path] = map[path];
      });
      return JSON.stringify({ lab: "bemlab", v: DATA_V, at: new Date().toISOString(), docs: out });
    },
    importText(text){
      var parsed = JSON.parse(text);
      var docs = parsed && parsed.docs ? parsed.docs : parsed;
      if (!docs || typeof docs !== "object") throw new Error("shape");
      var paths = Object.keys(docs).filter(function(path){ return path.indexOf("trips/") === 0; });
      if (!paths.length) throw new Error("empty");
      var self = this;
      paths.forEach(function(path){ self.write(path, docs[path]); });
      this.write("meta/store", { v: DATA_V, seeded: true });

    /* ---------- writing ---------- */
    /* A read-only copy must not look like it saved. The write is refused, the
       model is read back from the store, and the screen returns to what is

    refuse(){

        self.reread();
        if (self.onRemote) self.onRemote();
      }, 120);
    },
    path(key){ return "trips/" + this.active + "/" + key; },

    listAdd(key, rec){
      var full = Object.assign({ id: uid("x"), ord: Date.now() }, rec);
      this.cur()[key].push(full);
      this.write(this.path(key) + "/" + full.id, bodyOf(full));

    },
    listEdit(key, id, patch){

        next = Object.assign({}, x, patch);
        return next;
      });
      if (next) this.write(this.path(key) + "/" + id, bodyOf(next));
    },
    listRemove(key, id){

      this.write(this.path(key) + "/" + id, null);
      if (key === "items"){
        (c.attach[id] || []).forEach(function(a){ self.write(self.path("attach") + "/" + a.id, null); });

        if (patch.theme) t.dayThemes[date] = patch.theme; else delete t.dayThemes[date];
      }
      if (patch.route !== undefined){
        if (patch.route && patch.route.length) t.dayRoutes[date] = patch.route;
        else delete t.dayRoutes[date];

      (t.attach[itemId] = t.attach[itemId] || []).push(full);

    removeAttach(itemId, attId){

    lastTrip(){ try{ return localStorage.getItem("lab.trip"); }catch(e){ return null; } },
    open(id){

  /* ================= photos ================= */
  var photoCache = {};

  function compressImage(file, maxSide, quality){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onerror = function(){ reject(new Error("read")); };
      reader.onload = function(){
        var img = new Image();
        img.onerror = function(){ reject(new Error("decode")); };
        img.onload = function(){
          var scale = Math.min(1, maxSide / Math.max(img.width, img.height));
          var w = Math.round(img.width * scale), h = Math.round(img.height * scale);
          var c = document.createElement("canvas");
          c.width = w; c.height = h;
          c.getContext("2d").drawImage(img, 0, 0, w, h);
          resolve(c.toDataURL("image/jpeg", quality));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }
  /* A photo is far too big for the trip document, so each gets its own record. */
  async function storePhoto(file){
    var data = await compressImage(file, 900, 0.55);
    if (data.length > 180000) data = await compressImage(file, 640, 0.45);
    if (data.length > 230000) throw new Error("too big");
    var pid = uid("p");
    await Saved.store.blobPut(pid, data);
    photoCache[pid] = data;
    return pid;
  }
  async function loadPhoto(pid){
    if (photoCache[pid]) return photoCache[pid];
    var data = null;
    try{ data = await Saved.store.blobGet(pid); }catch(e){ data = null; }
    if (data) photoCache[pid] = data;
    return data;
  }
  function dropPhoto(pid){
    delete photoCache[pid];
    try{ Saved.store.blobDrop(pid); }catch(e){ /* the attachment is gone either way */ }
  }
  function thumb(pid){
    var img = el('<img class="att-thumb" alt="첨부 사진">');
    loadPhoto(pid).then(function(d){ if (d) img.src = d; });
    tap(img, function(){ openPhoto(pid); });
    return img;
  }
  function openPhoto(pid){
    loadPhoto(pid).then(function(d){
      if (!d){ toast("사진을 불러오지 못했어요."); return; }
      var v = el('<div class="photoview"><img src="' + d + '" alt="첨부 사진"></div>');
      tap(v, closeOverlay);
      overlay.appendChild(v);
    });
  }

  /* ================= derived ================= */
  function trip(){ return Saved.cur(); }
  function tripsSorted(){
    return Saved.data.trips.slice().sort(function(a, b){ return a.start.localeCompare(b.start); });
  }
  function tripDaysOf(t){
    var out = [], guard = 0;
    var d = new Date(t.start + "T00:00:00"), end = new Date(t.end + "T00:00:00");
    while (d <= end && guard++ < 60){
      var iso = isoOf(d);
      out.push({ date: iso, dow: dowOf(iso), theme: t.dayThemes[iso] || "", route: t.dayRoutes[iso] || [] });
      d.setDate(d.getDate() + 1);
    }
    if (!out.length){
      out.push({ date: t.start, dow: dowOf(t.start), theme: t.dayThemes[t.start] || "", route: t.dayRoutes[t.start] || [] });
    }
    return out;
  }
  function tripDays(){ var t = trip(); return t ? tripDaysOf(t) : []; }
  function nightsOf(t){
    var n = dayDiff(t.end, t.start);
    return n > 0 ? n + "박 " + (n + 1) + "일" : "당일";
  }
  function nightsLabel(){ var t = trip(); return t ? nightsOf(t) : ""; }
  /* D-7 / 여행 중 / 다녀옴 — one label, used by both the list and the header. */
  function tripStatus(t){
    var d = dayDiff(t.start, todayISO()), back = dayDiff(t.end, todayISO());
    if (d > 0) return { kind:"soon", label:"D-" + d };
    if (d === 0) return { kind:"live", label:"오늘 출발" };
    if (back >= 0) return { kind:"live", label:"여행 중 " + (1 - d) + "일차" };
    return { kind:"past", label:"다녀옴" };
  }
  /* An item shows an emoji only if one was actually set on it. */
  function emoPrefix(it){ return it.emo ? it.emo + " " : ""; }
  /* 시간 미정이 맨 위, 그 다음이 시계 순. */
  function byStart(a, b){
    var x = mins(a.s), y = mins(b.s);
    if (x === null || y === null) return x === y ? 0 : (x === null ? -1 : 1);
    return x - y;
  }
  function itemsOn(date){
    return trip().items.filter(function(i){ return i.dayDate === date; }).sort(byStart);
  }
  /* The timeline is a clock, so only items with a time belong on it. An item
     without one is a candidate — it lives in 음식, at the top of its day. */
  function timedOn(date){
    return itemsOn(date).filter(function(i){ return !!i.s; });
  }
  function currentPair(){
    var days = tripDays(), today = todayISO(), di = -1;
    if (!days.length) return null;
    days.forEach(function(d, i){ if (d.date === today) di = i; });
    if (di < 0) return null;
    var list = timedOn(days[di].date), n = nowMins(), cur = null, next = null;
    for (var i = 0; i < list.length; i++){
      var s = mins(list[i].s), e = list[i].e ? mins(list[i].e) : null;
      if (e === null){
        for (var j = i + 1; j < list.length; j++){
          var ns = mins(list[j].s);
          if (ns > s){ e = ns; break; }
        }
        if (e === null) e = s + 90;
      }
      if (!cur && n >= s && n < e) cur = list[i];
      if (!next && s > n) next = list[i];
    }
    return { dayIndex: di, current: cur, next: next };
  }

  /* ================= routing ================= */
  var state = { view:"home", tab:"sched", day:0, meal:"all" };
  /* home → trips(여행 목록) → trip(한 여행) */
  var TABS = ["sched", "food", "shop", "info"];
  var view = document.getElementById("view");
  var overlay = document.getElementById("overlay");
  function closeOverlay(){ overlay.innerHTML = ""; }

  /* The address is the screen. Reloading, or reopening the page, lands back
     where you were instead of at the top — and the browser's back gesture
     walks the screens you came through.

     Two places remember it, because neither is enough alone: the address bar
     (survives a reload, can be bookmarked or shared) and storage (survives
     the viewer reopening the page with a fresh address, which is what an
     artifact frame does). */
  var Route = {
    of(){
      if (state.view === "home") return "#/";
      if (state.view === "trips") return "#/trips";
      var t = Saved.cur();
      return "#/t/" + encodeURIComponent(t ? t.id : "") + "/" + state.tab + "/" + state.day +
        (state.tab === "food" && state.meal !== "all" ? "/" + state.meal : "");
    },
    parse(hash){
      var parts = String(hash || "").replace(/^#\/?/, "").split("/").filter(Boolean);
      if (!parts.length) return null;
      var p = parts.map(function(x){ try{ return decodeURIComponent(x); }catch(e){ return x; } });
      if (p[0] === "trips") return { view:"trips" };
      if (p[0] !== "t" || !p[1]) return null;
      var known = false;
      Saved.data.trips.forEach(function(t){ if (t.id === p[1]) known = true; });
      if (!known) return { view:"trips" };   /* the trip was deleted since */
      return {
        view: "trip", id: p[1],
        tab: TABS.indexOf(p[2]) >= 0 ? p[2] : "sched",
        day: Math.max(0, parseInt(p[3], 10) || 0),
        meal: p[4] || "all"
      };
    },
    apply(r){
      if (r.view === "trip"){
        Saved.open(r.id);
        state.view = "trip"; state.tab = r.tab; state.day = r.day; state.meal = r.meal || "all";
      } else {
        state.view = r.view;
      }
    },
    remember(h){ try{ localStorage.setItem("lab.route", h); }catch(e){ /* private mode */ } },
    last(){ try{ return localStorage.getItem("lab.route"); }catch(e){ return null; } },
    /* replace: correcting the address for the screen already shown, so it
       does not become a separate step in the back history */
    push(replace){
      var h = this.of();
      this.remember(h);
      if (location.hash === h) return;
      try{
        if (replace) history.replaceState(null, "", h);
        else history.pushState(null, "", h);
      }catch(e){
        /* a frame may refuse history writes; the hash alone still routes */
        location.hash = h;
      }
    }
  };

  function enter(hash){
    Route.apply(Route.parse(hash) || { view:"home" });
    /* what was asked for and what can be shown are not always the same — a
       deleted trip lands on the list — so the address is rewritten to match
       the screen, in place, without becoming its own step in the history */
    Route.push(true);
    render();
  }
  window.addEventListener("hashchange", function(){
    if (location.hash === Route.of()) return;   /* our own write */
    enter(location.hash);
  });
  window.addEventListener("popstate", function(){ enter(location.hash); });

  function go(next){ Object.assign(state, next); Route.push(); render(); }

  function themeButton(){
    var dark = Theme.isDark();
    var b = el('<button class="icon-btn" aria-label="' + (dark ? "밝은 화면으로" : "어두운 화면으로") + '">' +
      icon(dark ? "sun" : "moon") + '</button>');
    tap(b, function(){
      var next = Theme.toggle();
      render();
      toast(next === "dark" ? "어두운 화면" : "밝은 화면");
    });
    return b;
  }

  /* ================= home ================= */
  function renderHome(keepScroll){
    var trips = tripsSorted();
    var next = null;
    trips.forEach(function(t){ if (!next && dayDiff(t.end, todayISO()) >= 0) next = t; });
    var desc = trips.length
      ? "여행 " + trips.length + "개" + (next ? " · 다음 " + next.city + " " + tripStatus(next).label : " · 지난 여행만")
      : "아직 등록된 여행이 없어요";

    var wrap = el(
      '<div class="pad">' +
        '<div class="wordmark-row"><h1 class="wordmark">BEMLAB</h1></div>' +
        '<p class="wordmark-sub">하나씩 만들어보는 개인 실험들</p>' +
        '<div class="lab-list">' +
          '<button class="lab-row" type="button" id="lab-travel">' +
            '<span class="lab-mark">' + icon("compass") + '</span>' +
            '<span class="lab-text">' +
              '<span class="lab-index mono">EXP 01</span>' +
              '<span class="lab-name">여행 계획</span>' +
              '<span class="lab-desc">' + esc(desc) + '</span>' +
            '</span>' + icon("go", "lab-go") +
          '</button>' +
          '<div class="lab-row vacant">' +
            '<span class="lab-mark">' + icon("plus") + '</span>' +
            '<span class="lab-text">' +
              '<span class="lab-index mono">EXP 02</span>' +
              '<span class="lab-name">비어 있음</span>' +
              '<span class="lab-desc">다음 실험이 들어갈 자리</span>' +
            '</span>' +
          '</div>' +
        '</div>' +
        '<p class="build-stamp mono">' + esc(stamp()) + '</p>' +
      '</div>'
    );
    wrap.querySelector(".wordmark-row").appendChild(themeButton());
    tap(wrap.querySelector("#lab-travel"), function(){ go({ view:"trips" }); });

    view.innerHTML = "";
    view.appendChild(wrap);
    if (!keepScroll) window.scrollTo(0, 0);
  }

  /* ================= trip list ================= */
  /* 다가오는 여행이 위로, 지난 여행은 최근 것부터 아래로. */
  function tripsForList(){
    var today = todayISO();
    var soon = [], past = [];
    tripsSorted().forEach(function(t){ (dayDiff(t.end, today) >= 0 ? soon : past).push(t); });
    return soon.concat(past.reverse());
  }

  function renderTrips(keepScroll){
    var wrap = el(
      '<div class="pad">' +
        '<div class="page-head">' +
          '<button class="icon-btn back" type="button" aria-label="BEMLAB으로">' + icon("back") + '</button>' +
          '<div class="page-title"><span class="page-kicker mono">EXP 01</span><h1>여행 계획</h1></div>' +
        '</div>' +
      '</div>'
    );
    wrap.querySelector(".page-head").appendChild(themeButton());
    tap(wrap.querySelector(".back"), function(){ go({ view:"home" }); });

    var list = tripsForList();
    var box = el('<div class="trip-list"></div>');
    if (!list.length){
      box.appendChild(el('<div class="card dashed"><p class="card-empty">' +
        '첫 여행을 만들어보세요. 날짜만 정하면 일정 · 음식 · 쇼핑 · 정보가 한 세트로 따라옵니다.</p></div>'));
    }
    list.forEach(function(t){ box.appendChild(tripCard(t)); });

    var add = el('<button class="addcard trip-add" type="button">' + icon("plus") + '여행 추가</button>');
    tap(add, function(){ openTripEditor(null); });
    box.appendChild(add);
    wrap.appendChild(box);
    wrap.appendChild(moveRow());
    wrap.appendChild(el('<p class="build-stamp mono">' + esc(stamp()) + '</p>'));

    view.innerHTML = "";
    view.appendChild(wrap);
    if (!keepScroll) window.scrollTo(0, 0);
  }

  /* Moving a plan between the two copies, and the passcode the shared one
     asks for. Quiet, at the bottom — needed rarely, but needed. */
  function moveRow(){
    var row = el('<div class="moverow"></div>');
    var out = el('<button class="linkbtn" type="button">' + icon("note") + '내보내기</button>');
    tap(out, function(){
      openTextDialog({
        title: "계획 내보내기",
        value: Saved.exportText(),
        multiline: true,
        hint: "전체를 복사해서, 옮길 곳의 가져오기에 붙여넣으세요.",
        okLabel: "복사"
      }, function(v){
        try{
          if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(v);
        }catch(e){ /* the text is on screen to copy by hand */ }
        toast("복사했어요.");
      });
    });
    row.appendChild(out);

    var into = el('<button class="linkbtn" type="button">' + icon("plus") + '가져오기</button>');
    tap(into, function(){
      openTextDialog({
        title: "계획 가져오기",
        placeholder: "내보내기에서 복사한 내용을 붙여넣으세요",
        multiline: true,
        hint: "같은 이름의 여행은 덮어씁니다."
      }, function(v){
        try{
          var n = Saved.importText(v);
          toast(n + "개 항목을 가져왔어요.");
          render();
        }catch(e){ toast("가져올 내용을 알아보지 못했어요."); }
      });
    });
    row.appendChild(into);

    if (Saved.store && Saved.store.kind === "remote"){
      var key = el('<button class="linkbtn" type="button">' + icon("edit") + '편집 암호</button>');
      tap(key, function(){ Saved.askKey(); });
      row.appendChild(key);
    }
    return row;
  }

  function tripCard(t){
    var st = tripStatus(t);
    var days = tripDaysOf(t);
    var packOn = t.packList.filter(function(k){ return k.on; }).length;
    var theme = days.map(function(d){ return d.theme; }).filter(Boolean)[0] || "";

    var card = el(
      '<button class="trip-card ' + st.kind + '" type="button">' +
        '<span class="trip-top">' +
          '<span class="trip-flag">' + (t.emoji ? esc(t.emoji) : icon("pin")) + '</span>' +
          '<span class="trip-id">' +
            '<span class="trip-city">' + esc(t.city || "이름 없는 여행") + '</span>' +
            (t.country ? '<span class="trip-country mono">' + esc(t.country) + '</span>' : '') +
          '</span>' +
          '<span class="trip-status ' + st.kind + '">' + esc(st.label) + '</span>' +
        '</span>' +
        '<span class="trip-dates mono">' + esc(t.start.replace(/-/g, ".")) + ' (' + dowOf(t.start) + ')' +
          ' – ' + esc(fmtMD(t.end)) + ' (' + dowOf(t.end) + ')' +
          '<span class="trip-nights">' + esc(nightsOf(t)) + '</span></span>' +
        (theme ? '<span class="trip-theme">' + esc(theme) + '</span>' : '') +
        '<span class="trip-stats">' +
          '<span class="trip-stat"><b class="mono">' + t.items.length + '</b>일정</span>' +
          '<span class="trip-stat"><b class="mono">' + t.shops.length + '</b>쇼핑</span>' +
          '<span class="trip-stat"><b class="mono">' + packOn + '/' + t.packList.length + '</b>준비물</span>' +
          '<span class="trip-go">' + icon("go") + '</span>' +
        '</span>' +
      '</button>'
    );
    tap(card, function(){
      Saved.open(t.id);
      var p = currentPair();
      go({ view:"trip", tab:"sched", meal:"all", day: p ? p.dayIndex : 0 });
    });
    return card;
  }

  /* ================= trip ================= */
  function renderTrip(keepScroll){
    var days = tripDays();
    if (state.day >= days.length) state.day = days.length - 1;

    var frag = document.createDocumentFragment();
    frag.appendChild(renderHero());

    var tabs = el('<div class="tabs" role="tablist"></div>');
    [["sched","일정"],["food","음식"],["shop","쇼핑"],["info","정보"]].forEach(function(t){
      var b = el('<button class="tab" role="tab" type="button" aria-selected="' + (state.tab === t[0]) + '">' + t[1] + '</button>');
      tap(b, function(){ go({ tab: t[0] }); });
      tabs.appendChild(b);
    });
    frag.appendChild(tabs);

    var body = el('<div class="tabpad"></div>');
    frag.appendChild(body);

    view.innerHTML = "";
    view.appendChild(frag);

    if (state.tab === "sched") renderSchedule(body, days);
    else if (state.tab === "food") renderFood(body, days);
    else if (state.tab === "shop") renderShop(body, days);
    else renderInfo(body);

    if (!keepScroll) window.scrollTo(0, 0);
  }

  function renderHero(){
    var t = trip();
    var pair = currentPair();
    var d = dayDiff(t.start, todayISO());

    var hero = el(
      '<div class="hero">' +
        '<div class="hero-top">' +
        '<button class="icon-btn hero-back" type="button" aria-label="여행 목록으로">' + icon("back") + '</button>' +
        '<h1 class="hero-city">' + (t.emoji ? '<span class="hero-flag">' + esc(t.emoji) + '</span>' : '') +
        esc(t.city) + '</h1>' +
        '<span class="hero-country mono">' + esc(t.country) + '</span></div>' +
      '</div>'
    );
    hero.querySelector(".hero-top").appendChild(themeButton());
    tap(hero.querySelector(".hero-back"), function(){ go({ view:"trips" }); });
    var dates = el('<p class="hero-dates mono">' +
      fmtMD(t.start) + ' (' + dowOf(t.start) + ') – ' + fmtMD(t.end) + ' (' + dowOf(t.end) + ') · ' + esc(nightsLabel()) +
      '</p>');
    var pen = el('<button class="quietbtn" type="button" aria-label="여행 정보 수정">' + icon("edit") + '</button>');
    tap(pen, function(){ openTripEditor(t); });
    dates.appendChild(pen);
    hero.appendChild(dates);

    var box;
    if (pair){
      var cur = pair.current, nx = pair.next;
      box = el('<div class="now"></div>');
      box.appendChild(el('<div class="now-part"><span class="now-tag on">지금</span>' +
        '<div><p class="now-title">' + (cur ? esc(emoPrefix(cur) + cur.title) : "일정 사이 — 여유 시간") + '</p>' +
        '<p class="now-time mono">' + (cur ? esc(cur.s + (cur.e ? "–" + cur.e : "~")) : "") + '</p></div></div>'));
      if (nx){
        box.appendChild(el('<div class="now-part"><span class="now-tag next">다음</span>' +
          '<div><p class="now-title">' + esc(emoPrefix(nx) + nx.title) + '</p>' +
          '<p class="now-time mono">' + esc(nx.s) + ' 시작</p></div></div>'));
      }
    } else {
      var label = d > 0 ? "D-" + d : (d === 0 ? "오늘 출발" : "여행 완료");
      var first = timedOn(t.start)[0];
      var sub = d >= 0 && first ? fmtMD(t.start) + " " + first.s + " " + first.title : "지난 여행";
      box = el('<div class="countdown' + (d === 0 ? " live" : "") + '">' + icon("plane") +
        '<div><div class="countdown-big mono">' + esc(label) + '</div>' +
        '<div class="countdown-sub">' + esc(sub) + '</div></div></div>');
    }
    hero.appendChild(box);
    return hero;
  }

  /* ================= tab: schedule ================= */
  function renderSchedule(root, days){
    var pair = currentPair();

    var dayrow = el('<div class="dayrow"></div>');
    days.forEach(function(day, i){
      var isToday = pair && pair.dayIndex === i;
      var b = el('<button class="daybtn' + (isToday ? " today" : "") + '" type="button" aria-pressed="' +
        (state.day === i) + '"><b>' + fmtMD(day.date) + '</b>' + day.dow + (isToday ? " · 오늘" : "") + '</button>');
      tap(b, function(){ go({ day: i }); });
      dayrow.appendChild(b);
    });
    root.appendChild(dayrow);

    var day = days[state.day];
    var list = timedOn(day.date);

    var themeRow = el(
      '<button class="theme-row" type="button">' +
        '<span class="theme-body"><span class="theme-label mono">' + fmtMD(day.date) + ' (' + day.dow + ')</span>' +
        '<span class="theme-text' + (day.theme ? "" : " empty") + '">' +
        esc(day.theme || "이 날의 한 줄 요약 추가") + '</span></span>' + icon("edit") +
      '</button>'
    );
    tap(themeRow, function(){
      openTextDialog({ title:"이 날의 요약", value: day.theme, placeholder:"예: 하카타 → 나카스 → 텐진" },
        function(v){ Saved.setDay(day.date, { theme: v }); render(); },
        day.theme ? function(){ Saved.setDay(day.date, { theme: "" }); render(); } : null);
    });
    root.appendChild(themeRow);

    root.appendChild(routeRow(day));

    var attCount = list.reduce(function(n, it){ return n + Saved.attachOf(it.id).length; }, 0);
    root.appendChild(el('<p class="day-stat mono">' + list.length + '개 일정' + (attCount ? ' · 자료 ' + attCount : '') + '</p>'));

    if (pair && pair.dayIndex === state.day && pair.current){
      root.appendChild(el('<div class="notice">' + icon("clock") +
        '<span>지금 진행 중: ' + esc(pair.current.title) + '</span></div>'));
    }

    var tl = el('<div class="tl"></div>');
    list.forEach(function(it){ tl.appendChild(timelineItem(it, pair)); });
    var add = el('<div class="tl-add"><div class="tl-time mono">+</div>' +
      '<div class="tl-rail"><span class="tl-dot"></span></div>' +
      '<button class="addrow" type="button">' + icon("plus") + '일정 추가</button></div>');
    tap(add.querySelector(".addrow"), function(){ openItemEditor(null, day.date); });
    tl.appendChild(add);
    root.appendChild(tl);
  }

  /* 그날의 동선 한 줄. 칩 하나가 한 곳, 화살표로 이어진다. */
  function routeRow(day){
    var stops = day.route || [];
    var row = el('<button class="routerow" type="button" aria-label="이 날의 동선 수정"></button>');
    var label = el('<span class="route-label mono">동선</span>');
    row.appendChild(label);
    if (stops.length){
      var chain = el('<span class="route-chain"></span>');
      /* the arrow travels with the stop before it, so a wrap never starts with → */
      stops.forEach(function(stop, i){
        chain.appendChild(el('<span class="route-seg"><span class="route-stop">' + esc(stop) + '</span>' +
          (i < stops.length - 1 ? '<span class="route-arrow" aria-hidden="true">→</span>' : '') + '</span>'));
      });
      row.appendChild(chain);
    } else {
      row.appendChild(el('<span class="route-chain empty">이 날의 동선 적어두기</span>'));
    }
    row.appendChild(el(icon("edit", "route-pen")));
    tap(row, function(){
      openTextDialog({
        title: fmtMD(day.date) + " 동선",
        value: stops.join("\n"),
        placeholder: "한 줄에 한 곳",
        multiline: true
      }, function(v){
        var next = v.split(/[\n→>,]/).map(function(x){ return x.trim(); }).filter(Boolean);
        Saved.setDay(day.date, { route: next });
        render();
      }, stops.length ? function(){ Saved.setDay(day.date, { route: [] }); render(); } : null);
    });
    return row;
  }

  function timelineItem(it, pair){
    var cat = CAT[it.cat] || CAT.todo;
    var isCurrent = pair && pair.current && pair.current.id === it.id;
    var places = it.places || [];
    var titleHtml = places.length === 1 ? placeHtml(it.title, places[0]) : esc(it.title);

    var row = el(
      '<div class="tl-item' + (isCurrent ? " current" : "") + '">' +
        '<div class="tl-time mono">' + esc(it.s) + (it.e ? '<small>' + esc(it.e) + '</small>' : '') + '</div>' +
        '<div class="tl-rail"><span class="tl-dot" style="border-color:' + cat.color + '"></span></div>' +
        '<div class="tl-body"><p class="tl-title">' +
          (it.emo ? '<span class="emo">' + esc(it.emo) + '</span>' : '') + titleHtml + '</p></div>' +
      '</div>'
    );
    var body = row.querySelector(".tl-body");
    (it.lines || []).forEach(function(l){ body.appendChild(el('<p class="tl-line">' + esc(l) + '</p>')); });

    var atts = Saved.attachOf(it.id);
    if (atts.length) body.appendChild(attachStrip(it.id, atts));

    var meta = el('<div class="tl-meta"></div>');
    meta.appendChild(el('<span class="badge cat" style="color:' + cat.color + '">' + cat.label + '</span>'));
    if (it.meal) meta.appendChild(el('<span class="badge">' + esc(MEAL_LABEL[it.meal]) + '</span>'));
    if (it.tag) meta.appendChild(el('<span class="badge tag">' + esc(it.tag) + '</span>'));
    if (places.length > 1){
      places.forEach(function(p){
        meta.appendChild(el('<a class="maplink" href="' + esc(mapUrl(p)) + '" target="_blank" rel="noopener">' +
          icon("pin") + esc(shortPlace(p)) + '</a>'));
      });
    }

    var actions = el('<span class="tl-actions"></span>');
    var clip = el('<button class="quietbtn' + (atts.length ? " has" : "") + '" type="button" aria-label="자료">' +

  function shortPlace(p){

  function attachStrip(itemId, atts){

  /* One card shape for every editable list in 정보. */
  function sectionCard(o){
    var list = ordered(trip()[o.key]);
    var card = el('<div class="card"></div>');
    var head = el('<div class="card-head"><h3>' + esc(o.title) + (list.length ? ' · ' + list.length : '') + '</h3></div>');
    var add = el('<button class="quietbtn" type="button">' + icon("plus") + '추가</button>');
    tap(add, function(){
      openFormSheet({ title: o.title + " 추가", fields: o.fields }, null, function(v){
        Saved.listAdd(o.key, v); render();
      });
    });
    head.appendChild(add);
    card.appendChild(head);

    if (!list.length){
      card.appendChild(el('<p class="card-empty">' + esc(o.empty) + '</p>'));
      return card;
    }

    list.forEach(function(rec){
      var row = el('<div class="rowline"></div>');
      var inner = '<span class="rowbody">' + o.render(rec) + '</span>' + icon("edit", "rowpen");
      if (o.linkMode){
        var u = safeUrl(rec.url);
        var a = el('<a class="rowbtn" href="' + esc(u || "#") + '" target="_blank" rel="noopener">' +
          icon("link") + '<span class="rowbody">' + o.render(rec) + '</span></a>');
        row.appendChild(a);
        var pen = el('<button class="quietbtn" type="button" aria-label="수정">' + icon("edit") + '</button>');
        tap(pen, function(){ editRec(o, rec); });
        row.appendChild(pen);
      } else {
        var btn = el('<button class="rowbtn" type="button">' +
          (o.simple ? "" : icon(o.ic)) + inner + '</button>');
        tap(btn, function(){ editRec(o, rec); });
        row.appendChild(btn);
      }
      card.appendChild(row);
    });
    return card;
  }

      function(){ Saved.listRemove(o.key, rec.id); render(); });

  /* ================= sheets & dialogs ================= */
  function sheetShell(title, sub){
    var s = el(
      '<div class="scrim"><div class="sheet" role="dialog" aria-modal="true">' +
        '<div class="sheet-grip"></div>' +
        '<div class="sheet-head"><div style="flex:1;min-width:0">' +
          '<p class="sheet-title">' + esc(title) + '</p>' +
          (sub ? '<p class="sheet-sub">' + esc(sub) + '</p>' : '') +
        '</div><button class="icon-btn" data-x aria-label="닫기">' + icon("x") + '</button></div>' +
        '<div class="sheet-body"></div>' +
        '<div class="sheet-foot"></div>' +
      '</div></div>'
    );
    tap(s.querySelector("[data-x]"), closeOverlay);
    s.addEventListener("click", function(e){ if (e.target === s) closeOverlay(); });
    return s;
  }

  /* Generic record form — used by every 정보 section and 쇼핑 가게. */
  function openFormSheet(opts, rec, onSave, onDelete){
    var sheet = sheetShell(opts.title);
    var body = sheet.querySelector(".sheet-body");
    var foot = sheet.querySelector(".sheet-foot");
    var inputs = {};

    opts.fields.forEach(function(f){
      var v = rec ? (rec[f.key] || "") : "";
      var control = f.area
        ? '<textarea id="f-' + f.key + '" placeholder="' + esc(f.placeholder || "") + '">' + esc(v) + '</textarea>'
        : '<input id="f-' + f.key + '" type="' + (f.time ? "time" : "text") + '" placeholder="' +
          esc(f.placeholder || "") + '" value="' + esc(v) + '">';
      var fld = el('<div class="fld"><label for="f-' + f.key + '">' + esc(f.label) + '</label>' + control + '</div>');
      body.appendChild(fld);
      inputs[f.key] = fld.querySelector("#f-" + f.key);
    });

    if (onDelete){
      var del = el('<button class="btn btn-danger" type="button">삭제</button>');
      tap(del, function(){ closeOverlay(); onDelete(); toast("삭제했어요."); });
      foot.appendChild(del);
    }
    var save = el('<button class="btn btn-primary" type="button">저장</button>');
    tap(save, function(){
      var out = {};
      for (var i = 0; i < opts.fields.length; i++){
        var f = opts.fields[i];
        var val = inputs[f.key].value.trim();
        if (f.url){
          var u = safeUrl(val);
          if (!u){ inputs[f.key].focus(); toast("http로 시작하는 주소를 넣어주세요."); return; }
          val = u;
        }
        if (f.required && !val){ inputs[f.key].focus(); toast(f.label + "을(를) 적어주세요."); return; }
        out[f.key] = val;
      }
      closeOverlay();
      onSave(out);
      toast(rec ? "수정했어요." : "추가했어요.");
    });
    foot.appendChild(save);

    overlay.appendChild(sheet);
    setTimeout(function(){ inputs[opts.fields[0].key].focus(); }, 60);
  }

  function openTextDialog(opts, onSave, onDelete, onCancel){
    var field = opts.multiline
      ? '<textarea id="dlg-v" placeholder="' + esc(opts.placeholder || "") + '">' + esc(opts.value || "") + '</textarea>'
      : '<input id="dlg-v" type="text" placeholder="' + esc(opts.placeholder || "") + '" value="' + esc(opts.value || "") + '">';
    var scrim = el('<div class="scrim mid"><div class="dialog" role="dialog" aria-modal="true">' +
      '<h3>' + esc(opts.title) + '</h3><div class="fld">' + field +
      (opts.hint ? '<p class="fld-hint">' + esc(opts.hint) + '</p>' : '') + '</div>' +
      '<div class="dialog-actions">' +
        (onDelete ? '<button class="btn-text danger" data-a="del">삭제</button>' : '') +
        '<span class="spacer"></span>' +
        '<button class="btn-text" data-a="no">취소</button>' +
        '<button class="btn-text go" data-a="ok">' + esc(opts.okLabel || "확인") + '</button>' +
      '</div></div></div>');
    function give(){ closeOverlay(); if (onCancel) onCancel(); }
    scrim.addEventListener("click", function(e){ if (e.target === scrim) give(); });
    var input = scrim.querySelector("#dlg-v");
    scrim.querySelector('[data-a="no"]').addEventListener("click", give);
    if (onDelete) scrim.querySelector('[data-a="del"]').addEventListener("click", function(){ closeOverlay(); onDelete(); });
    scrim.querySelector('[data-a="ok"]').addEventListener("click", function(){
      var v = input.value.trim();
      if (!v){ input.focus(); return; }
      closeOverlay(); onSave(v);
    });
    input.addEventListener("keydown", function(e){ if (e.key === "Enter" && !opts.multiline) scrim.querySelector('[data-a="ok"]').click(); });
    overlay.appendChild(scrim);
    setTimeout(function(){ input.focus(); }, 60);
  }

  function openTripEditor(t){

    var foot = sheet.querySelector(".sheet-foot");
    if (!adding){
