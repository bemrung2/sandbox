<title>나의 실험실</title>
<meta name="description" content="실험을 하나씩 만들어 모아두는 개인 실험실. 첫 실험은 후쿠오카 여행 계획표.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --paper: #F5F7F3;
    --surface: #FFFFFF;
    --surface-sunk: #EDF1EB;
    --ink: #131816;
    --ink-soft: #5A6560;
    --ink-faint: #8B958F;
    --line: #DFE5DD;
    --line-strong: #C6D0C6;

    --signal: #0E5C4F;
    --signal-soft: #DCEDE7;
    --travel: #9C6427;
    --travel-soft: #F6E7D5;
    --danger: #A32C22;

    /* itinerary categories — six separated hues, not six tints of the accent */
    --c-air: #3E6FA8;
    --c-move: #667A86;
    --c-food: #B26A22;
    --c-shop: #9B3F6A;
    --c-stay: #0F5C4F;
    --c-free: #6B54B5;
    --c-todo: #6E7671;

    --shadow: rgba(19, 30, 25, 0.10);

    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-t: env(safe-area-inset-top, 0px);
    --bar-h: 58px;
  }

  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper: #0F1413;
      --surface: #161D1B;
      --surface-sunk: #1D2523;
      --ink: #E9EEEA;
      --ink-soft: #9DA9A3;
      --ink-faint: #6F7B76;
      --line: #253029;
      --line-strong: #35423A;

      --signal: #63D4B9;
      --signal-soft: #143C34;
      --travel: #E3A96C;
      --travel-soft: #40301C;
      --danger: #FF9E92;

      --c-air: #8FB8E8;
      --c-move: #A3B2BC;
      --c-food: #E3A96C;
      --c-shop: #E38BB4;
      --c-stay: #63D4B9;
      --c-free: #AE9BF0;
      --c-todo: #9DA9A3;

      --shadow: rgba(0, 0, 0, 0.5);
    }
  }

  :root[data-theme="dark"]{
    --paper: #0F1413;
    --surface: #161D1B;
    --surface-sunk: #1D2523;
    --ink: #E9EEEA;
    --ink-soft: #9DA9A3;
    --ink-faint: #6F7B76;
    --line: #253029;
    --line-strong: #35423A;

    --signal: #63D4B9;
    --signal-soft: #143C34;
    --travel: #E3A96C;
    --travel-soft: #40301C;
    --danger: #FF9E92;

    --c-air: #8FB8E8;
    --c-move: #A3B2BC;
    --c-food: #E3A96C;
    --c-shop: #E38BB4;
    --c-stay: #63D4B9;
    --c-free: #AE9BF0;
    --c-todo: #9DA9A3;

    --shadow: rgba(0, 0, 0, 0.5);
  }

  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  button, label, a, summary{ touch-action: manipulation; }

  html{
    height: 100%;
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }
  body{
    min-height: 100%;
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "IBM Plex Sans KR", system-ui, -apple-system, sans-serif;
    font-size: 15px;
    line-height: 1.55;
    display: flex;
    justify-content: center;
  }

  .app{
    width: 100%;
    max-width: 440px;
    display: flex;
    flex-direction: column;
    background: var(--paper);
  }

  .mono{ font-family: "IBM Plex Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  .icon{ width: 22px; height: 22px; display: block; flex-shrink: 0; }

  /* ---------- top bar ---------- */
  #topbar{
    position: sticky;
    top: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    gap: 6px;
    height: calc(var(--bar-h) + var(--safe-t));
    padding: var(--safe-t) 10px 0;
    background: var(--paper);
    border-bottom: 1px solid var(--line);
  }
  .bar-title{
    flex: 1;
    min-width: 0;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: -0.01em;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .bar-pad{ padding-left: 8px; }

  .icon-btn{
    width: 40px; height: 40px;
    border: none;
    background: transparent;
    color: var(--ink);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
  }
  .icon-btn:hover, .icon-btn.tapped{ background: var(--surface-sunk); }
  .icon-btn:focus-visible{ outline: 2px solid var(--signal); outline-offset: 2px; }

  /* ---------- view ---------- */
  #view{ flex: 1; padding: 0 0 calc(40px + var(--safe-b)); }
  .pad{ padding: 22px 18px 0; }

  .eyebrow{
    font-size: 11px; font-weight: 600; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--ink-faint); margin: 0 0 6px;
  }
  h1.page-title{
    font-size: 25px; font-weight: 700; letter-spacing: -0.02em;
    margin: 0 0 6px; text-wrap: balance;
  }
  .page-sub{ font-size: 13.5px; color: var(--ink-soft); margin: 0 0 26px; max-width: 34em; }

  /* ---------- lab index ---------- */
  .lab-list{ border-top: 1px solid var(--line); }
  .lab-row{
    display: flex; align-items: center; gap: 14px;
    width: 100%; padding: 18px 4px;
    background: transparent; border: none; border-bottom: 1px solid var(--line);
    color: inherit; text-align: left; font: inherit; cursor: pointer;
  }
  .lab-row.tapped{ background: var(--surface-sunk); }
  .lab-row:focus-visible{ outline: 2px solid var(--signal); outline-offset: -2px; }

  .lab-mark{
    width: 42px; height: 42px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .lab-mark.travel{ background: var(--travel-soft); color: var(--travel); }
  .lab-text{ flex: 1; min-width: 0; }
  .lab-index{ display: block; font-size: 10.5px; letter-spacing: 0.1em; color: var(--ink-faint); margin-bottom: 1px; }
  .lab-name{ display: block; font-size: 15.5px; font-weight: 600; }
  .lab-desc{ display: block; font-size: 12.5px; color: var(--ink-soft); margin-top: 2px; }
  .lab-go{ color: var(--ink-faint); }
  .lab-row.vacant{ cursor: default; opacity: 0.75; }
  .lab-row.vacant .lab-mark{ background: transparent; border: 1px dashed var(--line-strong); color: var(--ink-faint); }

  .build-stamp{ margin: 26px 0 0; font-size: 10.5px; color: var(--ink-faint); text-align: center; }

  /* ---------- trip hero ---------- */
  .hero{ padding: 20px 18px 16px; }
  .hero-top{ display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap; }
  .hero-city{ font-size: 27px; font-weight: 700; letter-spacing: -0.03em; margin: 0; }
  .hero-country{ font-size: 12px; color: var(--ink-faint); letter-spacing: 0.1em; }
  .hero-dates{ font-size: 13px; color: var(--ink-soft); margin: 4px 0 0; }

  .countdown{
    display: flex; align-items: center; gap: 10px;
    margin-top: 14px; padding: 12px 14px;
    border-radius: 12px;
    background: var(--signal-soft);
    color: var(--signal);
  }
  .countdown.live{ background: var(--travel-soft); color: var(--travel); }
  .countdown-big{ font-size: 19px; font-weight: 700; letter-spacing: -0.01em; }
  .countdown-sub{ font-size: 12px; opacity: 0.88; }

  /* ---------- tabs ---------- */
  .tabs{
    position: sticky;
    top: calc(var(--bar-h) + var(--safe-t));
    z-index: 15;
    display: flex;
    gap: 2px;
    padding: 0 12px;
    background: var(--paper);
    border-bottom: 1px solid var(--line);
  }
  .tab{
    flex: 1;
    padding: 13px 2px 11px;
    border: none;
    background: transparent;
    color: var(--ink-faint);
    font: inherit;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
  }
  .tab[aria-selected="true"]{ color: var(--ink); border-bottom-color: var(--signal); }
  .tab:focus-visible{ outline: 2px solid var(--signal); outline-offset: -3px; }

  /* ---------- day switch ---------- */
  .dayrow{ display: flex; gap: 8px; padding: 16px 18px 4px; }
  .daybtn{
    flex: 1;
    padding: 9px 4px;
    border: 1px solid var(--line-strong);
    border-radius: 10px;
    background: transparent;
    color: var(--ink-soft);
    font: inherit; font-size: 12.5px; font-weight: 600;
    cursor: pointer;
    line-height: 1.3;
  }
  .daybtn b{ display: block; font-size: 14px; font-weight: 700; }
  .daybtn[aria-pressed="true"]{ background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .daybtn.today:not([aria-pressed="true"]){ border-color: var(--signal); color: var(--signal); }
  .daybtn:focus-visible{ outline: 2px solid var(--signal); outline-offset: 2px; }

  .day-head{ padding: 14px 18px 6px; }
  .day-theme{ font-size: 15px; font-weight: 600; margin: 0; }
  .day-stat{ font-size: 12px; color: var(--ink-faint); margin: 3px 0 0; }

  /* ---------- now banner ---------- */
  .now{
    margin: 12px 18px 0;
    border: 1px solid var(--travel);
    border-radius: 12px;
    overflow: hidden;
  }
  .now-part{ display: flex; gap: 10px; padding: 11px 13px; align-items: flex-start; }
  .now-part + .now-part{ border-top: 1px solid var(--line); }
  .now-tag{
    font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em;
    padding: 2px 7px; border-radius: 5px; flex-shrink: 0; margin-top: 2px;
  }
  .now-tag.on{ background: var(--travel); color: var(--paper); }
  .now-tag.next{ background: var(--surface-sunk); color: var(--ink-soft); }
  .now-title{ font-size: 14px; font-weight: 600; margin: 0; }
  .now-time{ font-size: 11.5px; color: var(--ink-faint); margin: 1px 0 0; }

  /* ---------- timeline ---------- */
  .tl{ padding: 8px 18px 0; }
  .tl-item{ display: flex; gap: 11px; align-items: stretch; }
  .tl-time{
    width: 46px; flex-shrink: 0; padding-top: 13px;
    font-size: 12.5px; font-weight: 600; line-height: 1.25; text-align: right;
  }
  .tl-time small{ display: block; font-size: 10.5px; font-weight: 400; color: var(--ink-faint); }

  .tl-rail{ width: 13px; flex-shrink: 0; position: relative; display: flex; justify-content: center; }
  .tl-rail::before{
    content: ""; position: absolute; top: 0; bottom: 0; width: 1px; background: var(--line);
  }
  .tl-item:first-child .tl-rail::before{ top: 17px; }
  .tl-item:last-child .tl-rail::before{ bottom: calc(100% - 17px); }
  .tl-dot{
    position: relative; margin-top: 13px;
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--paper);
    border: 2px solid var(--c-todo);
  }
  .tl-dot.big{ width: 11px; height: 11px; margin-top: 12px; }

  .tl-body{ flex: 1; min-width: 0; padding: 11px 0 13px; border-bottom: 1px solid var(--line); }
  .tl-item:last-child .tl-body{ border-bottom: none; }
  .tl-head{ display: flex; align-items: flex-start; gap: 8px; }
  .tl-title{ flex: 1; min-width: 0; font-size: 14.5px; font-weight: 600; margin: 0; word-break: keep-all; }
  .tl-title .emo{ margin-right: 4px; }
  .tl-line{ font-size: 12.5px; color: var(--ink-soft); margin: 3px 0 0; word-break: keep-all; }
  .tl-line::before{ content: "— "; color: var(--ink-faint); }
  .tl-meta{ display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 7px; }

  .tl-item.done .tl-title,
  .tl-item.done .tl-line{ text-decoration: line-through; color: var(--ink-faint); }
  .tl-item.done .tl-dot{ background: var(--c-todo); }

  .tl-item.current .tl-body{
    background: var(--travel-soft);
    margin-left: -8px; padding-left: 8px; padding-right: 8px;
    border-radius: 8px; border-bottom-color: transparent;
  }

  .check{
    width: 30px; height: 30px; flex-shrink: 0;
    border: 1px solid var(--line-strong);
    border-radius: 8px;
    background: transparent;
    color: transparent;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .check .icon{ width: 17px; height: 17px; }
  .check[aria-pressed="true"]{ background: var(--signal); border-color: var(--signal); color: var(--paper); }
  .check:focus-visible{ outline: 2px solid var(--signal); outline-offset: 2px; }

  /* ---------- badges ---------- */
  .badge{
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 11px; font-weight: 600;
    padding: 3px 8px; border-radius: 6px;
    background: var(--surface-sunk); color: var(--ink-soft);
  }
  .badge.cat{ background: transparent; border: 1px solid currentColor; }
  .badge.fixed{ background: var(--danger); color: var(--paper); }
  .badge.reserved{ background: var(--signal); color: var(--paper); }
  .badge.maybe{ background: transparent; border: 1px dashed var(--line-strong); color: var(--ink-faint); }

  .maplink{
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 11px; font-weight: 600;
    padding: 3px 8px; border-radius: 6px;
    background: var(--surface-sunk); color: var(--ink-soft);
    text-decoration: none;
  }
  .maplink .icon{ width: 13px; height: 13px; }

  /* ---------- chips ---------- */
  .chiprow{
    display: flex; gap: 7px; padding: 16px 18px 2px;
    overflow-x: auto; -webkit-overflow-scrolling: touch;
  }
  .chiprow::-webkit-scrollbar{ display: none; }
  .chip{
    flex-shrink: 0;
    border: 1px solid var(--line-strong);
    background: transparent;
    color: var(--ink-soft);
    border-radius: 999px;
    padding: 7px 14px;
    font: inherit; font-size: 13px; font-weight: 600;
    cursor: pointer;
  }
  .chip[aria-pressed="true"]{ background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .chip:focus-visible{ outline: 2px solid var(--signal); outline-offset: 2px; }

  /* ---------- cards ---------- */
  .card{
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 13px;
    padding: 14px;
    margin: 0 18px 10px;
  }
  .card.dashed{ background: transparent; border-style: dashed; }
  .card-top{ display: flex; align-items: flex-start; gap: 10px; }
  .card-name{ flex: 1; min-width: 0; font-size: 15.5px; font-weight: 700; margin: 0; word-break: keep-all; }
  .card-when{ font-size: 11.5px; color: var(--ink-faint); margin: 0 0 3px; }
  .card-kind{ font-size: 12.5px; color: var(--ink-soft); margin: 4px 0 0; }
  .card-note{ font-size: 12px; color: var(--ink-soft); margin: 8px 0 0; padding-top: 8px; border-top: 1px dashed var(--line); }
  .card-meta{ display: flex; gap: 6px; flex-wrap: wrap; margin-top: 9px; }

  .group-label{
    display: flex; align-items: baseline; gap: 8px;
    padding: 20px 18px 8px;
  }
  .group-label h3{
    font-size: 12px; font-weight: 600; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--ink-faint); margin: 0;
  }
  .group-count{ font-size: 11px; color: var(--ink-faint); }

  /* ---------- shopping ---------- */
  .buy-row{
    display: flex; align-items: center; gap: 10px;
    padding: 9px 0;
    border-top: 1px dashed var(--line);
  }
  .buy-row:first-of-type{ border-top: 1px solid var(--line); margin-top: 10px; }
  .buy-text{ flex: 1; min-width: 0; font-size: 13.5px; word-break: break-word; }
  .buy-row.got .buy-text{ text-decoration: line-through; color: var(--ink-faint); }
  .buy-del{
    border: none; background: transparent; color: var(--ink-faint);
    cursor: pointer; padding: 4px; display: flex;
  }
  .buy-del .icon{ width: 15px; height: 15px; }

  .addtoggle{
    margin-top: 10px;
    border: none; background: transparent;
    color: var(--ink-faint);
    font: inherit; font-size: 12.5px; font-weight: 600;
    padding: 4px 0; cursor: pointer;
  }
  .addtoggle:hover, .addtoggle.tapped{ color: var(--signal); }
  .addtoggle:focus-visible{ outline: 2px solid var(--signal); outline-offset: 2px; }

  .additem{ display: flex; gap: 7px; margin-top: 10px; }
  .additem input{
    flex: 1; min-width: 0;
    border: 1px solid var(--line-strong);
    border-radius: 9px;
    padding: 9px 11px;
    font-family: inherit;
    font-size: 16px; /* keeps iOS from zooming on focus */
    background: var(--paper);
    color: var(--ink);
  }
  .additem input:focus{ outline: none; border-color: var(--signal); }
  .additem button{
    border: none; border-radius: 9px;
    background: var(--surface-sunk); color: var(--ink);
    font: inherit; font-size: 13px; font-weight: 600;
    padding: 0 14px; cursor: pointer;
  }

  /* ---------- info ---------- */
  .fact{ display: flex; align-items: flex-start; gap: 11px; padding: 11px 0; border-bottom: 1px solid var(--line); }
  .fact:last-child{ border-bottom: none; }
  .fact .icon{ width: 18px; height: 18px; color: var(--ink-faint); margin-top: 2px; }
  .fact-body{ flex: 1; min-width: 0; }
  .fact-label{ font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-faint); margin: 0; }
  .fact-value{ font-size: 14px; font-weight: 500; margin: 2px 0 0; word-break: keep-all; }
  .fact-value small{ display: block; font-weight: 400; font-size: 12px; color: var(--ink-soft); margin-top: 2px; }

  .calc{ display: flex; align-items: center; gap: 9px; margin-top: 12px; }
  .calc input{
    flex: 1; min-width: 0;
    border: 1px solid var(--line-strong);
    border-radius: 10px;
    padding: 11px 12px;
    font-family: "IBM Plex Mono", monospace;
    font-size: 16px;
    background: var(--paper);
    color: var(--ink);
    text-align: right;
  }
  .calc input:focus{ outline: none; border-color: var(--signal); }
  .calc span{ font-size: 13px; color: var(--ink-faint); flex-shrink: 0; }
  .rate-row{ display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 12px; color: var(--ink-soft); }
  .rate-row input{
    width: 84px;
    border: 1px solid var(--line-strong);
    border-radius: 8px;
    padding: 6px 9px;
    font-family: "IBM Plex Mono", monospace;
    font-size: 16px;
    background: var(--paper);
    color: var(--ink);
    text-align: right;
  }
  .rate-row input:focus{ outline: none; border-color: var(--signal); }

  .quick{ display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .quick button{
    border: 1px solid var(--line-strong); border-radius: 8px;
    background: transparent; color: var(--ink-soft);
    font-family: "IBM Plex Mono", monospace; font-size: 12px;
    padding: 6px 10px; cursor: pointer;
  }

  .pack-row{ display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px dashed var(--line); }
  .pack-row:last-child{ border-bottom: none; }
  .pack-text{ flex: 1; font-size: 13.5px; }
  .pack-row.on .pack-text{ text-decoration: line-through; color: var(--ink-faint); }

  .tip{ font-size: 12.5px; color: var(--ink-soft); margin: 6px 0 0; padding-left: 14px; text-indent: -14px; }
  .tip::before{ content: "· "; color: var(--ink-faint); }

  .notice{
    display: flex; align-items: flex-start; gap: 8px;
    background: var(--travel-soft); color: var(--travel);
    border-radius: 10px; padding: 10px 12px;
    font-size: 11.5px; font-weight: 500;
    margin: 14px 18px 0;
  }
  .notice .icon{ width: 16px; height: 16px; margin-top: 1px; }

  .toast{
    position: fixed; left: 50%; bottom: calc(26px + var(--safe-b));
    transform: translateX(-50%) translateY(8px);
    background: var(--ink); color: var(--paper);
    padding: 12px 18px; border-radius: 11px;
    font-size: 13px; font-weight: 500;
    z-index: 60; opacity: 0; pointer-events: none;
    transition: opacity 0.18s ease, transform 0.18s ease;
    max-width: 88%; text-align: center;
  }
  .toast.show{ opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (prefers-reduced-motion: reduce){ .toast{ transition: none; } }
  [hidden]{ display: none !important; }
</style>

</div>

<script>
(function(){
  "use strict";

  var BUILD = "2026.09.11 · r3";

  /* ================= helpers ================= */
  function el(html){
    var t = document.createElement("template");
    t.innerHTML = html.trim();
    return t.content.firstElementChild;
  }
  var ESC = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return ESC[c]; });
  }

  /* Press feedback on pointerdown so a tap feels instant; the action runs on
     click. Acting on pointerdown re-renders under the finger and lets the
     trailing click hit whatever replaced it — one tap, two screens. */
  function tap(node, handler){
    function off(){ node.classList.remove("tapped"); }
    node.addEventListener("pointerdown", function(e){
      if (e.button && e.button !== 0) return;
      node.classList.add("tapped");
    });
    node.addEventListener("pointerup", off);
    node.addEventListener("pointercancel", off);
    node.addEventListener("pointerleave", off);
    node.addEventListener("click", function(e){ off(); handler(e); });
    return node;
  }

  /* ================= time ================= */
  /* Korea and Japan share UTC+9, so the device clock needs no conversion. */
  function mins(hhmm){
    if (!hhmm) return null;
    var p = hhmm.split(":");
    return (+p[0]) * 60 + (+p[1]);
  }
  function fmtMD(iso){
    var p = iso.split("-");
    return (+p[1]) + "." + (+p[2]);
  }
  function todayISO(){
    var d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
  }
  function dayDiff(aISO, bISO){
    return Math.round((new Date(aISO + "T00:00:00") - new Date(bISO + "T00:00:00")) / 86400000);
  }
  function nowMins(){
    var d = new Date();
    return d.getHours() * 60 + d.getMinutes();
  }
  /* Which day of the trip we are on, or -1 when outside it. */
  function todayIndex(){
    var t = todayISO();
    for (var i = 0; i < TRIP.days.length; i++) if (TRIP.days[i].date === t) return i;
    return -1;
  }
  /* An item's span; items with no end run until the next item starts. */
  function spans(day){
    var out = [];
    for (var i = 0; i < day.items.length; i++){
      var it = day.items[i];
      var s = mins(it.s);
      var e = it.e ? mins(it.e) : null;
      if (e === null){
        for (var j = i + 1; j < day.items.length; j++){
          var ns = mins(day.items[j].s);
          if (ns > s){ e = ns; break; }
        }
      }
      out.push({ item: it, s: s, e: e === null ? s + 90 : e });
    }
    return out;
  }
  function currentPair(){
    var di = todayIndex();
    if (di < 0) return null;
    var n = nowMins();
    var sp = spans(TRIP.days[di]);
    var cur = null, next = null;
    for (var i = 0; i < sp.length; i++){
      if (n >= sp[i].s && n < sp[i].e && !cur) cur = sp[i].item;
      if (sp[i].s > n && !next) next = sp[i].item;
    }
    return { dayIndex: di, current: cur, next: next };
  }

  var Saved = {
    backend: "local",
    db: null,
    data: { done:{}, bought:{}, extra:{}, pack:{}, rate:950 },
    _t: null,

    async init(){
      try{
        if (window.claude && typeof window.claude.use === "function"){
          var db = await window.claude.use("db");
          if (db){ this.db = db; this.backend = "db"; }
        }
      }catch(e){ /* stay local */ }

      try{
        var raw;
        if (this.backend === "db"){
          var snap = await this.db.doc("trips/fukuoka2026").get();
          raw = snap.exists ? snap.data() : null;
        } else {
          raw = JSON.parse(localStorage.getItem("lab.fukuoka2026") || "null");
        }
        if (raw) this.data = Object.assign(this.data, raw);
      }catch(e){ /* first run, or storage unavailable */ }
    },

    /* Writes are batched: a burst of checkbox taps becomes one save. */
    flush(){
      var self = this;
      clearTimeout(this._t);
      this._t = setTimeout(function(){
        try{
          if (self.backend === "db") self.db.doc("trips/fukuoka2026").set(self.data);
          else localStorage.setItem("lab.fukuoka2026", JSON.stringify(self.data));
        }catch(e){ /* nothing we can do from here; state stays in memory */ }
      }, 400);
    },

    isDone(id){ return !!this.data.done[id]; },
    toggleDone(id){
      if (this.data.done[id]) delete this.data.done[id];
      else this.data.done[id] = 1;
      this.flush();
    },
    isBought(k){ return !!this.data.bought[k]; },
    toggleBought(k){
      if (this.data.bought[k]) delete this.data.bought[k];
      else this.data.bought[k] = 1;
      this.flush();
    },
    extraOf(shopId){ return this.data.extra[shopId] || []; },
    addExtra(shopId, text){
      var list = this.data.extra[shopId] || [];
      list.push(text);
      this.data.extra[shopId] = list;
      this.flush();
    },
    removeExtra(shopId, text){
      var list = (this.data.extra[shopId] || []).filter(function(x){ return x !== text; });
      this.data.extra[shopId] = list;
      delete this.data.bought[shopId + "::" + text];
      this.flush();
    },
    isPacked(k){ return !!this.data.pack[k]; },
    togglePacked(k){
      if (this.data.pack[k]) delete this.data.pack[k];
      else this.data.pack[k] = 1;
      this.flush();
    },

      box = el('<div class="now"></div>');
      box.appendChild(el(
        '<div class="now-part">' +
          '<span class="now-tag on">지금</span>' +
          '<div><p class="now-title">' + (cur ? esc(cur.emo + " " + cur.title) : "일정 사이 — 여유 시간") + '</p>' +
          '<p class="now-time mono">' + (cur ? esc(cur.s + (cur.e ? "–" + cur.e : "~")) : "") + '</p></div>' +
        '</div>'
      ));
      if (nx){
        box.appendChild(el(
          '<div class="now-part">' +
            '<span class="now-tag next">다음</span>' +
            '<div><p class="now-title">' + esc(nx.emo + " " + nx.title) + '</p>' +
            '<p class="now-time mono">' + esc(nx.s) + ' 시작</p></div>' +
          '</div>'
        ));
      }
    } else {
      var label = d > 0 ? "D-" + d : (d === 0 ? "오늘 출발" : "여행 완료");
      var sub = d > 0 ? "9월 12일 11:10 한국 출발" : (d === 0 ? "11:10 한국 출발" : "다녀온 여행");
      box = el(
        '<div class="countdown' + (d === 0 ? " live" : "") + '">' +
          icon("plane") +
          '<div><div class="countdown-big mono">' + esc(label) + '</div>' +
          '<div class="countdown-sub">' + esc(sub) + '</div></div>' +
        '</div>'
      );
    }

    var hero = el(
      '<div class="hero">' +
        '<div class="hero-top">' +
          '<h1 class="hero-city">' + esc(TRIP.city) + '</h1>' +
          '<span class="hero-country mono">' + esc(TRIP.country) + '</span>' +
        '</div>' +
        '<p class="hero-dates mono">' + fmtMD(TRIP.start) + ' (토) – ' + fmtMD(TRIP.end) + ' (월) · 2박 3일</p>' +
      '</div>'
    );
    hero.appendChild(box);
    return hero;
  }

  /* ================= tab: schedule ================= */
  function renderSchedule(root){
    var pair = currentPair();

    var dayrow = el('<div class="dayrow"></div>');
    TRIP.days.forEach(function(day, i){
      var isToday = pair && pair.dayIndex === i;
      var b = el(
        '<button class="daybtn' + (isToday ? " today" : "") + '" type="button" aria-pressed="' +
          (state.day === i) + '"><b>' + fmtMD(day.date) + '</b>' + day.dow + (isToday ? " · 오늘" : "") + '</button>'
      );
      tap(b, function(){ go({ day: i }); });
      dayrow.appendChild(b);
    });
    root.appendChild(dayrow);

    var day = TRIP.days[state.day];
    var doneCount = day.items.filter(function(it){ return Saved.isDone(it.id); }).length;

    root.appendChild(el(
      '<div class="day-head">' +
        '<p class="day-theme">' + esc(day.theme) + '</p>' +
        '<p class="day-stat mono">' + day.items.length + '개 일정 · ' + doneCount + '개 완료</p>' +
      '</div>'
    ));

    if (pair && pair.dayIndex === state.day && pair.current){
      root.appendChild(el(
        '<div class="notice">' + icon("clock") +
        '<span>지금 진행 중: ' + esc(pair.current.title) + '</span></div>'
      ));
    }

    var tl = el('<div class="tl"></div>');
    day.items.forEach(function(it){
      tl.appendChild(timelineItem(it, pair));
    });
    root.appendChild(tl);
  }

  function timelineItem(it, pair){
    var cat = CAT[it.cat] || CAT.todo;
    var isCurrent = pair && pair.current && pair.current.id === it.id;
    var done = Saved.isDone(it.id);

    var row = el(
      '<div class="tl-item' + (done ? " done" : "") + (isCurrent ? " current" : "") + '">' +
        '<div class="tl-time mono">' + esc(it.s) + (it.e ? '<small>' + esc(it.e) + '</small>' : (it.open ? '<small>~</small>' : '')) + '</div>' +
        '<div class="tl-rail"><span class="tl-dot' + (it.fixed ? " big" : "") + '" style="border-color:' + cat.color + '"></span></div>' +
        '<div class="tl-body">' +
          '<div class="tl-head">' +
            '<p class="tl-title"><span class="emo">' + it.emo + '</span>' + esc(it.title) + '</p>' +
          '</div>' +
        '</div>' +
      '</div>'
    );

    var body = row.querySelector(".tl-body");
    var head = row.querySelector(".tl-head");

    var check = el('<button class="check" type="button" aria-pressed="' + done + '" aria-label="완료 표시">' + icon("check") + '</button>');
    tap(check, function(){
      Saved.toggleDone(it.id);
      render();
    });
    head.appendChild(check);

    (it.lines || []).forEach(function(line){
      body.appendChild(el('<p class="tl-line">' + esc(line) + '</p>'));
    });

    if (it.candidates){
      it.candidates.forEach(function(c){
        body.appendChild(el('<p class="tl-line">' + esc(c.name) + (c.kind ? " · " + esc(c.kind) : "") + '</p>'));
      });
    }
    if (it.note){
      body.appendChild(el('<p class="tl-line">' + esc(it.note) + '</p>'));
    }

    var meta = el('<div class="tl-meta"></div>');
    meta.appendChild(el('<span class="badge cat" style="color:' + cat.color + '">' + cat.label + '</span>'));
    if (it.reserved){
      meta.appendChild(el('<span class="badge reserved">예약 ' + esc(it.reserved.time) + ' · ' + it.reserved.people + '명</span>'));
    }
    if (it.fixed && !it.reserved){
      meta.appendChild(el('<span class="badge fixed">시간 엄수</span>'));
    }
    if (it.undecided){
      meta.appendChild(el('<span class="badge maybe">가게 미정</span>'));
    }
    if (it.place){
      meta.appendChild(el('<a class="maplink" href="' + esc(mapUrl(it.place)) + '" target="_blank" rel="noopener">' + icon("pin") + '지도</a>'));
    }
    body.appendChild(meta);

    return row;
  }

  /* ================= tab: food ================= */
  function foodList(){
    var out = [];
    TRIP.days.forEach(function(day, di){
      day.items.forEach(function(it){
        if (it.meal) out.push({ item: it, day: day, dayIndex: di });
      });
    });
    return out;
  }

  function renderFood(root){
    var chips = el('<div class="chiprow"></div>');
    var all = foodList();
    MEALS.forEach(function(m){
      var n = m.key === "all" ? all.length : all.filter(function(f){ return f.item.meal === m.key; }).length;
      if (n === 0 && m.key !== "all") return;
      var b = el('<button class="chip" type="button" aria-pressed="' + (state.meal === m.key) + '">' +
        m.label + ' <span class="mono">' + n + '</span></button>');
      tap(b, function(){ go({ meal: m.key }); });
      chips.appendChild(b);
    });
    root.appendChild(chips);

    var list = state.meal === "all" ? all : all.filter(function(f){ return f.item.meal === state.meal; });

    var lastDay = -1;
    list.forEach(function(f){
      if (f.dayIndex !== lastDay){
        lastDay = f.dayIndex;
        var dayCount = list.filter(function(x){ return x.dayIndex === f.dayIndex; }).length;
        root.appendChild(el(
          '<div class="group-label"><h3>' + fmtMD(f.day.date) + ' (' + f.day.dow + ')</h3>' +
          '<span class="group-count mono">' + dayCount + '</span></div>'
        ));
      }
      root.appendChild(foodCard(f));
    });

    if (list.length === 0){
      root.appendChild(el('<div class="card dashed"><p class="card-kind">해당하는 식사가 없어요.</p></div>'));
    }
  }

  function foodCard(f){
    var it = f.item;
    var card = el('<div class="card' + (it.undecided || it.open ? " dashed" : "") + '"></div>');

    card.appendChild(el(
      '<p class="card-when mono">' + esc(it.s) + (it.e ? '–' + esc(it.e) : '~') + ' · ' +
      esc(MEAL_LABEL[it.meal] || "") + '</p>'
    ));

    var top = el('<div class="card-top"><p class="card-name">' + it.emo + ' ' + esc(it.title) + '</p></div>');
    card.appendChild(top);

    (it.lines || []).forEach(function(l){
      card.appendChild(el('<p class="card-kind">' + esc(l) + '</p>'));
    });

    if (it.candidates){
      it.candidates.forEach(function(c){
        card.appendChild(el('<p class="card-kind">· ' + esc(c.name) + (c.kind ? ' — ' + esc(c.kind) : '') + '</p>'));
      });
    }
    if (it.note) card.appendChild(el('<p class="card-note">' + esc(it.note) + '</p>'));

    var meta = el('<div class="card-meta"></div>');
    if (it.reserved){
      meta.appendChild(el('<span class="badge reserved">예약 확정 ' + esc(it.reserved.time) + ' · ' + it.reserved.people + '명</span>'));
    }
    if (it.undecided) meta.appendChild(el('<span class="badge maybe">가게 미정</span>'));
    if (it.open) meta.appendChild(el('<span class="badge maybe">후보 중 선택</span>'));
    if (it.place){
      meta.appendChild(el('<a class="maplink" href="' + esc(mapUrl(it.place)) + '" target="_blank" rel="noopener">' + icon("pin") + '지도</a>'));
    }
    if (it.candidates){
      it.candidates.forEach(function(c){
        if (c.name.indexOf("현장") === 0 || c.name.indexOf("이자카야 /") === 0) return;
        meta.appendChild(el('<a class="maplink" href="' + esc(mapUrl(c.name)) + '" target="_blank" rel="noopener">' + icon("pin") + esc(c.name) + '</a>'));
      });
    }
    card.appendChild(meta);
    return card;
  }

  /* ================= tab: shopping ================= */
  function renderShop(root){
    var total = 0, got = 0;
    SHOPS.forEach(function(s){
      var items = s.preset.concat(Saved.extraOf(s.id));
      total += items.length;
      items.forEach(function(i){ if (Saved.isBought(s.id + "::" + i)) got++; });
    });

    root.appendChild(el(
      '<div class="day-head" style="padding-top:18px">' +
        '<p class="day-theme">쇼핑 목록</p>' +
        '<p class="day-stat mono">' + SHOPS.length + '곳 · 살 것 ' + got + '/' + total + '</p>' +
      '</div>'
    ));

    var lastDay = -1;
    SHOPS.forEach(function(s){
      if (s.day !== lastDay){
        lastDay = s.day;
        var day = TRIP.days[s.day];
        var n = SHOPS.filter(function(x){ return x.day === s.day; }).length;
        root.appendChild(el(
          '<div class="group-label"><h3>' + fmtMD(day.date) + ' (' + day.dow + ')</h3>' +
          '<span class="group-count mono">' + n + '곳</span></div>'
        ));
      }
      root.appendChild(shopCard(s));
    });
  }

  function shopCard(s){
    var card = el('<div class="card"></div>');
    card.appendChild(el('<p class="card-when mono">' + esc(s.time) + ' · ' + esc(s.area) + '</p>'));

    var top = el('<div class="card-top"><p class="card-name">' + esc(s.name) + '</p></div>');
    top.appendChild(el('<a class="maplink" href="' + esc(mapUrl(s.name)) + '" target="_blank" rel="noopener">' + icon("pin") + '지도</a>'));
    card.appendChild(top);

    var items = s.preset.concat(Saved.extraOf(s.id));
    items.forEach(function(name){
      var key = s.id + "::" + name;
      var bought = Saved.isBought(key);
      var row = el('<div class="buy-row' + (bought ? " got" : "") + '"></div>');

      var cb = el('<button class="check" type="button" aria-pressed="' + bought + '" aria-label="샀음 표시">' + icon("check") + '</button>');
      tap(cb, function(){ Saved.toggleBought(key); render(); });
      row.appendChild(cb);

      row.appendChild(el('<span class="buy-text">' + esc(name) + '</span>'));

      if (s.preset.indexOf(name) === -1){
        var del = el('<button class="buy-del" type="button" aria-label="삭제">' + icon("x") + '</button>');
        tap(del, function(){ Saved.removeExtra(s.id, name); render(); });
        row.appendChild(del);
      }
      card.appendChild(row);
    });

    /* The input stays folded away: most stores have nothing listed yet, and
       nine open input boxes turn the page into a wall of identical fields. */
    var addBtn = el('<button class="addtoggle" type="button">+ 살 것 적어두기</button>');
    var add = el(
      '<div class="additem" hidden>' +
        '<input type="text" placeholder="예: 티셔츠" aria-label="살 것 추가">' +
        '<button type="button">추가</button>' +
      '</div>'
    );
    var input = add.querySelector("input");
    function submit(){
      var v = input.value.trim();
      if (!v) return;
      Saved.addExtra(s.id, v);
      input.value = "";
      render();
    }
    tap(addBtn, function(){
      addBtn.hidden = true;
      add.hidden = false;
      input.focus();
    });
    tap(add.querySelector("button"), submit);
    input.addEventListener("keydown", function(e){ if (e.key === "Enter") submit(); });
    card.appendChild(addBtn);
    card.appendChild(add);

    return card;
  }

  /* ================= tab: info ================= */
  function renderInfo(root){
    var flights = el('<div class="card"><p class="card-when mono">항공</p></div>');
    flights.appendChild(fact("plane", "가는 편 · 9.12 (토)", "11:10 한국 출발<small>12:40 후쿠오카 도착</small>"));
    flights.appendChild(fact("plane", "오는 편 · 9.14 (월)", "13:40 한국행 출발<small>11:40 공항 도착 — 출발 2시간 전</small>"));
    root.appendChild(flights);

    var stay = el('<div class="card"><p class="card-when mono">숙소 · 짐</p></div>');
    stay.appendChild(fact("bed", "나카스 호텔", "9.12 17:30 체크인<small>9.14 10:55 전 체크아웃 · 캐리어 픽업</small>"));
    stay.appendChild(fact("box", "CARGO PASS", "9.12 13:25–13:40 공항에서 접수<small>캐리어가 숙소로 바로 배송 — 체크인 때 수령 확인</small>"));
    root.appendChild(stay);

    var book = el('<div class="card"><p class="card-when mono">예약 확정</p></div>');
    book.appendChild(fact("clock", "야키니쿠 카쿠라 니시나카스점", "9.13 (일) 17:15 · 2명<small>이 시간만은 고정 — 16:30 니시나카스 방향 이동</small>"));
    root.appendChild(book);

    root.appendChild(currencyCard());
    root.appendChild(packingCard());

    var tips = el('<div class="card"><p class="card-when mono">메모</p></div>');
    [
      "한국과 일본은 시차가 없습니다. 시계 그대로 쓰면 됩니다.",
      "면세를 받으려면 여권이 필요합니다. 돈키호테·백화점 쇼핑 때 챙기세요.",
      "작은 이자카야는 현금만 받는 곳이 있습니다. 엔화 현금을 조금은 준비하세요.",
      "9월 후쿠오카는 비가 올 수 있습니다. 접이식 우산 하나가 편합니다.",
      "9.12 밤 술집은 건너뛰고 9.13으로 넘겨도 되는 일정입니다."
    ].forEach(function(t){ tips.appendChild(el('<p class="tip">' + esc(t) + '</p>')); });
    root.appendChild(tips);
  }

  function fact(ic, label, valueHtml){
    return el(
      '<div class="fact">' + icon(ic) +
        '<div class="fact-body"><p class="fact-label">' + esc(label) + '</p>' +
        '<p class="fact-value">' + valueHtml + '</p></div>' +
      '</div>'
    );
  }

  function currencyCard(){
    var card = el('<div class="card"><p class="card-when mono">환율 계산기</p></div>');
    card.appendChild(el('<p class="card-name" style="font-size:14px">엔 → 원</p>'));

    var calc = el(
      '<div class="calc">' +
        '<input type="text" inputmode="decimal" id="yen" value="1000" aria-label="엔 금액">' +
        '<span class="mono">엔 =</span>' +
      '</div>'
    );
    var out = el('<p class="fact-value mono" id="krw" style="margin-top:10px;font-size:19px;font-weight:700"></p>');
    card.appendChild(calc);
    card.appendChild(out);

    var quick = el('<div class="quick"></div>');
    [500, 1000, 3000, 5000, 10000].forEach(function(v){
      var b = el('<button type="button">' + v.toLocaleString() + '엔</button>');
      tap(b, function(){
        calc.querySelector("#yen").value = String(v);
        update();
      });
      quick.appendChild(b);
    });
    card.appendChild(quick);

    var rateRow = el(
      '<div class="rate-row"><span>기준 · 100엔 =</span>' +
      '<input type="text" inputmode="decimal" id="rate" value="' + Saved.data.rate + '" aria-label="100엔당 원화">' +
      '<span>원</span></div>'
    );
    card.appendChild(rateRow);
    card.appendChild(el('<p class="tip" style="margin-top:8px">기본값은 어림값입니다. 실제 환율을 확인해서 고쳐 쓰세요.</p>'));

    function update(){
      var yen = parseFloat(String(calc.querySelector("#yen").value).replace(/[^0-9.]/g, "")) || 0;
      var rate = parseFloat(String(rateRow.querySelector("#rate").value).replace(/[^0-9.]/g, "")) || 0;
      var krw = Math.round(yen * rate / 100);
      out.textContent = krw.toLocaleString() + " 원";
    }
    calc.querySelector("#yen").addEventListener("input", update);
    rateRow.querySelector("#rate").addEventListener("input", function(){
      var v = parseFloat(String(rateRow.querySelector("#rate").value).replace(/[^0-9.]/g, ""));
      if (v) Saved.setRate(v);
      update();
    });
    update();

    return card;
  }

  function packingCard(){
    var done = PACKING.filter(function(p){ return Saved.isPacked(p); }).length;
    var card = el('<div class="card"><p class="card-when mono">준비물 · ' + done + '/' + PACKING.length + '</p></div>');
    PACKING.forEach(function(p){
      var on = Saved.isPacked(p);
      var row = el('<div class="pack-row' + (on ? " on" : "") + '"></div>');
      var cb = el('<button class="check" type="button" aria-pressed="' + on + '" aria-label="챙김 표시">' + icon("check") + '</button>');
      tap(cb, function(){ Saved.togglePacked(p); render(); });
      row.appendChild(cb);
      row.appendChild(el('<span class="pack-text">' + esc(p) + '</span>'));
      card.appendChild(row);
    });
    return card;
  }

  /* ================= render ================= */
  function render(){
    if (state.view === "home") renderHome();
    else renderTrip();
  }

  (async function boot(){
    await Saved.init();
    var di = todayIndex();
    if (di >= 0) state.day = di;
    render();
  })();
})();
</script>
<!--/body-->
