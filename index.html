<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F5F7F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1413" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="나의 실험실">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>나의 실험실</title>
<meta name="description" content="실험을 하나씩 만들어 모아두는 개인 실험실. 첫 실험은 후쿠오카 여행 계획표.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --paper: #F5F7F3;
    --surface: #FFFFFF;
    --surface-sunk: #EDF1EB;
    --ink: #131816;
    --ink-soft: #5A6560;
    --ink-faint: #8B958F;
    --line: #DFE5DD;
    --line-strong: #C6D0C6;

    --signal: #0E5C4F;
    --signal-soft: #DCEDE7;
    --travel: #9C6427;
    --travel-soft: #F6E7D5;
    --danger: #A32C22;

    /* itinerary categories — six separated hues, not six tints of the accent */
    --c-air: #3E6FA8;
    --c-move: #667A86;
    --c-food: #B26A22;
    --c-shop: #9B3F6A;
    --c-stay: #0F5C4F;
    --c-free: #6B54B5;
    --c-todo: #6E7671;

    --shadow: rgba(19, 30, 25, 0.10);
    --scrim: rgba(12, 20, 16, 0.45);

    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-t: env(safe-area-inset-top, 0px);
    --bar-h: 58px;
  }

  /* Dark tokens live in one block, applied both by system preference and by
     the in-app toggle, so the two can never drift apart. */
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper: #0F1413;
      --surface: #161D1B;
      --surface-sunk: #1D2523;
      --ink: #E9EEEA;
      --ink-soft: #9DA9A3;
      --ink-faint: #6F7B76;
      --line: #253029;
      --line-strong: #35423A;

      --signal: #63D4B9;
      --signal-soft: #143C34;
      --travel: #E3A96C;
      --travel-soft: #40301C;
      --danger: #FF9E92;

      --c-air: #8FB8E8;
      --c-move: #A3B2BC;
      --c-food: #E3A96C;
      --c-shop: #E38BB4;
      --c-stay: #63D4B9;
      --c-free: #AE9BF0;
      --c-todo: #9DA9A3;

      --shadow: rgba(0, 0, 0, 0.5);
      --scrim: rgba(0, 0, 0, 0.6);
    }
  }

  :root[data-theme="dark"]{
    --paper: #0F1413;
    --surface: #161D1B;
    --surface-sunk: #1D2523;
    --ink: #E9EEEA;
    --ink-soft: #9DA9A3;
    --ink-faint: #6F7B76;
    --line: #253029;
    --line-strong: #35423A;

    --signal: #63D4B9;
    --signal-soft: #143C34;
    --travel: #E3A96C;
    --travel-soft: #40301C;
    --danger: #FF9E92;

    --c-air: #8FB8E8;
    --c-move: #A3B2BC;
    --c-food: #E3A96C;
    --c-shop: #E38BB4;
    --c-stay: #63D4B9;
    --c-free: #AE9BF0;
    --c-todo: #9DA9A3;

    --shadow: rgba(0, 0, 0, 0.5);
    --scrim: rgba(0, 0, 0, 0.6);
  }

  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  button, label, a, summary{ touch-action: manipulation; }

  html{
    height: 100%;
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }
  body{
    min-height: 100%;
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "IBM Plex Sans KR", system-ui, -apple-system, sans-serif;
    font-size: 15px;
    line-height: 1.55;
    display: flex;
    justify-content: center;
  }

  .app{
    width: 100%;
    max-width: 440px;
    display: flex;
    flex-direction: column;
    background: var(--paper);
  }

  .mono{ font-family: "IBM Plex Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  .icon{ width: 22px; height: 22px; display: block; flex-shrink: 0; }

  /* ---------- top bar ---------- */
  #topbar{
    position: sticky;
    top: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    gap: 4px;
    height: calc(var(--bar-h) + var(--safe-t));
    padding: var(--safe-t) 10px 0;
    background: var(--paper);
    border-bottom: 1px solid var(--line);
  }
  .bar-title{
    flex: 1;
    min-width: 0;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: -0.01em;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .bar-pad{ padding-left: 8px; }

  .icon-btn{
    width: 40px; height: 40px;
    border: none;
    background: transparent;
    color: var(--ink);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
  }
  .icon-btn:hover, .icon-btn.tapped{ background: var(--surface-sunk); }
  .icon-btn:focus-visible{ outline: 2px solid var(--signal); outline-offset: 2px; }
  .icon-btn .icon{ width: 20px; height: 20px; }

  /* ---------- view ---------- */
  #view{ flex: 1; padding: 0 0 calc(40px + var(--safe-b)); }
  .pad{ padding: 22px 18px 0; }

  .eyebrow{
    font-size: 11px; font-weight: 600; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--ink-faint); margin: 0 0 6px;
  }
  h1.page-title{
    font-size: 25px; font-weight: 700; letter-spacing: -0.02em;
    margin: 0 0 6px; text-wrap: balance;
  }
  .page-sub{ font-size: 13.5px; color: var(--ink-soft); margin: 0 0 26px; max-width: 34em; }

  /* ---------- lab index ---------- */
  .lab-list{ border-top: 1px solid var(--line); }
  .lab-row{
    display: flex; align-items: center; gap: 14px;
    width: 100%; padding: 18px 4px;
    background: transparent; border: none; border-bottom: 1px solid var(--line);
    color: inherit; text-align: left; font: inherit; cursor: pointer;
  }
  .lab-row.tapped{ background: var(--surface-sunk); }
  .lab-row:focus-visible{ outline: 2px solid var(--signal); outline-offset: -2px; }

  .lab-mark{
    width: 42px; height: 42px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .lab-mark.travel{ background: var(--travel-soft); color: var(--travel); }
  .lab-text{ flex: 1; min-width: 0; }
  .lab-index{ display: block; font-size: 10.5px; letter-spacing: 0.1em; color: var(--ink-faint); margin-bottom: 1px; }
  .lab-name{ display: block; font-size: 15.5px; font-weight: 600; }
  .lab-desc{ display: block; font-size: 12.5px; color: var(--ink-soft); margin-top: 2px; }
  .lab-go{ color: var(--ink-faint); }
  .lab-row.vacant{ cursor: default; opacity: 0.75; }
  .lab-row.vacant .lab-mark{ background: transparent; border: 1px dashed var(--line-strong); color: var(--ink-faint); }

  .build-stamp{ margin: 26px 0 0; font-size: 10.5px; color: var(--ink-faint); text-align: center; }

  /* ---------- trip hero ---------- */
  .hero{ padding: 20px 18px 16px; }
  .hero-top{ display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap; }
  .hero-city{ font-size: 27px; font-weight: 700; letter-spacing: -0.03em; margin: 0; }
  .hero-country{ font-size: 12px; color: var(--ink-faint); letter-spacing: 0.1em; }
  .hero-dates{ font-size: 13px; color: var(--ink-soft); margin: 4px 0 0; }

  .countdown{
    display: flex; align-items: center; gap: 10px;
    margin-top: 14px; padding: 12px 14px;
    border-radius: 12px;
    background: var(--signal-soft);
    color: var(--signal);
  }
  .countdown.live{ background: var(--travel-soft); color: var(--travel); }
  .countdown-big{ font-size: 19px; font-weight: 700; letter-spacing: -0.01em; }
  .countdown-sub{ font-size: 12px; opacity: 0.88; }

  /* ---------- tabs ---------- */
  .tabs{
    position: sticky;
    top: calc(var(--bar-h) + var(--safe-t));
    z-index: 15;
    display: flex;
    gap: 2px;
    padding: 0 12px;
    background: var(--paper);
    border-bottom: 1px solid var(--line);
  }
  .tab{
    flex: 1;
    padding: 13px 2px 11px;
    border: none;
    background: transparent;
    color: var(--ink-faint);
    font: inherit; font-size: 13.5px; font-weight: 600;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
  }
  .tab[aria-selected="true"]{ color: var(--ink); border-bottom-color: var(--signal); }
  .tab:focus-visible{ outline: 2px solid var(--signal); outline-offset: -3px; }

  /* ---------- day switch ---------- */
  .dayrow{ display: flex; gap: 8px; padding: 16px 18px 4px; }
  .daybtn{
    flex: 1;
    padding: 9px 4px;
    border: 1px solid var(--line-strong);
    border-radius: 10px;
    background: transparent;
    color: var(--ink-soft);
    font: inherit; font-size: 12.5px; font-weight: 600;
    cursor: pointer; line-height: 1.3;
  }
  .daybtn b{ display: block; font-size: 14px; font-weight: 700; }
  .daybtn[aria-pressed="true"]{ background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .daybtn.today:not([aria-pressed="true"]){ border-color: var(--signal); color: var(--signal); }
  .daybtn:focus-visible{ outline: 2px solid var(--signal); outline-offset: 2px; }

  .day-head{ padding: 14px 18px 6px; }
  .day-theme{ font-size: 15px; font-weight: 600; margin: 0; }
  .day-stat{ font-size: 12px; color: var(--ink-faint); margin: 3px 0 0; }

  /* ---------- now banner ---------- */
  .now{ margin: 12px 18px 0; border: 1px solid var(--travel); border-radius: 12px; overflow: hidden; }
  .now-part{ display: flex; gap: 10px; padding: 11px 13px; align-items: flex-start; }
  .now-part + .now-part{ border-top: 1px solid var(--line); }
  .now-tag{
    font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em;
    padding: 2px 7px; border-radius: 5px; flex-shrink: 0; margin-top: 2px;
  }
  .now-tag.on{ background: var(--travel); color: var(--paper); }
  .now-tag.next{ background: var(--surface-sunk); color: var(--ink-soft); }
  .now-title{ font-size: 14px; font-weight: 600; margin: 0; }
  .now-time{ font-size: 11.5px; color: var(--ink-faint); margin: 1px 0 0; }

  /* ---------- timeline ---------- */
  .tl{ padding: 8px 18px 0; }
  .tl-item{ display: flex; gap: 11px; align-items: stretch; }
  .tl-time{
    width: 46px; flex-shrink: 0; padding-top: 13px;
    font-size: 12.5px; font-weight: 600; line-height: 1.25; text-align: right;
  }
  .tl-time small{ display: block; font-size: 10.5px; font-weight: 400; color: var(--ink-faint); }

  .tl-rail{ width: 13px; flex-shrink: 0; position: relative; display: flex; justify-content: center; }
  .tl-rail::before{ content: ""; position: absolute; top: 0; bottom: 0; width: 1px; background: var(--line); }
  .tl-item:first-child .tl-rail::before{ top: 17px; }
  .tl-item.last .tl-rail::before{ bottom: calc(100% - 17px); }
  .tl-dot{
    position: relative; margin-top: 13px;
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--paper); border: 2px solid var(--c-todo);
  }
  .tl-dot.big{ width: 11px; height: 11px; margin-top: 12px; }

  .tl-body{ flex: 1; min-width: 0; padding: 11px 0 13px; border-bottom: 1px solid var(--line); }
  .tl-item.last .tl-body{ border-bottom: none; }
  .tl-head{ display: flex; align-items: flex-start; gap: 8px; }
  .tl-title{ flex: 1; min-width: 0; font-size: 14.5px; font-weight: 600; margin: 0; word-break: keep-all; }
  .tl-title .emo{ margin-right: 4px; }
  .tl-line{ font-size: 12.5px; color: var(--ink-soft); margin: 3px 0 0; word-break: keep-all; }
  .tl-line::before{ content: "— "; color: var(--ink-faint); }
  .tl-meta{ display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 7px; }

  .tl-item.done .tl-title,
  .tl-item.done .tl-line{ text-decoration: line-through; color: var(--ink-faint); }
  .tl-item.done .tl-dot{ background: var(--c-todo); }

  .tl-item.current .tl-body{
    background: var(--travel-soft);
    margin-left: -8px; padding-left: 8px; padding-right: 8px;
    border-radius: 8px; border-bottom-color: transparent;
  }

  .check{
    width: 30px; height: 30px; flex-shrink: 0;
    border: 1px solid var(--line-strong);
    border-radius: 8px;
    background: transparent;
    color: transparent;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .check .icon{ width: 17px; height: 17px; }
  .check[aria-pressed="true"]{ background: var(--signal); border-color: var(--signal); color: var(--paper); }
  .check:focus-visible{ outline: 2px solid var(--signal); outline-offset: 2px; }

  /* a place name is the map link — no separate "지도" chip to hunt for */
  .placelink{
    color: inherit; text-decoration: none;
    border-bottom: 1px dashed var(--line-strong);
    padding-bottom: 1px;
  }
  .placelink .pinch{
    width: 12px; height: 12px; display: inline-block;
    vertical-align: -1px; margin-left: 3px; color: var(--ink-faint);
  }
  .placelink:hover{ border-bottom-color: var(--signal); }

  /* ---------- badges ---------- */
  .badge{
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 11px; font-weight: 600;
    padding: 3px 8px; border-radius: 6px;
    background: var(--surface-sunk); color: var(--ink-soft);
  }
  .badge.cat{ background: transparent; border: 1px solid currentColor; }
  .badge.fixed{ background: var(--danger); color: var(--paper); }
  .badge.reserved{ background: var(--signal); color: var(--paper); }
  .badge.maybe{ background: transparent; border: 1px dashed var(--line-strong); color: var(--ink-faint); }
  .badge.mine{ background: transparent; border: 1px solid var(--travel); color: var(--travel); }

  .maplink{
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 11px; font-weight: 600;
    padding: 3px 8px; border-radius: 6px;
    background: var(--surface-sunk); color: var(--ink-soft);
    text-decoration: none;
  }
  .maplink .icon{ width: 13px; height: 13px; }

  .editbtn{
    display: inline-flex; align-items: center; gap: 4px;
    margin-left: auto;
    border: none; background: transparent;
    color: var(--ink-faint);
    font: inherit; font-size: 11px; font-weight: 600;
    padding: 3px 4px; cursor: pointer; border-radius: 6px;
  }
  .editbtn .icon{ width: 13px; height: 13px; }
  .editbtn:hover, .editbtn.tapped{ color: var(--signal); }
  .editbtn:focus-visible{ outline: 2px solid var(--signal); outline-offset: 1px; }

  /* ---------- add rows ---------- */
  .tl-add{ display: flex; gap: 11px; align-items: stretch; }
  .tl-add .tl-time{ color: transparent; }
  .tl-add .tl-rail::before{ bottom: calc(100% - 17px); }
  .tl-add .tl-dot{ border-style: dashed; border-color: var(--line-strong); }
  .addrow{
    flex: 1;
    display: flex; align-items: center; gap: 7px;
    border: none; background: transparent;
    color: var(--ink-faint);
    font: inherit; font-size: 13px; font-weight: 600;
    padding: 11px 0; cursor: pointer; text-align: left;
  }
  .addrow .icon{ width: 16px; height: 16px; }
  .addrow:hover, .addrow.tapped{ color: var(--signal); }
  .addrow:focus-visible{ outline: 2px solid var(--signal); outline-offset: 2px; }

  .addcard{
    display: flex; align-items: center; justify-content: center; gap: 7px;
    width: calc(100% - 36px);
    margin: 4px 18px 0;
    border: 1px dashed var(--line-strong);
    border-radius: 12px;
    background: transparent;
    color: var(--ink-faint);
    font: inherit; font-size: 13.5px; font-weight: 600;
    padding: 14px; cursor: pointer;
  }
  .addcard .icon{ width: 16px; height: 16px; }
  .addcard:hover, .addcard.tapped{ color: var(--signal); border-color: var(--signal); }

  /* ---------- chips ---------- */
  .chiprow{ display: flex; gap: 7px; padding: 16px 18px 2px; overflow-x: auto; }
  .chiprow::-webkit-scrollbar{ display: none; }
  .chip{
    flex-shrink: 0;
    border: 1px solid var(--line-strong);
    background: transparent; color: var(--ink-soft);
    border-radius: 999px; padding: 7px 14px;
    font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .chip[aria-pressed="true"]{ background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .chip:focus-visible{ outline: 2px solid var(--signal); outline-offset: 2px; }

  /* ---------- cards ---------- */
  .card{
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 13px;
    padding: 14px;
    margin: 0 18px 10px;
  }
  .card.dashed{ background: transparent; border-style: dashed; }
  .card-top{ display: flex; align-items: flex-start; gap: 10px; }
  .card-name{ flex: 1; min-width: 0; font-size: 15.5px; font-weight: 700; margin: 0; word-break: keep-all; }
  .card-when{ font-size: 11.5px; color: var(--ink-faint); margin: 0 0 3px; }
  .card-kind{ font-size: 12.5px; color: var(--ink-soft); margin: 4px 0 0; }
  .card-note{ font-size: 12px; color: var(--ink-soft); margin: 8px 0 0; padding-top: 8px; border-top: 1px dashed var(--line); }
  .card-meta{ display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 9px; }

  .group-label{ display: flex; align-items: baseline; gap: 8px; padding: 20px 18px 8px; }
  .group-label h3{
    font-size: 12px; font-weight: 600; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--ink-faint); margin: 0;
  }
  .group-count{ font-size: 11px; color: var(--ink-faint); }

  /* ---------- shopping ---------- */
  .buy-row{ display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px dashed var(--line); }
  .buy-row:first-of-type{ border-top: 1px solid var(--line); margin-top: 10px; }
  .buy-text{ flex: 1; min-width: 0; font-size: 13.5px; word-break: break-word; }
  .buy-row.got .buy-text{ text-decoration: line-through; color: var(--ink-faint); }
  .buy-del{ border: none; background: transparent; color: var(--ink-faint); cursor: pointer; padding: 4px; display: flex; }
  .buy-del .icon{ width: 15px; height: 15px; }

  .addtoggle{
    margin-top: 10px;
    border: none; background: transparent; color: var(--ink-faint);
    font: inherit; font-size: 12.5px; font-weight: 600;
    padding: 4px 0; cursor: pointer;
  }
  .addtoggle:hover, .addtoggle.tapped{ color: var(--signal); }
  .addtoggle:focus-visible{ outline: 2px solid var(--signal); outline-offset: 2px; }

  .additem{ display: flex; gap: 7px; margin-top: 10px; }
  .additem input{
    flex: 1; min-width: 0;
    border: 1px solid var(--line-strong); border-radius: 9px;
    padding: 9px 11px;
    font-family: inherit; font-size: 16px;
    background: var(--paper); color: var(--ink);
  }
  .additem input:focus{ outline: none; border-color: var(--signal); }
  .additem button{
    border: none; border-radius: 9px;
    background: var(--surface-sunk); color: var(--ink);
    font: inherit; font-size: 13px; font-weight: 600;
    padding: 0 14px; cursor: pointer;
  }

  /* ---------- info ---------- */
  .fact{ display: flex; align-items: flex-start; gap: 11px; padding: 11px 0; border-bottom: 1px solid var(--line); }
  .fact:last-child{ border-bottom: none; }
  .fact .icon{ width: 18px; height: 18px; color: var(--ink-faint); margin-top: 2px; }
  .fact-body{ flex: 1; min-width: 0; }
  .fact-label{ font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-faint); margin: 0; }
  .fact-value{ font-size: 14px; font-weight: 500; margin: 2px 0 0; word-break: keep-all; }
  .fact-value small{ display: block; font-weight: 400; font-size: 12px; color: var(--ink-soft); margin-top: 2px; }

  .calc{ display: flex; align-items: center; gap: 9px; margin-top: 12px; }
  .calc input{
    flex: 1; min-width: 0;
    border: 1px solid var(--line-strong); border-radius: 10px;
    padding: 11px 12px;
    font-family: "IBM Plex Mono", monospace; font-size: 16px;
    background: var(--paper); color: var(--ink); text-align: right;
  }
  .calc input:focus{ outline: none; border-color: var(--signal); }
  .calc span{ font-size: 13px; color: var(--ink-faint); flex-shrink: 0; }
  .rate-row{ display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 12px; color: var(--ink-soft); }
  .rate-row input{
    width: 84px;
    border: 1px solid var(--line-strong); border-radius: 8px;
    padding: 6px 9px;
    font-family: "IBM Plex Mono", monospace; font-size: 16px;
    background: var(--paper); color: var(--ink); text-align: right;
  }
  .rate-row input:focus{ outline: none; border-color: var(--signal); }

  .quick{ display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .quick button{
    border: 1px solid var(--line-strong); border-radius: 8px;
    background: transparent; color: var(--ink-soft);

    air:  { label:"항공", color:"var(--c-air)", emo:"✈️" },
    move: { label:"이동", color:"var(--c-move)", emo:"🚶" },
    food: { label:"식사", color:"var(--c-food)", emo:"🍴" },
    shop: { label:"쇼핑", color:"var(--c-shop)", emo:"🛍️" },
    stay: { label:"숙소", color:"var(--c-stay)", emo:"🏨" },
    free: { label:"자유", color:"var(--c-free)", emo:"🍺" },
    todo: { label:"준비", color:"var(--c-todo)", emo:"✅" }
  };
  var CAT_ORDER = ["food","shop","move","free","stay","todo","air"];

  var MEALS = [
    { key:"all", label:"전체" },
    { key:"breakfast", label:"아침" },
    { key:"lunch", label:"점심" },
    { key:"dinner", label:"저녁" },
    { key:"drink", label:"술" },
    { key:"cafe", label:"카페" }
  ];
  var MEAL_LABEL = { breakfast:"아침", lunch:"점심", dinner:"저녁", drink:"술", cafe:"카페" };
  var MEAL_EMO = { breakfast:"🍳", lunch:"🍴", dinner:"🍽️", drink:"🍺", cafe:"☕" };

  function autoEmo(cat, meal){
    if (meal && MEAL_EMO[meal]) return MEAL_EMO[meal];
    return (CAT[cat] || CAT.todo).emo;
  }

  /* ================= time ================= */
  /* Korea and Japan share UTC+9, so the device clock needs no conversion. */
  function mins(hhmm){
    if (!hhmm) return null;
    var p = String(hhmm).split(":");
    return (+p[0]) * 60 + (+p[1]);
  }
  function fmtMD(iso){
    var p = iso.split("-");
    return (+p[1]) + "." + (+p[2]);
  }
  function todayISO(){
    var d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
  }
  function dayDiff(aISO, bISO){
    return Math.round((new Date(aISO + "T00:00:00") - new Date(bISO + "T00:00:00")) / 86400000);
  }
  function nowMins(){
    var d = new Date();
    return d.getHours() * 60 + d.getMinutes();
  }
  function todayIndex(){
    var t = todayISO();
    for (var i = 0; i < TRIP.days.length; i++) if (TRIP.days[i].date === t) return i;
    return -1;
  }

  /* ================= saved state ================= */
  var Saved = {
    backend: "local",
    db: null,
    data: { done:{}, bought:{}, extra:{}, pack:{}, rate:950, edits:{}, added:[], removed:{} },
    _t: null,

    async init(){
      try{
        if (window.claude && typeof window.claude.use === "function"){
          var db = await window.claude.use("db");
          if (db){ this.db = db; this.backend = "db"; }
        }
      }catch(e){ /* stay local */ }

      try{
        var raw;
        if (this.backend === "db"){
          var snap = await this.db.doc("trips/fukuoka2026").get();
          raw = snap.exists ? snap.data() : null;
        } else {
          raw = JSON.parse(localStorage.getItem("lab.fukuoka2026") || "null");
        }
        if (raw) this.data = Object.assign(this.data, raw);
      }catch(e){ /* first run, or storage unavailable */ }

      if (!this.data.edits) this.data.edits = {};
      if (!this.data.added) this.data.added = [];
      if (!this.data.removed) this.data.removed = {};
    },

    /* Writes are batched: a burst of checkbox taps becomes one save. */
    flush(){
      var self = this;
      clearTimeout(this._t);
      this._t = setTimeout(function(){
        try{
          if (self.backend === "db") self.db.doc("trips/fukuoka2026").set(self.data);
          else localStorage.setItem("lab.fukuoka2026", JSON.stringify(self.data));
        }catch(e){ /* nothing to do from here; state stays in memory */ }
      }, 400);
    },

    isDone(id){ return !!this.data.done[id]; },
    toggleDone(id){
      if (this.data.done[id]) delete this.data.done[id];
      else this.data.done[id] = 1;
      this.flush();
    },
    isBought(k){ return !!this.data.bought[k]; },
    toggleBought(k){
      if (this.data.bought[k]) delete this.data.bought[k];
      else this.data.bought[k] = 1;
      this.flush();
    },
    extraOf(shopId){ return this.data.extra[shopId] || []; },
    addExtra(shopId, text){
      var list = this.data.extra[shopId] || [];
      list.push(text);
      this.data.extra[shopId] = list;
      this.flush();
    },
    removeExtra(shopId, text){
      this.data.extra[shopId] = (this.data.extra[shopId] || []).filter(function(x){ return x !== text; });
      delete this.data.bought[shopId + "::" + text];
      this.flush();
    },
    isPacked(k){ return !!this.data.pack[k]; },
    togglePacked(k){
      if (this.data.pack[k]) delete this.data.pack[k];
      else this.data.pack[k] = 1;
      this.flush();
    },
    setRate(v){ this.data.rate = v; this.flush(); },

    /* Itinerary edits are an overlay on the seed, never a copy of it, so a
       later fix to the seed still reaches items the user never touched. */
    saveItem(draft){
      if (draft.id && SEED_IDS[draft.id]){
        this.data.edits[draft.id] = draft.patch;
      } else if (draft.id){
        this.data.added = this.data.added.map(function(it){
          return it.id === draft.id ? Object.assign({}, it, draft.patch) : it;
        });
      } else {
        var item = Object.assign({ id: uid("u") }, draft.patch);
        this.data.added.push(item);
      }
      this.flush();
    },
    removeItem(id){
      this.data.removed[id] = 1;
      delete this.data.done[id];
      this.flush();
    }
  };

  /* ================= merged itinerary ================= */
  function merged(seedItem){
    var patch = Saved.data.edits[seedItem.id];
    return patch ? Object.assign({}, seedItem, patch) : seedItem;
  }
  function dayOf(item, seedDate){
    return item.dayDate || seedDate;
  }
  function byStart(a, b){ return (mins(a.s) || 0) - (mins(b.s) || 0); }

  function itemsForDay(dayIndex){
    var date = TRIP.days[dayIndex].date;
    var out = [];
    TRIP.days.forEach(function(d){
      d.items.forEach(function(seed){
        if (Saved.data.removed[seed.id]) return;
        var it = merged(seed);
        if (dayOf(it, d.date) === date) out.push(it);
      });
    });
    Saved.data.added.forEach(function(it){
      if (Saved.data.removed[it.id]) return;
      if (it.dayDate === date) out.push(it);
    });
    out.sort(byStart);
    return out;
  }

  function allItems(){
    var out = [];
    TRIP.days.forEach(function(d, i){
      itemsForDay(i).forEach(function(it){ out.push({ item: it, dayIndex: i, day: TRIP.days[i] }); });
    });
    return out;
  }
  function isMine(it){ return !SEED_IDS[it.id]; }

  /* An item's span; items with no end run until the next one starts. */
  function currentPair(){
    var di = todayIndex();
    if (di < 0) return null;
    var list = itemsForDay(di);
    var n = nowMins();
    var cur = null, next = null;
    for (var i = 0; i < list.length; i++){
      var s = mins(list[i].s);
      var e = list[i].e ? mins(list[i].e) : null;
      if (e === null){
        for (var j = i + 1; j < list.length; j++){
          var ns = mins(list[j].s);
          if (ns > s){ e = ns; break; }
        }
        if (e === null) e = s + 90;
      }
      if (!cur && n >= s && n < e) cur = list[i];
      if (!next && s > n) next = list[i];
    }
    return { dayIndex: di, current: cur, next: next };
  }

  /* ================= routing ================= */
  var state = { view:"home", tab:"sched", day:0, meal:"all" };
  var topbar = document.getElementById("topbar");
  var view = document.getElementById("view");
  var overlay = document.getElementById("overlay");

  function go(next){ Object.assign(state, next); render(); }

  function themeButton(){
    var dark = Theme.isDark();
    var b = el('<button class="icon-btn" aria-label="' + (dark ? "밝은 화면으로" : "어두운 화면으로") + '">' +
      icon(dark ? "sun" : "moon") + '</button>');
    tap(b, function(){
      var next = Theme.toggle();
      render();
      toast(next === "dark" ? "어두운 화면" : "밝은 화면");
    });
    return b;
  }

  function setBar(parts){
    topbar.innerHTML = "";
    if (parts.back){
      topbar.appendChild(tap(el('<button class="icon-btn" aria-label="뒤로">' + icon("back") + '</button>'), parts.back));
    }
    topbar.appendChild(el('<span class="bar-title' + (parts.back ? "" : " bar-pad") + '">' + esc(parts.title) + '</span>'));
    topbar.appendChild(themeButton());
  }

  /* ================= home ================= */
  function renderHome(){
    setBar({ title: "나의 실험실" });

    var d = dayDiff(TRIP.start, todayISO());
    var di = todayIndex();

    var wrap = el(
      '<div class="pad">' +
        '<p class="eyebrow mono">Lab index</p>' +

        '<p class="page-sub">하나씩 만들어보는 개인 실험들. 들어가서 써보고, 마음에 안 들면 갈아엎습니다.</p>' +
        '<div class="lab-list">' +
          '<button class="lab-row" type="button" id="lab-travel">' +
            '<span class="lab-mark travel">' + icon("compass") + '</span>' +
            '<span class="lab-text">' +
              '<span class="lab-index mono">EXP 01</span>' +
              '<span class="lab-name">여행 계획</span>' +
              '<span class="lab-desc">후쿠오카 2박 3일 · ' + fmtMD(TRIP.start) + '–' + fmtMD(TRIP.end) + ' · ' + esc(status) + '</span>' +
            '</span>' +
            icon("go", "lab-go") +
          '</button>' +
          '<div class="lab-row vacant">' +
            '<span class="lab-mark">' + icon("plus") + '</span>' +
            '<span class="lab-text">' +
              '<span class="lab-index mono">EXP 02</span>' +
              '<span class="lab-name">비어 있음</span>' +
              '<span class="lab-desc">다음 실험이 들어갈 자리</span>' +
            '</span>' +
          '</div>' +
        '</div>' +
        '<p class="build-stamp mono">build ' + BUILD + '</p>' +
      '</div>'
    );
    view.innerHTML = "";
    view.appendChild(wrap);
    tap(wrap.querySelector("#lab-travel"), function(){
      var di2 = todayIndex();
      go({ view:"trip", day: di2 >= 0 ? di2 : 0 });
    });
    window.scrollTo(0, 0);
  }

  /* ================= trip shell ================= */
  function renderTrip(){
    setBar({ title: "여행 계획", back: function(){ go({ view:"home" }); } });

    var frag = document.createDocumentFragment();
    frag.appendChild(renderHero());

    var tabs = el('<div class="tabs" role="tablist"></div>');
    [["sched","일정"],["food","음식"],["shop","쇼핑"],["info","정보"]].forEach(function(t){
      var b = el('<button class="tab" role="tab" type="button" aria-selected="' +
        (state.tab === t[0]) + '">' + t[1] + '</button>');
      tap(b, function(){ go({ tab: t[0] }); });
      tabs.appendChild(b);
    });
    frag.appendChild(tabs);

    var body = el('<div id="tabbody"></div>');
    frag.appendChild(body);

    view.innerHTML = "";
    view.appendChild(frag);

    if (state.tab === "sched") renderSchedule(body);
    else if (state.tab === "food") renderFood(body);
    else if (state.tab === "shop") renderShop(body);
    else renderInfo(body);

    window.scrollTo(0, 0);
  }

  function renderHero(){
    var pair = currentPair();
    var d = dayDiff(TRIP.start, todayISO());
    var box;

    if (pair){
      var cur = pair.current, nx = pair.next;
      box = el('<div class="now"></div>');
      box.appendChild(el(
        '<div class="now-part">' +
          '<span class="now-tag on">지금</span>' +
          '<div><p class="now-title">' + (cur ? esc(cur.emo + " " + cur.title) : "일정 사이 — 여유 시간") + '</p>' +
          '<p class="now-time mono">' + (cur ? esc(cur.s + (cur.e ? "–" + cur.e : "~")) : "") + '</p></div>' +
        '</div>'
      ));
      if (nx){
        box.appendChild(el(
          '<div class="now-part">' +
            '<span class="now-tag next">다음</span>' +
            '<div><p class="now-title">' + esc(nx.emo + " " + nx.title) + '</p>' +
            '<p class="now-time mono">' + esc(nx.s) + ' 시작</p></div>' +
          '</div>'
        ));
      }
    } else {

      var sub = d > 0 ? "9월 12일 11:10 한국 출발" : (d === 0 ? "11:10 한국 출발" : "다녀온 여행");
      box = el(
        '<div class="countdown' + (d === 0 ? " live" : "") + '">' +

      '</div>'
    );

  /* ================= tab: schedule ================= */
  function renderSchedule(root){
    var pair = currentPair();

    var dayrow = el('<div class="dayrow"></div>');
    TRIP.days.forEach(function(day, i){
      var isToday = pair && pair.dayIndex === i;
      var b = el(
        '<button class="daybtn' + (isToday ? " today" : "") + '" type="button" aria-pressed="' +
          (state.day === i) + '"><b>' + fmtMD(day.date) + '</b>' + day.dow + (isToday ? " · 오늘" : "") + '</button>'
      );
      tap(b, function(){ go({ day: i }); });
      dayrow.appendChild(b);
    });
    root.appendChild(dayrow);

    var day = TRIP.days[state.day];
    var list = itemsForDay(state.day);
    var doneCount = list.filter(function(it){ return Saved.isDone(it.id); }).length;

    root.appendChild(el(
      '<div class="day-head">' +
        '<p class="day-theme">' + esc(day.theme) + '</p>' +
        '<p class="day-stat mono">' + list.length + '개 일정 · ' + doneCount + '개 완료</p>' +
      '</div>'
    ));

    if (pair && pair.dayIndex === state.day && pair.current){
      root.appendChild(el(
        '<div class="notice">' + icon("clock") +
        '<span>지금 진행 중: ' + esc(pair.current.title) + '</span></div>'
      ));
    }

    var tl = el('<div class="tl"></div>');
    list.forEach(function(it){ tl.appendChild(timelineItem(it, pair)); });

    var add = el(
      '<div class="tl-add">' +
        '<div class="tl-time mono">+</div>' +
        '<div class="tl-rail"><span class="tl-dot"></span></div>' +
        '<button class="addrow" type="button">' + icon("plus") + '일정 추가</button>' +
      '</div>'
    );
    tap(add.querySelector(".addrow"), function(){ openEditor(null, day.date); });
    tl.appendChild(add);

    root.appendChild(tl);
  }

  function timelineItem(it, pair){
    var cat = CAT[it.cat] || CAT.todo;
    var isCurrent = pair && pair.current && pair.current.id === it.id;
    var done = Saved.isDone(it.id);

    var row = el(
      '<div class="tl-item' + (done ? " done" : "") + (isCurrent ? " current" : "") + '">' +
        '<div class="tl-time mono">' + esc(it.s) + (it.e ? '<small>' + esc(it.e) + '</small>' : (it.open ? '<small>~</small>' : '')) + '</div>' +
        '<div class="tl-rail"><span class="tl-dot' + (it.fixed ? " big" : "") + '" style="border-color:' + cat.color + '"></span></div>' +
        '<div class="tl-body">' +
          '<div class="tl-head">' +
            '<p class="tl-title"><span class="emo">' + it.emo + '</span>' + placeHtml(it.title, it.place) + '</p>' +
          '</div>' +
        '</div>' +
      '</div>'
    );

    var body = row.querySelector(".tl-body");
    var head = row.querySelector(".tl-head");

    var check = el('<button class="check" type="button" aria-pressed="' + done + '" aria-label="완료 표시">' + icon("check") + '</button>');
    tap(check, function(){ Saved.toggleDone(it.id); render(); });
    head.appendChild(check);

    (it.lines || []).forEach(function(line){
      body.appendChild(el('<p class="tl-line">' + esc(line) + '</p>'));
    });
    (it.candidates || []).forEach(function(c){
      body.appendChild(el('<p class="tl-line">' + placeHtml(c.name, c.nomap ? null : c.name) +
        (c.kind ? " · " + esc(c.kind) : "") + '</p>'));
    });
    if (it.note) body.appendChild(el('<p class="tl-line">' + esc(it.note) + '</p>'));

    var meta = el('<div class="tl-meta"></div>');
    meta.appendChild(el('<span class="badge cat" style="color:' + cat.color + '">' + cat.label + '</span>'));
    if (it.meal) meta.appendChild(el('<span class="badge">' + esc(MEAL_LABEL[it.meal]) + '</span>'));
    if (it.reserved){
      meta.appendChild(el('<span class="badge reserved">예약 ' + esc(it.reserved.time) + ' · ' + it.reserved.people + '명</span>'));
    }
    if (it.fixed && !it.reserved) meta.appendChild(el('<span class="badge fixed">시간 엄수</span>'));
    if (it.undecided) meta.appendChild(el('<span class="badge maybe">가게 미정</span>'));
    if (isMine(it)) meta.appendChild(el('<span class="badge mine">직접 추가</span>'));
    (it.places || []).forEach(function(p){
      meta.appendChild(el('<a class="maplink" href="' + esc(mapUrl(p)) + '" target="_blank" rel="noopener">' +
        icon("pin") + esc(p.replace(/\s*(후쿠오카|텐진|하카타)$/, "")) + '</a>'));
    });

    var edit = el('<button class="editbtn" type="button">' + icon("edit") + '수정</button>');
    tap(edit, function(){ openEditor(it, null); });
    meta.appendChild(edit);

    body.appendChild(meta);
    return row;
  }

  /* ================= tab: food ================= */
  function renderFood(root){
    var all = allItems().filter(function(f){ return !!f.item.meal; });

    var chips = el('<div class="chiprow"></div>');
    MEALS.forEach(function(m){
      var n = m.key === "all" ? all.length : all.filter(function(f){ return f.item.meal === m.key; }).length;
      if (n === 0 && m.key !== "all") return;
      var b = el('<button class="chip" type="button" aria-pressed="' + (state.meal === m.key) + '">' +
        m.label + ' <span class="mono">' + n + '</span></button>');
      tap(b, function(){ go({ meal: m.key }); });
      chips.appendChild(b);
    });
    root.appendChild(chips);

    var list = state.meal === "all" ? all : all.filter(function(f){ return f.item.meal === state.meal; });

    var lastDay = -1;
    list.forEach(function(f){
      if (f.dayIndex !== lastDay){
        lastDay = f.dayIndex;
        var n = list.filter(function(x){ return x.dayIndex === f.dayIndex; }).length;

          '<div class="group-label"><h3>' + fmtMD(f.day.date) + ' (' + f.day.dow + ')</h3>' +

    tap(add, function(){
      openEditor(null, addDate, { cat:"food", meal: state.meal === "all" ? "lunch" : state.meal });

    if (it.note) card.appendChild(el('<p class="card-note">' + esc(it.note) + '</p>'));

    if (it.open) meta.appendChild(el('<span class="badge maybe">후보 중 선택</span>'));

  /* ================= tab: shopping ================= */
  function renderShop(root){
    var total = 0, got = 0;
    SHOPS.forEach(function(s){
      var items = s.preset.concat(Saved.extraOf(s.id));
      total += items.length;
      items.forEach(function(i){ if (Saved.isBought(s.id + "::" + i)) got++; });
    });

    root.appendChild(el(
      '<div class="day-head" style="padding-top:18px">' +
        '<p class="day-theme">쇼핑 목록</p>' +
        '<p class="day-stat mono">' + SHOPS.length + '곳 · 살 것 ' + got + '/' + total + '</p>' +
      '</div>'
    ));

    var lastDay = -1;
    SHOPS.forEach(function(s){
      if (s.day !== lastDay){
        lastDay = s.day;
        var day = TRIP.days[s.day];
        var n = SHOPS.filter(function(x){ return x.day === s.day; }).length;
        root.appendChild(el(
          '<div class="group-label"><h3>' + fmtMD(day.date) + ' (' + day.dow + ')</h3>' +
          '<span class="group-count mono">' + n + '곳</span></div>'
        ));
      }
      root.appendChild(shopCard(s));
    });
  }

  function shopCard(s){
    var card = el('<div class="card"></div>');
    card.appendChild(el('<p class="card-when mono">' + esc(s.time) + ' · ' + esc(s.area) + '</p>'));
    card.appendChild(el('<div class="card-top"><p class="card-name">' + placeHtml(s.name, s.map) + '</p></div>'));

    var items = s.preset.concat(Saved.extraOf(s.id));
    items.forEach(function(name){
      var key = s.id + "::" + name;
      var bought = Saved.isBought(key);
      var row = el('<div class="buy-row' + (bought ? " got" : "") + '"></div>');

      var cb = el('<button class="check" type="button" aria-pressed="' + bought + '" aria-label="샀음 표시">' + icon("check") + '</button>');
      tap(cb, function(){ Saved.toggleBought(key); render(); });
      row.appendChild(cb);
      row.appendChild(el('<span class="buy-text">' + esc(name) + '</span>'));

      if (s.preset.indexOf(name) === -1){
        var del = el('<button class="buy-del" type="button" aria-label="삭제">' + icon("x") + '</button>');
        tap(del, function(){ Saved.removeExtra(s.id, name); render(); });
        row.appendChild(del);
      }
      card.appendChild(row);
    });

    /* The input stays folded away: most stores have nothing listed yet, and
       nine open input boxes turn the page into a wall of identical fields. */
    var addBtn = el('<button class="addtoggle" type="button">+ 살 것 적어두기</button>');
    var add = el(
      '<div class="additem" hidden>' +
        '<input type="text" placeholder="예: 티셔츠" aria-label="살 것 추가">' +
        '<button type="button">추가</button>' +
      '</div>'
    );
    var input = add.querySelector("input");
    function submit(){
      var v = input.value.trim();
      if (!v) return;
      Saved.addExtra(s.id, v);
      input.value = "";
      render();
    }
    tap(addBtn, function(){ addBtn.hidden = true; add.hidden = false; input.focus(); });
    tap(add.querySelector("button"), submit);
    input.addEventListener("keydown", function(e){ if (e.key === "Enter") submit(); });
    card.appendChild(addBtn);
    card.appendChild(add);

    return card;
  }

  /* ================= tab: info ================= */
  function renderInfo(root){
    var flights = el('<div class="card"><p class="card-when mono">항공</p></div>');
    flights.appendChild(fact("plane", "가는 편 · 9.12 (토)", "11:10 한국 출발<small>12:40 후쿠오카 도착</small>"));
    flights.appendChild(fact("plane", "오는 편 · 9.14 (월)", "13:40 한국행 출발<small>11:40 공항 도착 — 출발 2시간 전</small>"));
    root.appendChild(flights);

    var stay = el('<div class="card"><p class="card-when mono">숙소 · 짐</p></div>');
    stay.appendChild(fact("bed", "나카스 호텔", "9.12 17:30 체크인<small>9.14 10:55 전 체크아웃 · 캐리어 픽업</small>"));
    stay.appendChild(fact("box", "CARGO PASS", "9.12 13:25–13:40 공항에서 접수<small>캐리어가 숙소로 바로 배송 — 체크인 때 수령 확인</small>"));
    root.appendChild(stay);

    var book = el('<div class="card"><p class="card-when mono">예약 확정</p></div>');
    book.appendChild(fact("clock", "야키니쿠 카쿠라 니시나카스점", "9.13 (일) 17:15 · 2명<small>이 시간만은 고정 — 16:30 니시나카스 방향 이동</small>"));
    root.appendChild(book);

    root.appendChild(currencyCard());
    root.appendChild(packingCard());

    var tips = el('<div class="card"><p class="card-when mono">메모</p></div>');
    [
      "한국과 일본은 시차가 없습니다. 시계 그대로 쓰면 됩니다.",
      "면세를 받으려면 여권이 필요합니다. 돈키호테·백화점 쇼핑 때 챙기세요.",
      "작은 이자카야는 현금만 받는 곳이 있습니다. 엔화 현금을 조금은 준비하세요.",
      "9월 후쿠오카는 비가 올 수 있습니다. 접이식 우산 하나가 편합니다.",
      "9.12 밤 술집은 건너뛰고 9.13으로 넘겨도 되는 일정입니다."
    ].forEach(function(t){ tips.appendChild(el('<p class="tip">' + esc(t) + '</p>')); });
    root.appendChild(tips);
  }

  function fact(ic, label, valueHtml){
    return el(
      '<div class="fact">' + icon(ic) +
        '<div class="fact-body"><p class="fact-label">' + esc(label) + '</p>' +
        '<p class="fact-value">' + valueHtml + '</p></div>' +
      '</div>'
    );
  }

  function currencyCard(){
    var card = el('<div class="card"><p class="card-when mono">환율 계산기</p></div>');
    card.appendChild(el('<p class="card-name" style="font-size:14px">엔 → 원</p>'));

    var calc = el(
      '<div class="calc">' +
        '<input type="text" inputmode="decimal" id="yen" value="1000" aria-label="엔 금액">' +
        '<span class="mono">엔 =</span>' +
      '</div>'
    );
    var out = el('<p class="fact-value mono" id="krw" style="margin-top:10px;font-size:19px;font-weight:700"></p>');
    card.appendChild(calc);
    card.appendChild(out);

    var quick = el('<div class="quick"></div>');
    [500, 1000, 3000, 5000, 10000].forEach(function(v){
      var b = el('<button type="button">' + v.toLocaleString() + '엔</button>');
      tap(b, function(){ calc.querySelector("#yen").value = String(v); update(); });
      quick.appendChild(b);
    });
    card.appendChild(quick);

    var rateRow = el(
      '<div class="rate-row"><span>기준 · 100엔 =</span>' +
      '<input type="text" inputmode="decimal" id="rate" value="' + Saved.data.rate + '" aria-label="100엔당 원화">' +
      '<span>원</span></div>'
    );
    card.appendChild(rateRow);
    card.appendChild(el('<p class="tip" style="margin-top:8px">기본값은 어림값입니다. 실제 환율을 확인해서 고쳐 쓰세요.</p>'));

    function update(){
      var yen = parseFloat(String(calc.querySelector("#yen").value).replace(/[^0-9.]/g, "")) || 0;
      var rate = parseFloat(String(rateRow.querySelector("#rate").value).replace(/[^0-9.]/g, "")) || 0;
      out.textContent = Math.round(yen * rate / 100).toLocaleString() + " 원";
    }
    calc.querySelector("#yen").addEventListener("input", update);
    rateRow.querySelector("#rate").addEventListener("input", function(){
      var v = parseFloat(String(rateRow.querySelector("#rate").value).replace(/[^0-9.]/g, ""));
      if (v) Saved.setRate(v);
      update();
    });
    update();
    return card;
  }

  function packingCard(){
    var done = PACKING.filter(function(p){ return Saved.isPacked(p); }).length;
    var card = el('<div class="card"><p class="card-when mono">준비물 · ' + done + '/' + PACKING.length + '</p></div>');
    PACKING.forEach(function(p){
      var on = Saved.isPacked(p);
      var row = el('<div class="pack-row' + (on ? " on" : "") + '"></div>');
      var cb = el('<button class="check" type="button" aria-pressed="' + on + '" aria-label="챙김 표시">' + icon("check") + '</button>');
      tap(cb, function(){ Saved.togglePacked(p); render(); });
      row.appendChild(cb);
      row.appendChild(el('<span class="pack-text">' + esc(p) + '</span>'));
      card.appendChild(row);
    });
    return card;
  }

  /* ================= editor sheet ================= */
  function closeOverlay(){ overlay.innerHTML = ""; }

  function confirmDialog(opts){
    return new Promise(function(resolve){
      var d = el(
        '<div class="scrim" style="align-items:center"><div class="dialog" role="alertdialog">' +
          '<h3>' + esc(opts.title) + '</h3><p>' + esc(opts.body) + '</p>' +
          '<div class="dialog-actions">' +
            '<button class="btn-text" data-a="no">취소</button>' +
            '<button class="btn-text danger" data-a="yes">' + esc(opts.ok || "확인") + '</button>' +
          '</div>' +
        '</div></div>'
      );
      d.addEventListener("click", function(e){ if (e.target === d){ closeOverlay(); resolve(false); } });
      d.querySelector('[data-a="no"]').addEventListener("click", function(){ closeOverlay(); resolve(false); });
      d.querySelector('[data-a="yes"]').addEventListener("click", function(){ closeOverlay(); resolve(true); });
      overlay.appendChild(d);
    });
  }

  /* One sheet for both adding and editing — an item added from 음식 is the
     same kind of thing as one added from 일정, so it gets the same form. */
  function openEditor(item, defaultDate, presets){
    var editing = !!item;
    var seed = item && SEED_IDS[item.id];
    var cur = {
      dayDate: item ? (item.dayDate || dayDateOfSeed(item.id) || defaultDate) : defaultDate,
      s: item ? item.s : "",
      e: item ? (item.e || "") : "",
      cat: item ? item.cat : ((presets && presets.cat) || "food"),
      meal: item ? (item.meal || "") : ((presets && presets.meal) || ""),
      title: item ? item.title : "",
      place: item ? (item.place || "") : "",
      lines: item ? (item.lines || []).join("\n") : ""
    };

    var sheet = el(
      '<div class="scrim"><div class="sheet" role="dialog" aria-modal="true">' +
        '<div class="sheet-head">' +
          '<p class="sheet-title">' + (editing ? "일정 수정" : "일정 추가") + '</p>' +
          '<button class="icon-btn" id="sheet-x" aria-label="닫기">' + icon("x") + '</button>' +
        '</div>' +
        '<div class="sheet-body">' +
          '<div class="fld"><label for="ed-title">이름</label>' +
            '<input id="ed-title" type="text" placeholder="예: 나카스 야타이" value="' + esc(cur.title) + '"></div>' +
          '<div class="fld"><label>날짜</label><div class="pickrow" id="ed-day"></div></div>' +
          '<div class="fld-row">' +
            '<div class="fld"><label for="ed-s">시작</label><input id="ed-s" type="time" value="' + esc(cur.s) + '"></div>' +
            '<div class="fld"><label for="ed-e">종료</label><input id="ed-e" type="time" value="' + esc(cur.e) + '"></div>' +
          '</div>' +
          '<div class="fld"><label>분류</label><div class="pickrow" id="ed-cat"></div></div>' +
          '<div class="fld"><label>음식 종류</label><div class="pickrow" id="ed-meal"></div>' +
            '<p class="fld-hint">선택하면 음식 탭에도 함께 표시됩니다.</p></div>' +
          '<div class="fld"><label for="ed-place">장소</label>' +
            '<input id="ed-place" type="text" placeholder="예: 나카스 야타이" value="' + esc(cur.place) + '">' +
            '<p class="fld-hint">적어두면 이름을 눌러 구글맵으로 갈 수 있습니다.</p></div>' +
          '<div class="fld"><label for="ed-lines">메모</label>' +
            '<textarea id="ed-lines" placeholder="한 줄에 하나씩">' + esc(cur.lines) + '</textarea></div>' +
        '</div>' +
        '<div class="sheet-foot"></div>' +
      '</div></div>'
    );

    var body = sheet.querySelector(".sheet-body");
    var foot = sheet.querySelector(".sheet-foot");

    function pickGroup(host, options, getVal, setVal){
      host.innerHTML = "";
      options.forEach(function(o){
        var b = el('<button class="pick" type="button" aria-pressed="' + (getVal() === o.key) + '">' + esc(o.label) + '</button>');
        tap(b, function(){
          setVal(o.key);
          host.querySelectorAll(".pick").forEach(function(x, i){
            x.setAttribute("aria-pressed", String(options[i].key === getVal()));
          });
        });
        host.appendChild(b);
      });
    }

    pickGroup(sheet.querySelector("#ed-day"),
      TRIP.days.map(function(d){ return { key: d.date, label: fmtMD(d.date) + " (" + d.dow + ")" }; }),
      function(){ return cur.dayDate; }, function(v){ cur.dayDate = v; });

    pickGroup(sheet.querySelector("#ed-cat"),
      CAT_ORDER.map(function(k){ return { key: k, label: CAT[k].label }; }),
      function(){ return cur.cat; }, function(v){ cur.cat = v; });

    pickGroup(sheet.querySelector("#ed-meal"),
      [{ key:"", label:"없음" }].concat(Object.keys(MEAL_LABEL).map(function(k){
        return { key: k, label: MEAL_LABEL[k] };
      })),
      function(){ return cur.meal; }, function(v){ cur.meal = v; });

    var saveBtn = el('<button class="btn btn-primary" type="button">저장</button>');
    if (editing){
      var delBtn = el('<button class="btn btn-danger" type="button">삭제</button>');
      tap(delBtn, async function(){
        var ok = await confirmDialog({
          title: "이 일정을 지울까요?",
          body: seed ? "기본 일정에서 빠집니다." : "직접 추가한 일정이 사라집니다.",
          ok: "삭제"
        });
        if (!ok) return;
        Saved.removeItem(item.id);
        closeOverlay();
        toast("삭제했어요.");
        render();
      });
      foot.appendChild(delBtn);
    }
    foot.appendChild(saveBtn);

    var titleEl = sheet.querySelector("#ed-title");
    var sEl = sheet.querySelector("#ed-s");

    tap(saveBtn, function(){
      var title = titleEl.value.trim();
      if (!title){ titleEl.focus(); toast("이름을 적어주세요."); return; }
      if (!sEl.value){ sEl.focus(); toast("시작 시간을 골라주세요."); return; }

      var lines = sheet.querySelector("#ed-lines").value
        .split("\n").map(function(x){ return x.trim(); }).filter(Boolean);

      var patch = {
        dayDate: cur.dayDate,
        s: sEl.value,
        e: sheet.querySelector("#ed-e").value || null,
        cat: cur.cat,
        meal: cur.meal || null,
        title: title,
        place: sheet.querySelector("#ed-place").value.trim() || null,
        lines: lines
      };
      /* Keep a seed item's hand-picked emoji unless its kind actually changed. */
      var keepEmo = seed && seed.cat === patch.cat && (seed.meal || "") === (patch.meal || "");
      patch.emo = keepEmo ? seed.emo : autoEmo(patch.cat, patch.meal);

      Saved.saveItem({ id: item ? item.id : null, patch: patch });
      closeOverlay();
      toast(editing ? "수정했어요." : "추가했어요.");

      if (!editing){
        var di = TRIP.days.findIndex(function(d){ return d.date === patch.dayDate; });
        if (di >= 0) state.day = di;
      }
      render();
    });

    tap(sheet.querySelector("#sheet-x"), closeOverlay);
    sheet.addEventListener("click", function(e){ if (e.target === sheet) closeOverlay(); });

    overlay.appendChild(sheet);
    if (!editing) setTimeout(function(){ titleEl.focus(); }, 60);
  }

  function dayDateOfSeed(id){
    var found = null;
    TRIP.days.forEach(function(d){
      d.items.forEach(function(it){ if (it.id === id) found = d.date; });
    });
    return found;
  }

  /* ================= render ================= */
  function render(){
    if (state.view === "home") renderHome();
    else renderTrip();
  }

  (async function boot(){
    Theme.apply();
    await Saved.init();
    var di = todayIndex();
    if (di >= 0) state.day = di;
    render();
  })();
})();
</script>
</body>
</html>
