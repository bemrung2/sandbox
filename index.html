<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F5F7F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1413" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="나의 실험실">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>나의 실험실</title>
<meta name="description" content="실험을 하나씩 만들어 모아두는 개인 실험실. 첫 실험은 후쿠오카 여행 계획표.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --paper: #F5F7F3;
    --surface: #FFFFFF;
    --surface-sunk: #EDF1EB;
    --ink: #131816;
    --ink-soft: #5A6560;
    --ink-faint: #8B958F;
    --line: #DFE5DD;
    --line-strong: #C6D0C6;

    --signal: #0E5C4F;
    --signal-soft: #DCEDE7;
    --travel: #9C6427;
    --travel-soft: #F6E7D5;
    --danger: #A32C22;
    --airline: #DE5F16;
    --airline-soft: #FBE4D5;

    /* itinerary categories — six separated hues, not six tints of the accent */
    --c-air: #3E6FA8;
    --c-move: #667A86;
    --c-food: #B26A22;
    --c-shop: #9B3F6A;
    --c-stay: #0F5C4F;
    --c-free: #6B54B5;
    --c-todo: #6E7671;

    --shadow: rgba(19, 30, 25, 0.10);
    --scrim: rgba(12, 20, 16, 0.45);

    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-t: env(safe-area-inset-top, 0px);
    --bar-h: 58px;
  }

  /* Dark tokens live in one block, applied both by system preference and by
     the in-app toggle, so the two can never drift apart. */
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper: #0F1413;
      --surface: #161D1B;
      --surface-sunk: #1D2523;
      --ink: #E9EEEA;
      --ink-soft: #9DA9A3;
      --ink-faint: #6F7B76;
      --line: #253029;
      --line-strong: #35423A;

      --signal: #63D4B9;
      --signal-soft: #143C34;
      --travel: #E3A96C;
      --travel-soft: #40301C;
      --danger: #FF9E92;
      --airline: #FF9457;
      --airline-soft: #46281A;

      --c-air: #8FB8E8;
      --c-move: #A3B2BC;
      --c-food: #E3A96C;
      --c-shop: #E38BB4;
      --c-stay: #63D4B9;
      --c-free: #AE9BF0;
      --c-todo: #9DA9A3;

      --shadow: rgba(0, 0, 0, 0.5);
      --scrim: rgba(0, 0, 0, 0.6);
    }
  }

  :root[data-theme="dark"]{
    --paper: #0F1413;
    --surface: #161D1B;
    --surface-sunk: #1D2523;
    --ink: #E9EEEA;
    --ink-soft: #9DA9A3;
    --ink-faint: #6F7B76;
    --line: #253029;
    --line-strong: #35423A;

    --signal: #63D4B9;
    --signal-soft: #143C34;
    --travel: #E3A96C;
    --travel-soft: #40301C;
    --danger: #FF9E92;
    --airline: #FF9457;
    --airline-soft: #46281A;

    --c-air: #8FB8E8;
    --c-move: #A3B2BC;
    --c-food: #E3A96C;
    --c-shop: #E38BB4;
    --c-stay: #63D4B9;
    --c-free: #AE9BF0;
    --c-todo: #9DA9A3;

    --shadow: rgba(0, 0, 0, 0.5);
    --scrim: rgba(0, 0, 0, 0.6);
  }

  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  button, label, a, summary{ touch-action: manipulation; }

  html{ height: 100%; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body{
    min-height: 100%;
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "IBM Plex Sans KR", system-ui, -apple-system, sans-serif;
    font-size: 15px;
    line-height: 1.55;
    display: flex;
    justify-content: center;
  }

  .app{ width: 100%; max-width: 440px; display: flex; flex-direction: column; background: var(--paper); }
  .mono{ font-family: "IBM Plex Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  .icon{ width: 22px; height: 22px; display: block; flex-shrink: 0; }

  /* ---------- top bar ---------- */
  #topbar{
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; gap: 4px;
    height: calc(var(--bar-h) + var(--safe-t));
    padding: var(--safe-t) 10px 0;
    background: var(--paper);
    border-bottom: 1px solid var(--line);
  }
  .bar-title{
    flex: 1; min-width: 0;
    font-size: 16px; font-weight: 600; letter-spacing: -0.01em;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .bar-pad{ padding-left: 8px; }

  .icon-btn{
    width: 40px; height: 40px;
    border: none; background: transparent; color: var(--ink);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; flex-shrink: 0;
  }
  .icon-btn:hover, .icon-btn.tapped{ background: var(--surface-sunk); }
  .icon-btn:focus-visible{ outline: 2px solid var(--signal); outline-offset: 2px; }
  .icon-btn .icon{ width: 20px; height: 20px; }

  /* ---------- view ---------- */
  #view{ flex: 1; padding: 0 0 calc(40px + var(--safe-b)); }
  .pad{ padding: 22px 18px 0; }

  .eyebrow{
    font-size: 11px; font-weight: 600; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--ink-faint); margin: 0 0 6px;
  }
  h1.page-title{ font-size: 25px; font-weight: 700; letter-spacing: -0.02em; margin: 0 0 6px; text-wrap: balance; }
  .page-sub{ font-size: 13.5px; color: var(--ink-soft); margin: 0 0 26px; max-width: 34em; }

  /* ---------- lab index ---------- */
  .lab-list{ border-top: 1px solid var(--line); }
  .lab-row{
    display: flex; align-items: center; gap: 14px;
    width: 100%; padding: 18px 4px;
    background: transparent; border: none; border-bottom: 1px solid var(--line);
    color: inherit; text-align: left; font: inherit; cursor: pointer;
  }
  .lab-row.tapped{ background: var(--surface-sunk); }
  .lab-row:focus-visible{ outline: 2px solid var(--signal); outline-offset: -2px; }
  .lab-mark{
    width: 42px; height: 42px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .lab-mark.travel{ background: var(--travel-soft); color: var(--travel); }
  .lab-text{ flex: 1; min-width: 0; }
  .lab-index{ display: block; font-size: 10.5px; letter-spacing: 0.1em; color: var(--ink-faint); margin-bottom: 1px; }
  .lab-name{ display: block; font-size: 15.5px; font-weight: 600; }
  .lab-desc{ display: block; font-size: 12.5px; color: var(--ink-soft); margin-top: 2px; }
  .lab-go{ color: var(--ink-faint); }
  .lab-row.vacant{ cursor: default; opacity: 0.75; }
  .lab-row.vacant .lab-mark{ background: transparent; border: 1px dashed var(--line-strong); color: var(--ink-faint); }
  .build-stamp{ margin: 26px 0 0; font-size: 10.5px; color: var(--ink-faint); text-align: center; }

  /* ---------- trip hero ---------- */
  .hero{ padding: 20px 18px 16px; }
  .hero-top{ display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap; }
  .hero-city{ font-size: 27px; font-weight: 700; letter-spacing: -0.03em; margin: 0; }
  .hero-country{ font-size: 12px; color: var(--ink-faint); letter-spacing: 0.1em; }
  .hero-dates{ font-size: 13px; color: var(--ink-soft); margin: 4px 0 0; }

  .countdown{
    display: flex; align-items: center; gap: 10px;
    margin-top: 14px; padding: 12px 14px; border-radius: 12px;
    background: var(--signal-soft); color: var(--signal);
  }
  .countdown.live{ background: var(--travel-soft); color: var(--travel); }
  .countdown-big{ font-size: 19px; font-weight: 700; letter-spacing: -0.01em; }
  .countdown-sub{ font-size: 12px; opacity: 0.88; }

  /* ---------- tabs ---------- */
  .tabs{
    position: sticky; top: calc(var(--bar-h) + var(--safe-t)); z-index: 15;
    display: flex; gap: 2px; padding: 0 12px;
    background: var(--paper); border-bottom: 1px solid var(--line);
  }
  .tab{
    flex: 1; padding: 13px 2px 11px;
    border: none; background: transparent; color: var(--ink-faint);
    font: inherit; font-size: 13.5px; font-weight: 600; cursor: pointer;
    border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .tab[aria-selected="true"]{ color: var(--ink); border-bottom-color: var(--signal); }
  .tab:focus-visible{ outline: 2px solid var(--signal); outline-offset: -3px; }

  /* ---------- day switch ---------- */
  .dayrow{ display: flex; gap: 8px; padding: 16px 18px 4px; }
  .daybtn{
    flex: 1; padding: 9px 4px;
    border: 1px solid var(--line-strong); border-radius: 10px;
    background: transparent; color: var(--ink-soft);
    font: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer; line-height: 1.3;
  }
  .daybtn b{ display: block; font-size: 14px; font-weight: 700; }
  .daybtn[aria-pressed="true"]{ background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .daybtn.today:not([aria-pressed="true"]){ border-color: var(--signal); color: var(--signal); }
  .daybtn:focus-visible{ outline: 2px solid var(--signal); outline-offset: 2px; }

  .day-head{ padding: 14px 18px 6px; }
  .day-theme{ font-size: 15px; font-weight: 600; margin: 0; }
  .day-stat{ font-size: 12px; color: var(--ink-faint); margin: 3px 0 0; }

  /* ---------- now banner ---------- */
  .now{ margin: 12px 18px 0; border: 1px solid var(--travel); border-radius: 12px; overflow: hidden; }
  .now-part{ display: flex; gap: 10px; padding: 11px 13px; align-items: flex-start; }
  .now-part + .now-part{ border-top: 1px solid var(--line); }
  .now-tag{
    font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em;
    padding: 2px 7px; border-radius: 5px; flex-shrink: 0; margin-top: 2px;
  }
  .now-tag.on{ background: var(--travel); color: var(--paper); }
  .now-tag.next{ background: var(--surface-sunk); color: var(--ink-soft); }
  .now-title{ font-size: 14px; font-weight: 600; margin: 0; }
  .now-time{ font-size: 11.5px; color: var(--ink-faint); margin: 1px 0 0; }

  /* ---------- timeline ---------- */
  .tl{ padding: 8px 18px 0; }
  .tl-item{ display: flex; gap: 11px; align-items: stretch; }
  .tl-time{
    width: 46px; flex-shrink: 0; padding-top: 13px;
    font-size: 12.5px; font-weight: 600; line-height: 1.25; text-align: right;
  }
  .tl-time small{ display: block; font-size: 10.5px; font-weight: 400; color: var(--ink-faint); }

  .tl-rail{ width: 13px; flex-shrink: 0; position: relative; display: flex; justify-content: center; }
  .tl-rail::before{ content: ""; position: absolute; top: 0; bottom: 0; width: 1px; background: var(--line); }
  .tl-item:first-child .tl-rail::before{ top: 17px; }
  .tl-dot{
    position: relative; margin-top: 13px;
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--paper); border: 2px solid var(--c-todo);
  }
  .tl-dot.big{ width: 11px; height: 11px; margin-top: 12px; }

  .tl-body{ flex: 1; min-width: 0; padding: 11px 0 13px; border-bottom: 1px solid var(--line); }
  .tl-title{ font-size: 14.5px; font-weight: 600; margin: 0; word-break: keep-all; }
  .tl-title .emo{ margin-right: 4px; }
  .tl-line{ font-size: 12.5px; color: var(--ink-soft); margin: 3px 0 0; word-break: keep-all; }
  .tl-line::before{ content: "— "; color: var(--ink-faint); }
  .tl-meta{ display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 7px; }
  .tl-actions{ margin-left: auto; display: flex; gap: 2px; flex-shrink: 0; }

  .tl-item.current .tl-body{
    background: var(--travel-soft);
    margin-left: -8px; padding-left: 8px; padding-right: 8px;
    border-radius: 8px; border-bottom-color: transparent;
  }

  /* a place name is the map link — no separate "지도" chip to hunt for */
  .placelink{ color: inherit; text-decoration: none; border-bottom: 1px dashed var(--line-strong); padding-bottom: 1px; }
  .placelink .pinch{
    width: 12px; height: 12px; display: inline-block;
    vertical-align: -1px; margin-left: 3px; color: var(--ink-faint);
  }
  .placelink:hover{ border-bottom-color: var(--signal); }

  /* ---------- attachments ---------- */
  .att{ margin-top: 9px; display: flex; flex-direction: column; gap: 7px; }
  .att-photos{ display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
  .att-photos::-webkit-scrollbar{ display: none; }
  .att-thumb{
    width: 66px; height: 66px; flex-shrink: 0;
    border-radius: 9px; border: 1px solid var(--line);
    background: var(--surface-sunk);
    object-fit: cover; cursor: pointer; padding: 0; display: block;
  }
  .att-note{
    font-size: 12.5px; color: var(--ink-soft);
    border-left: 2px solid var(--line-strong);
    padding: 1px 0 1px 9px; white-space: pre-wrap; word-break: break-word;
  }
  .att-link{
    display: inline-flex; align-items: center; gap: 6px;
    align-self: flex-start; max-width: 100%;
    background: var(--surface-sunk); color: var(--ink);
    border-radius: 8px; padding: 6px 10px;
    font-size: 12.5px; font-weight: 600; text-decoration: none;
  }
  .att-link .icon{ width: 14px; height: 14px; color: var(--ink-faint); }
  .att-link span{ overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .quietbtn{
    display: inline-flex; align-items: center; gap: 4px;
    border: none; background: transparent; color: var(--ink-faint);
    font: inherit; font-size: 11px; font-weight: 600;
    padding: 3px 5px; cursor: pointer; border-radius: 6px;
  }
  .quietbtn .icon{ width: 13px; height: 13px; }
  .quietbtn:hover, .quietbtn.tapped{ color: var(--signal); background: var(--surface-sunk); }
  .quietbtn:focus-visible{ outline: 2px solid var(--signal); outline-offset: 1px; }
  .quietbtn.has{ color: var(--signal); }

  /* ---------- add rows ---------- */
  .tl-add{ display: flex; gap: 11px; align-items: stretch; }
  .tl-add .tl-time{ color: transparent; }
  .tl-add .tl-rail::before{ bottom: calc(100% - 17px); }
  .tl-add .tl-dot{ border-style: dashed; border-color: var(--line-strong); }
  .addrow{
    flex: 1; display: flex; align-items: center; gap: 7px;
    border: none; background: transparent; color: var(--ink-faint);
    font: inherit; font-size: 13px; font-weight: 600;
    padding: 11px 0; cursor: pointer; text-align: left;
  }
  .addrow .icon{ width: 16px; height: 16px; }
  .addrow:hover, .addrow.tapped{ color: var(--signal); }
  .addrow:focus-visible{ outline: 2px solid var(--signal); outline-offset: 2px; }

  .addcard{
    display: flex; align-items: center; justify-content: center; gap: 7px;
    width: calc(100% - 36px); margin: 4px 18px 0;
    border: 1px dashed var(--line-strong); border-radius: 12px;
    background: transparent; color: var(--ink-faint);
    font: inherit; font-size: 13.5px; font-weight: 600;
    padding: 14px; cursor: pointer;
  }
  .addcard .icon{ width: 16px; height: 16px; }
  .addcard:hover, .addcard.tapped{ color: var(--signal); border-color: var(--signal); }

  /* ---------- chips ---------- */
  .chiprow{ display: flex; gap: 7px; padding: 16px 18px 2px; overflow-x: auto; }
  .chiprow::-webkit-scrollbar{ display: none; }
  .chip{
    flex-shrink: 0;
    border: 1px solid var(--line-strong); border-radius: 999px;
    background: transparent; color: var(--ink-soft);
    padding: 7px 14px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .chip[aria-pressed="true"]{ background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .chip:focus-visible{ outline: 2px solid var(--signal); outline-offset: 2px; }

  /* ---------- cards ---------- */
  .card{
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 13px; padding: 14px; margin: 0 18px 10px;
  }
  .card.dashed{ background: transparent; border-style: dashed; }
  .card-top{ display: flex; align-items: flex-start; gap: 10px; }
  .card-name{ flex: 1; min-width: 0; font-size: 15.5px; font-weight: 700; margin: 0; word-break: keep-all; }
  .card-when{ font-size: 11.5px; color: var(--ink-faint); margin: 0 0 3px; }
  .card-head{ display: flex; align-items: center; gap: 8px; margin: 0 0 3px; }
  .card-head .card-when{ margin: 0; flex: 1; }
  .card-kind{ font-size: 12.5px; color: var(--ink-soft); margin: 4px 0 0; }
  .card-note{ font-size: 12px; color: var(--ink-soft); margin: 8px 0 0; padding-top: 8px; border-top: 1px dashed var(--line); }
  .card-meta{ display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 9px; }
  .card-empty{ font-size: 12.5px; color: var(--ink-faint); margin: 6px 0 0; }

  .group-label{ display: flex; align-items: baseline; gap: 8px; padding: 20px 18px 8px; }
  .group-label h3{
    font-size: 12px; font-weight: 600; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--ink-faint); margin: 0;
  }
  .group-count{ font-size: 11px; color: var(--ink-faint); }

  /* ---------- shopping ---------- */
  .check{
    width: 30px; height: 30px; flex-shrink: 0;
    border: 1px solid var(--line-strong); border-radius: 8px;
    background: transparent; color: transparent;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .check .icon{ width: 17px; height: 17px; }
  .check[aria-pressed="true"]{ background: var(--signal); border-color: var(--signal); color: var(--paper); }
  .check:focus-visible{ outline: 2px solid var(--signal); outline-offset: 2px; }

  .buy-row{ display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px dashed var(--line); }
  .buy-row:first-of-type{ border-top: 1px solid var(--line); margin-top: 10px; }
  .buy-text{ flex: 1; min-width: 0; font-size: 13.5px; word-break: break-word; }
  .buy-row.got .buy-text{ text-decoration: line-through; color: var(--ink-faint); }
  .buy-del{ border: none; background: transparent; color: var(--ink-faint); cursor: pointer; padding: 4px; display: flex; }
  .buy-del .icon{ width: 15px; height: 15px; }

  .addtoggle{
    margin-top: 10px;
    border: none; background: transparent; color: var(--ink-faint);
    font: inherit; font-size: 12.5px; font-weight: 600;
    padding: 4px 0; cursor: pointer;
  }
  .addtoggle:hover, .addtoggle.tapped{ color: var(--signal); }
  .addtoggle:focus-visible{ outline: 2px solid var(--signal); outline-offset: 2px; }

  .additem{ display: flex; gap: 7px; margin-top: 10px; }
  .additem input{
    flex: 1; min-width: 0;
    border: 1px solid var(--line-strong); border-radius: 9px;
    padding: 9px 11px; font-family: inherit; font-size: 16px;
    background: var(--paper); color: var(--ink);
  }
  .additem input:focus{ outline: none; border-color: var(--signal); }
  .additem button{
    border: none; border-radius: 9px;
    background: var(--surface-sunk); color: var(--ink);
    font: inherit; font-size: 13px; font-weight: 600; padding: 0 14px; cursor: pointer;
  }

  /* ---------- info ---------- */
  .fact{ display: flex; align-items: flex-start; gap: 11px; padding: 11px 0; border-bottom: 1px solid var(--line); }
  .fact:last-child{ border-bottom: none; }
  .fact .icon{ width: 18px; height: 18px; color: var(--ink-faint); margin-top: 2px; }
  .fact-body{ flex: 1; min-width: 0; }
  .fact-label{ font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-faint); margin: 0; }
  .fact-value{ font-size: 14px; font-weight: 500; margin: 2px 0 0; word-break: keep-all; }
  .fact-value small{ display: block; font-weight: 400; font-size: 12px; color: var(--ink-soft); margin-top: 2px; }

  .airline{
    display: inline-flex; align-items: center;
    background: var(--airline-soft); color: var(--airline);
    font-family: "IBM Plex Mono", monospace; font-size: 11px; font-weight: 600;
    letter-spacing: 0.06em; padding: 2px 6px; border-radius: 5px;
    margin-right: 6px; vertical-align: 1px;
  }

  /* ---------- editable lists ---------- */
  .listrow{ display: flex; align-items: center; gap: 10px; border-bottom: 1px dashed var(--line); }
  .listrow:last-of-type{ border-bottom: none; }
  .listrow-btn{
    flex: 1; min-width: 0;
    display: flex; align-items: center; gap: 8px;
    border: none; background: transparent; color: inherit;
    font: inherit; font-size: 13.5px; text-align: left;
    padding: 10px 0; cursor: pointer;
  }
  .listrow-btn .icon{ width: 13px; height: 13px; color: var(--ink-faint); opacity: 0; flex-shrink: 0; }
  .listrow-btn:hover .icon, .listrow-btn.tapped .icon{ opacity: 1; }
  .listrow-text{ flex: 1; min-width: 0; word-break: break-word; }
  .listrow.on .listrow-text{ text-decoration: line-through; color: var(--ink-faint); }

  .linkrow{ display: flex; align-items: center; gap: 8px; border-bottom: 1px dashed var(--line); }
  .linkrow:last-of-type{ border-bottom: none; }
  .linkrow a{

    toggleBought(k){

    },
    extraOf(id){ return this.data.extra[id] || []; },
    addExtra(id, text){

      list.push(text);
      this.data.extra[id] = list;
      this.flush();
    },
    removeExtra(id, text){
      this.data.extra[id] = (this.data.extra[id] || []).filter(function(x){ return x !== text; });
      delete this.data.bought[id + "::" + text];
      this.flush();
    },

    /* 준비물 — the list itself is editable; the tick is keyed by its text, so

    isPacked(t){ return !!this.data.pack[t]; },
    togglePacked(t){
      if (this.data.pack[t]) delete this.data.pack[t];
      else this.data.pack[t] = 1;
      this.flush();
    },
    addPack(t){ this.data.packList.push(t); this.flush(); },
    editPack(oldT, newT){
      this.data.packList = this.data.packList.map(function(x){ return x === oldT ? newT : x; });
      if (this.data.pack[oldT]){ delete this.data.pack[oldT]; this.data.pack[newT] = 1; }
      this.flush();
    },
    removePack(t){

  /* ================= photos =================
     A photo is too big to sit in the trip document (256 KiB for the whole
     thing), so each one gets its own record and is fetched when shown. */
  var photoCache = {};

  function compressImage(file, maxSide, quality){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onerror = function(){ reject(new Error("read")); };
      reader.onload = function(){
        var img = new Image();
        img.onerror = function(){ reject(new Error("decode")); };
        img.onload = function(){
          var scale = Math.min(1, maxSide / Math.max(img.width, img.height));
          var w = Math.round(img.width * scale), h = Math.round(img.height * scale);
          var c = document.createElement("canvas");
          c.width = w; c.height = h;
          c.getContext("2d").drawImage(img, 0, 0, w, h);
          resolve(c.toDataURL("image/jpeg", quality));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  async function storePhoto(file){
    var data = await compressImage(file, 900, 0.55);
    if (data.length > 180000) data = await compressImage(file, 640, 0.45);
    if (data.length > 230000) throw new Error("too big");
    var pid = uid("p");
    if (Saved.backend === "db") await Saved.db.doc("photos/" + pid).set({ data: data });
    else localStorage.setItem("lab.photo." + pid, data);
    photoCache[pid] = data;
    return pid;
  }

  async function loadPhoto(pid){
    if (photoCache[pid]) return photoCache[pid];
    var data = null;
    try{
      if (Saved.backend === "db"){
        var snap = await Saved.db.doc("photos/" + pid).get();
        data = snap.exists ? snap.data().data : null;
      } else {
        data = localStorage.getItem("lab.photo." + pid);
      }
    }catch(e){ data = null; }
    if (data) photoCache[pid] = data;
    return data;
  }

  function dropPhoto(pid){
    delete photoCache[pid];
    try{
      if (Saved.backend === "db") Saved.db.doc("photos/" + pid).delete();
      else localStorage.removeItem("lab.photo." + pid);
    }catch(e){ /* the attachment is gone either way */ }
  }

  /* ================= merged itinerary ================= */
  function merged(seed){
    var patch = Saved.data.edits[seed.id];
    return patch ? Object.assign({}, seed, patch) : seed;
  }
  function byStart(a, b){ return (mins(a.s) || 0) - (mins(b.s) || 0); }

  function itemsForDay(dayIndex){
    var date = TRIP.days[dayIndex].date;
    var out = [];
    TRIP.days.forEach(function(d){
      d.items.forEach(function(seed){
        if (Saved.data.removed[seed.id]) return;
        var it = merged(seed);
        if ((it.dayDate || d.date) === date) out.push(it);
      });
    });
    Saved.data.added.forEach(function(it){
      if (Saved.data.removed[it.id]) return;
      if (it.dayDate === date) out.push(it);
    });
    out.sort(byStart);
    return out;
  }

  function allItems(){
    var out = [];
    TRIP.days.forEach(function(d, i){
      itemsForDay(i).forEach(function(it){ out.push({ item: it, dayIndex: i, day: TRIP.days[i] }); });
    });
    return out;

  function isMine(it){ return !SEED_IDS[it.id]; }

  function currentPair(){
    var di = todayIndex();
    if (di < 0) return null;
    var list = itemsForDay(di);
    var n = nowMins();
    var cur = null, next = null;
    for (var i = 0; i < list.length; i++){
      var s = mins(list[i].s);
      var e = list[i].e ? mins(list[i].e) : null;
      if (e === null){
        for (var j = i + 1; j < list.length; j++){
          var ns = mins(list[j].s);
          if (ns > s){ e = ns; break; }
        }
        if (e === null) e = s + 90;
      }
      if (!cur && n >= s && n < e) cur = list[i];
      if (!next && s > n) next = list[i];
    }
    return { dayIndex: di, current: cur, next: next };
  }

  function timelineItem(it, pair){
    var cat = CAT[it.cat] || CAT.todo;
    var isCurrent = pair && pair.current && pair.current.id === it.id;

    var row = el(
      '<div class="tl-item' + (isCurrent ? " current" : "") + '">' +
        '<div class="tl-time mono">' + esc(it.s) + (it.e ? '<small>' + esc(it.e) + '</small>' : (it.open ? '<small>~</small>' : '')) + '</div>' +
        '<div class="tl-rail"><span class="tl-dot' + (it.fixed ? " big" : "") + '" style="border-color:' + cat.color + '"></span></div>' +
        '<div class="tl-body">' +
          '<p class="tl-title"><span class="emo">' + it.emo + '</span>' + placeHtml(it.title, it.place) + '</p>' +
        '</div>' +
      '</div>'
    );
    var body = row.querySelector(".tl-body");

    (it.lines || []).forEach(function(line){
      body.appendChild(el('<p class="tl-line">' + esc(line) + '</p>'));
    });
    (it.candidates || []).forEach(function(c){
      body.appendChild(el('<p class="tl-line">' + placeHtml(c.name, c.nomap ? null : c.name) +
        (c.kind ? " · " + esc(c.kind) : "") + '</p>'));
    });
    if (it.note) body.appendChild(el('<p class="tl-line">' + esc(it.note) + '</p>'));

    var atts = Saved.attachOf(it.id);
    if (atts.length) body.appendChild(attachStrip(it.id, atts));

    var meta = el('<div class="tl-meta"></div>');
    meta.appendChild(el('<span class="badge cat" style="color:' + cat.color + '">' + cat.label + '</span>'));
    if (it.meal) meta.appendChild(el('<span class="badge">' + esc(MEAL_LABEL[it.meal]) + '</span>'));
    if (it.reserved){
      meta.appendChild(el('<span class="badge reserved">예약 ' + esc(it.reserved.time) + ' · ' + it.reserved.people + '명</span>'));
    }
    if (it.fixed && !it.reserved) meta.appendChild(el('<span class="badge fixed">시간 엄수</span>'));
    if (it.undecided) meta.appendChild(el('<span class="badge maybe">가게 미정</span>'));
    if (isMine(it)) meta.appendChild(el('<span class="badge mine">직접 추가</span>'));
    (it.places || []).forEach(function(p){
      meta.appendChild(el('<a class="maplink" href="' + esc(mapUrl(p)) + '" target="_blank" rel="noopener">' +
        icon("pin") + esc(p.replace(/\s*(후쿠오카|텐진|하카타)$/, "")) + '</a>'));
    });

    var actions = el('<span class="tl-actions"></span>');
    var clip = el('<button class="quietbtn' + (atts.length ? " has" : "") + '" type="button" aria-label="자료">' +
      icon("clip") + (atts.length ? atts.length : "") + '</button>');
    tap(clip, function(){ openAttachSheet(it); });
    actions.appendChild(clip);

    var edit = el('<button class="quietbtn" type="button">' + icon("edit") + '수정</button>');
    tap(edit, function(){ openEditor(it, null); });
    actions.appendChild(edit);
    meta.appendChild(actions);

    body.appendChild(meta);
    return row;
  }

  /* What an item carries, shown inline so it is there when you need it. */
  function attachStrip(itemId, atts){
    var box = el('<div class="att"></div>');
    var photos = atts.filter(function(a){ return a.type === "photo"; });
    if (photos.length){
      var strip = el('<div class="att-photos"></div>');
      photos.forEach(function(a){ strip.appendChild(thumb(a.pid)); });
      box.appendChild(strip);
    }
    atts.forEach(function(a){
      if (a.type === "link"){
        var u = safeUrl(a.url);
        if (!u) return;
        box.appendChild(el('<a class="att-link" href="' + esc(u) + '" target="_blank" rel="noopener">' +
          icon("link") + '<span>' + esc(a.title || hostOf(u)) + '</span></a>'));
      } else if (a.type === "note"){
        box.appendChild(el('<p class="att-note">' + esc(a.text) + '</p>'));
      }
    });
    return box;
  }

  /* ================= tab: food ================= */
  function renderFood(root){
    var all = allItems().filter(function(f){ return !!f.item.meal; });

    var chips = el('<div class="chiprow"></div>');
    MEALS.forEach(function(m){
      var n = m.key === "all" ? all.length : all.filter(function(f){ return f.item.meal === m.key; }).length;
      if (n === 0 && m.key !== "all") return;
      var b = el('<button class="chip" type="button" aria-pressed="' + (state.meal === m.key) + '">' +
        m.label + ' <span class="mono">' + n + '</span></button>');
      tap(b, function(){ go({ meal: m.key }); });
      chips.appendChild(b);
    });
    root.appendChild(chips);

    var list = state.meal === "all" ? all : all.filter(function(f){ return f.item.meal === state.meal; });

    var lastDay = -1;
    list.forEach(function(f){
      if (f.dayIndex !== lastDay){
        lastDay = f.dayIndex;
        var n = list.filter(function(x){ return x.dayIndex === f.dayIndex; }).length;
        root.appendChild(el('<div class="group-label"><h3>' + fmtMD(f.day.date) + ' (' + f.day.dow + ')</h3>' +
          '<span class="group-count mono">' + n + '</span></div>'));
      }
      root.appendChild(foodCard(f));
    });

    if (list.length === 0){
      root.appendChild(el('<div class="card dashed"><p class="card-kind">해당하는 식사가 없어요.</p></div>'));
    }

    var addDate = TRIP.days[state.day] ? TRIP.days[state.day].date : TRIP.days[0].date;
    var add = el('<button class="addcard" type="button">' + icon("plus") + '음식 추가</button>');
    tap(add, function(){
      openEditor(null, addDate, { cat:"food", meal: state.meal === "all" ? "lunch" : state.meal });
    });
    root.appendChild(add);
  }

  function foodCard(f){
    var it = f.item;
    var card = el('<div class="card' + (it.undecided || it.open ? " dashed" : "") + '"></div>');
    card.appendChild(el('<p class="card-when mono">' + esc(it.s) + (it.e ? '–' + esc(it.e) : '~') + ' · ' +
      esc(MEAL_LABEL[it.meal] || "") + '</p>'));
    card.appendChild(el('<div class="card-top"><p class="card-name">' + it.emo + ' ' +
      placeHtml(it.title, it.place) + '</p></div>'));

    (it.lines || []).forEach(function(l){ card.appendChild(el('<p class="card-kind">' + esc(l) + '</p>')); });
    (it.candidates || []).forEach(function(c){
      card.appendChild(el('<p class="card-kind">· ' + placeHtml(c.name, c.nomap ? null : c.name) +
        (c.kind ? ' — ' + esc(c.kind) : '') + '</p>'));
    });
    if (it.note) card.appendChild(el('<p class="card-note">' + esc(it.note) + '</p>'));

    var atts = Saved.attachOf(it.id);
    if (atts.length) card.appendChild(attachStrip(it.id, atts));

    var meta = el('<div class="card-meta"></div>');
    if (it.reserved){
      meta.appendChild(el('<span class="badge reserved">예약 확정 ' + esc(it.reserved.time) + ' · ' + it.reserved.people + '명</span>'));
    }
    if (it.undecided) meta.appendChild(el('<span class="badge maybe">가게 미정</span>'));
    if (it.open) meta.appendChild(el('<span class="badge maybe">후보 중 선택</span>'));
    if (isMine(it)) meta.appendChild(el('<span class="badge mine">직접 추가</span>'));

    var actions = el('<span class="tl-actions"></span>');
    var clip = el('<button class="quietbtn' + (atts.length ? " has" : "") + '" type="button" aria-label="자료">' +
      icon("clip") + (atts.length ? atts.length : "") + '</button>');
    tap(clip, function(){ openAttachSheet(it); });
    actions.appendChild(clip);
    var edit = el('<button class="quietbtn" type="button">' + icon("edit") + '수정</button>');
    tap(edit, function(){ openEditor(it, null); });
    actions.appendChild(edit);
    meta.appendChild(actions);

    card.appendChild(meta);
    return card;

  /* ================= tab: shopping ================= */
  function renderShop(root){
    var total = 0, got = 0;
    SHOPS.forEach(function(s){
      var items = s.preset.concat(Saved.extraOf(s.id));
      total += items.length;
      items.forEach(function(i){ if (Saved.isBought(s.id + "::" + i)) got++; });
    });

    root.appendChild(el('<div class="day-head" style="padding-top:18px">' +
      '<p class="day-theme">쇼핑 목록</p>' +
      '<p class="day-stat mono">' + SHOPS.length + '곳 · 살 것 ' + got + '/' + total + '</p></div>'));

    var lastDay = -1;
    SHOPS.forEach(function(s){
      if (s.day !== lastDay){
        lastDay = s.day;
        var day = TRIP.days[s.day];
        var n = SHOPS.filter(function(x){ return x.day === s.day; }).length;
        root.appendChild(el('<div class="group-label"><h3>' + fmtMD(day.date) + ' (' + day.dow + ')</h3>' +
          '<span class="group-count mono">' + n + '곳</span></div>'));
      }
      root.appendChild(shopCard(s));
    });
  }

  function shopCard(s){
    var card = el('<div class="card"></div>');
    card.appendChild(el('<p class="card-when mono">' + esc(s.time) + ' · ' + esc(s.area) + '</p>'));
    card.appendChild(el('<div class="card-top"><p class="card-name">' + placeHtml(s.name, s.map) + '</p></div>'));

    var items = s.preset.concat(Saved.extraOf(s.id));
    items.forEach(function(name){
      var key = s.id + "::" + name;
      var bought = Saved.isBought(key);
      var row = el('<div class="buy-row' + (bought ? " got" : "") + '"></div>');
      var cb = el('<button class="check" type="button" aria-pressed="' + bought + '" aria-label="샀음 표시">' + icon("check") + '</button>');
      tap(cb, function(){ Saved.toggleBought(key); render(); });
      row.appendChild(cb);
      row.appendChild(el('<span class="buy-text">' + esc(name) + '</span>'));
      if (s.preset.indexOf(name) === -1){
        var del = el('<button class="buy-del" type="button" aria-label="삭제">' + icon("x") + '</button>');
        tap(del, function(){ Saved.removeExtra(s.id, name); render(); });
        row.appendChild(del);
      }
      card.appendChild(row);
    });

    var addBtn = el('<button class="addtoggle" type="button">+ 살 것 적어두기</button>');
    var add = el('<div class="additem" hidden>' +
      '<input type="text" placeholder="예: 티셔츠" aria-label="살 것 추가">' +
      '<button type="button">추가</button></div>');
    var input = add.querySelector("input");
    function submit(){
      var v = input.value.trim();
      if (!v) return;
      Saved.addExtra(s.id, v);
      input.value = "";
      render();
    }
    tap(addBtn, function(){ addBtn.hidden = true; add.hidden = false; input.focus(); });
    tap(add.querySelector("button"), submit);
    input.addEventListener("keydown", function(e){ if (e.key === "Enter") submit(); });
    card.appendChild(addBtn);
    card.appendChild(add);
    return card;
  }

  function fact(ic, label, valueHtml){

      '<div class="fact-body"><p class="fact-label">' + esc(label) + '</p>' +
      '<p class="fact-value">' + valueHtml + '</p></div></div>');

  function cardHead(title, count){
    return el('<div class="card-head"><p class="card-when mono">' + esc(title) +
      (count != null ? ' · ' + count : '') + '</p></div>');
  }

  /* 유용한 정보 — a title that opens the link it carries. */
  function linksCard(){
    var card = el('<div class="card"></div>');
    var head = cardHead("유용한 정보", Saved.data.links.length || null);
    var add = el('<button class="quietbtn" type="button">' + icon("plus") + '추가</button>');
    tap(add, function(){
      openLinkDialog(null, function(v){ Saved.addLink(v); render(); });
    });
    head.appendChild(add);
    card.appendChild(head);

    if (!Saved.data.links.length){
      card.appendChild(el('<p class="card-empty">링크를 모아두면 여행 중에 바로 꺼내볼 수 있어요.</p>'));
      return card;
    }

    Saved.data.links.forEach(function(l){
      var u = safeUrl(l.url);
      var row = el('<div class="linkrow"></div>');
      row.appendChild(el('<a href="' + esc(u || "#") + '" target="_blank" rel="noopener">' + icon("link") +
        '<span class="linkrow-text"><b>' + esc(l.title) + '</b><small>' + esc(u ? hostOf(u) : "잘못된 주소") + '</small></span></a>'));
      var ed = el('<button class="quietbtn" type="button" aria-label="수정">' + icon("edit") + '</button>');
      tap(ed, function(){
        openLinkDialog(l, function(v){ Saved.editLink(l.id, v); render(); },
          function(){ Saved.removeLink(l.id); render(); });
      });
      row.appendChild(ed);
      card.appendChild(row);
    });
    return card;
  }

  function packCard(){
    var list = Saved.data.packList;
    var done = list.filter(function(p){ return Saved.isPacked(p); }).length;
    var card = el('<div class="card"></div>');
    var head = cardHead("준비물", done + "/" + list.length);
    var add = el('<button class="quietbtn" type="button">' + icon("plus") + '추가</button>');

    });
    head.appendChild(add);
    card.appendChild(head);

    list.forEach(function(p){
      var on = Saved.isPacked(p);
      var row = el('<div class="listrow' + (on ? " on" : "") + '"></div>');
      var cb = el('<button class="check" type="button" aria-pressed="' + on + '" aria-label="챙김 표시">' + icon("check") + '</button>');
      tap(cb, function(){ Saved.togglePacked(p); render(); });
      row.appendChild(cb);
      var btn = el('<button class="listrow-btn" type="button"><span class="listrow-text">' + esc(p) + '</span>' + icon("edit") + '</button>');
      tap(btn, function(){
        openTextDialog({ title:"준비물 수정", value:p }, function(v){ Saved.editPack(p, v); render(); },
          function(){ Saved.removePack(p); render(); });
      });
      row.appendChild(btn);
      card.appendChild(row);
    });
    return card;

  function notesCard(){

    var head = cardHead("메모", Saved.data.notes.length || null);

  /* ================= dialogs ================= */
  function dialogShell(inner){
    var scrim = el('<div class="scrim" style="align-items:center">' + inner + '</div>');
    scrim.addEventListener("click", function(e){ if (e.target === scrim) closeOverlay(); });
    return scrim;
  }

  function openTextDialog(opts, onSave, onDelete){
    var field = opts.multiline
      ? '<textarea id="dlg-v" placeholder="' + esc(opts.placeholder || "") + '">' + esc(opts.value || "") + '</textarea>'
      : '<input id="dlg-v" type="text" placeholder="' + esc(opts.placeholder || "") + '" value="' + esc(opts.value || "") + '">';
    var d = dialogShell(
      '<div class="dialog" role="dialog" aria-modal="true">' +
        '<h3>' + esc(opts.title) + '</h3>' +
        '<div class="fld">' + field + '</div>' +
        '<div class="dialog-actions">' +
          (onDelete ? '<button class="btn-text danger" data-a="del">삭제</button>' : '') +
          '<span class="spacer"></span>' +
          '<button class="btn-text" data-a="no">취소</button>' +
          '<button class="btn-text go" data-a="ok">확인</button>' +
        '</div>' +
      '</div>'
    );
    var input = d.querySelector("#dlg-v");
    d.querySelector('[data-a="no"]').addEventListener("click", closeOverlay);
    if (onDelete){
      d.querySelector('[data-a="del"]').addEventListener("click", function(){ closeOverlay(); onDelete(); });
    }
    d.querySelector('[data-a="ok"]').addEventListener("click", function(){
      var v = input.value.trim();
      if (!v){ input.focus(); return; }
      closeOverlay();
      onSave(v);
    });
    if (!opts.multiline){
      input.addEventListener("keydown", function(e){ if (e.key === "Enter") d.querySelector('[data-a="ok"]').click(); });
    }
    overlay.appendChild(d);
    setTimeout(function(){ input.focus(); }, 60);
  }

  function openLinkDialog(link, onSave, onDelete){
    var d = dialogShell(
      '<div class="dialog" role="dialog" aria-modal="true">' +
        '<h3>' + (link ? "정보 수정" : "정보 추가") + '</h3>' +
        '<div class="fld"><label for="lk-t">제목</label>' +
          '<input id="lk-t" type="text" placeholder="예: 공항버스 타는 법" value="' + esc(link ? link.title : "") + '"></div>' +
        '<div class="fld"><label for="lk-u">링크</label>' +
          '<input id="lk-u" type="url" inputmode="url" placeholder="https://..." value="' + esc(link ? link.url : "") + '"></div>' +
        '<div class="dialog-actions">' +
          (onDelete ? '<button class="btn-text danger" data-a="del">삭제</button>' : '') +
          '<span class="spacer"></span>' +
          '<button class="btn-text" data-a="no">취소</button>' +
          '<button class="btn-text go" data-a="ok">확인</button>' +
        '</div>' +
      '</div>'
    );
    var t = d.querySelector("#lk-t"), u = d.querySelector("#lk-u");
    d.querySelector('[data-a="no"]').addEventListener("click", closeOverlay);
    if (onDelete){
      d.querySelector('[data-a="del"]').addEventListener("click", function(){ closeOverlay(); onDelete(); });
    }
    d.querySelector('[data-a="ok"]').addEventListener("click", function(){
      var title = t.value.trim(), url = safeUrl(u.value);
      if (!title){ t.focus(); toast("제목을 적어주세요."); return; }
      if (!url){ u.focus(); toast("http로 시작하는 주소를 넣어주세요."); return; }
      closeOverlay();
      onSave({ title: title, url: url });
    });
    overlay.appendChild(d);
    setTimeout(function(){ t.focus(); }, 60);
  }

  /* ================= attachments sheet ================= */
  function openAttachSheet(item){
    var sheet = el(
      '<div class="scrim"><div class="sheet" role="dialog" aria-modal="true">' +
        '<div class="sheet-head"><div style="flex:1;min-width:0">' +
          '<p class="sheet-title">자료</p>' +
          '<p class="sheet-sub">' + esc(item.s + " " + item.title) + '</p></div>' +
          '<button class="icon-btn" id="sheet-x" aria-label="닫기">' + icon("x") + '</button>' +
        '</div>' +
        '<div class="sheet-body">' +
          '<div class="attpick">' +
            '<button type="button" data-k="note" aria-pressed="true">' + icon("note") + '메모</button>' +
            '<button type="button" data-k="link" aria-pressed="false">' + icon("link") + '링크</button>' +
            '<button type="button" data-k="photo" aria-pressed="false">' + icon("image") + '사진</button>' +
          '</div>' +
          '<div id="att-form"></div>' +
          '<div class="attlist" id="att-list"></div>' +
        '</div>' +
      '</div></div>'
    );
    var form = sheet.querySelector("#att-form");
    var listBox = sheet.querySelector("#att-list");
    var kind = "note";

    function paintPicks(){
      sheet.querySelectorAll(".attpick button").forEach(function(b){
        b.setAttribute("aria-pressed", String(b.getAttribute("data-k") === kind));
      });
    }
    sheet.querySelectorAll(".attpick button").forEach(function(b){
      tap(b, function(){ kind = b.getAttribute("data-k"); paintPicks(); paintForm(); });
    });

    function paintForm(){
      form.innerHTML = "";
      if (kind === "note"){
        var f = el('<div><div class="fld"><textarea id="a-note" placeholder="예: 2층 버스 정류장, 줄이 길면 택시"></textarea></div>' +
          '<button class="btn btn-primary" type="button" style="width:100%">메모 추가</button></div>');
        tap(f.querySelector("button"), function(){
          var v = f.querySelector("#a-note").value.trim();
          if (!v) return;
          Saved.addAttach(item.id, { type:"note", text:v });
          paintList(); render();
          f.querySelector("#a-note").value = "";
          toast("메모를 넣었어요.");
        });
        form.appendChild(f);
      } else if (kind === "link"){
        var g = el('<div><div class="fld"><label for="a-lt">제목</label>' +
          '<input id="a-lt" type="text" placeholder="예: 공항버스 후기"></div>' +
          '<div class="fld"><label for="a-lu">링크</label>' +
          '<input id="a-lu" type="url" inputmode="url" placeholder="https://..."></div>' +
          '<button class="btn btn-primary" type="button" style="width:100%">링크 추가</button></div>');
        tap(g.querySelector("button"), function(){
          var t = g.querySelector("#a-lt").value.trim();
          var u = safeUrl(g.querySelector("#a-lu").value);
          if (!u){ g.querySelector("#a-lu").focus(); toast("http로 시작하는 주소를 넣어주세요."); return; }
          Saved.addAttach(item.id, { type:"link", title: t || hostOf(u), url: u });
          paintList(); render();
          g.querySelector("#a-lt").value = ""; g.querySelector("#a-lu").value = "";
          toast("링크를 넣었어요.");
        });
        form.appendChild(g);
      } else {
        var h = el('<div><label class="btn btn-primary" style="width:100%">' + icon("image") + '사진 고르기' +
          '<input type="file" accept="image/*" hidden></label>' +
          '<p class="fld-hint">사진은 크기를 줄여서 저장됩니다.</p></div>');
        var fileInput = h.querySelector("input");
        fileInput.addEventListener("change", async function(){
          var file = fileInput.files[0];
          if (!file) return;
          var label = h.querySelector("label");
          label.textContent = "저장 중...";
          try{
            var pid = await storePhoto(file);
            Saved.addAttach(item.id, { type:"photo", pid: pid });
            paintList(); render();
            toast("사진을 넣었어요.");
          }catch(e){
            toast("사진을 저장하지 못했어요.");
          }
          label.innerHTML = icon("image") + "사진 고르기";
          label.appendChild(fileInput);
          fileInput.value = "";
        });
        form.appendChild(h);
      }
    }

    function paintList(){
      listBox.innerHTML = "";
      var atts = Saved.attachOf(item.id);
      if (!atts.length){
        listBox.appendChild(el('<p class="card-empty" style="padding:12px 0">아직 넣은 자료가 없어요.</p>'));
        return;
      }
      atts.forEach(function(a){
        var row = el('<div class="attlist-row"></div>');
        if (a.type === "photo"){
          row.appendChild(thumb(a.pid));
          row.appendChild(el('<div class="attlist-body"><b>사진</b></div>'));
        } else if (a.type === "link"){
          row.appendChild(el('<div class="attlist-body"><b>' + esc(a.title) + '</b><small>' + esc(hostOf(a.url)) + '</small></div>'));
        } else {
          row.appendChild(el('<div class="attlist-body"><p>' + esc(a.text) + '</p></div>'));
        }
        var del = el('<button class="quietbtn" type="button" aria-label="삭제">' + icon("x") + '</button>');
        tap(del, function(){
          if (a.type === "photo") dropPhoto(a.pid);
          Saved.removeAttach(item.id, a.id);
          paintList(); render();
        });
        row.appendChild(del);
        listBox.appendChild(row);
      });
    }

    tap(sheet.querySelector("#sheet-x"), closeOverlay);
    sheet.addEventListener("click", function(e){ if (e.target === sheet) closeOverlay(); });

    paintPicks(); paintForm(); paintList();
    overlay.appendChild(sheet);
  }

  /* ================= item editor sheet ================= */
  function openEditor(item, defaultDate, presets){
    var editing = !!item;
    var seed = item && SEED_IDS[item.id];
    var cur = {
      dayDate: item ? (item.dayDate || dayDateOfSeed(item.id) || defaultDate) : defaultDate,
      cat: item ? item.cat : ((presets && presets.cat) || "food"),
      meal: item ? (item.meal || "") : ((presets && presets.meal) || "")
    };

    var sheet = el(
      '<div class="scrim"><div class="sheet" role="dialog" aria-modal="true">' +
        '<div class="sheet-head"><p class="sheet-title">' + (editing ? "일정 수정" : "일정 추가") + '</p>' +
          '<button class="icon-btn" id="sheet-x" aria-label="닫기">' + icon("x") + '</button></div>' +
        '<div class="sheet-body">' +
          '<div class="fld"><label for="ed-title">이름</label>' +
            '<input id="ed-title" type="text" placeholder="예: 나카스 야타이" value="' + esc(item ? item.title : "") + '"></div>' +
          '<div class="fld"><label>날짜</label><div class="pickrow" id="ed-day"></div></div>' +
          '<div class="fld-row">' +
            '<div class="fld"><label for="ed-s">시작</label><input id="ed-s" type="time" value="' + esc(item ? item.s : "") + '"></div>' +
            '<div class="fld"><label for="ed-e">종료</label><input id="ed-e" type="time" value="' + esc(item && item.e ? item.e : "") + '"></div>' +
          '</div>' +
          '<div class="fld"><label>분류</label><div class="pickrow" id="ed-cat"></div></div>' +
          '<div class="fld"><label>음식 종류</label><div class="pickrow" id="ed-meal"></div>' +
            '<p class="fld-hint">선택하면 음식 탭에도 함께 표시됩니다.</p></div>' +
          '<div class="fld"><label for="ed-place">장소</label>' +
            '<input id="ed-place" type="text" placeholder="예: 나카스 야타이" value="' + esc(item && item.place ? item.place : "") + '">' +
            '<p class="fld-hint">적어두면 이름을 눌러 구글맵으로 갈 수 있습니다.</p></div>' +
          '<div class="fld"><label for="ed-lines">메모</label>' +
            '<textarea id="ed-lines" placeholder="한 줄에 하나씩">' + esc(item ? (item.lines || []).join("\n") : "") + '</textarea></div>' +
        '</div>' +
        '<div class="sheet-foot"></div>' +
      '</div></div>'
    );
    var foot = sheet.querySelector(".sheet-foot");

    function pickGroup(host, options, get, set){
      host.innerHTML = "";
      options.forEach(function(o){
        var b = el('<button class="pick" type="button" aria-pressed="' + (get() === o.key) + '">' + esc(o.label) + '</button>');
        tap(b, function(){
          set(o.key);
          host.querySelectorAll(".pick").forEach(function(x, i){
            x.setAttribute("aria-pressed", String(options[i].key === get()));
          });
        });
        host.appendChild(b);
      });
    }

    pickGroup(sheet.querySelector("#ed-day"),
      TRIP.days.map(function(d){ return { key:d.date, label: fmtMD(d.date) + " (" + d.dow + ")" }; }),
      function(){ return cur.dayDate; }, function(v){ cur.dayDate = v; });
    pickGroup(sheet.querySelector("#ed-cat"),
      CAT_ORDER.map(function(k){ return { key:k, label: CAT[k].label }; }),
      function(){ return cur.cat; }, function(v){ cur.cat = v; });
    pickGroup(sheet.querySelector("#ed-meal"),
      [{ key:"", label:"없음" }].concat(Object.keys(MEAL_LABEL).map(function(k){ return { key:k, label:MEAL_LABEL[k] }; })),
      function(){ return cur.meal; }, function(v){ cur.meal = v; });

    var saveBtn = el('<button class="btn btn-primary" type="button">저장</button>');
    if (editing){
      var delBtn = el('<button class="btn btn-danger" type="button">삭제</button>');
      tap(delBtn, function(){
        Saved.removeItem(item.id);
        closeOverlay();
        toast("삭제했어요.");
        render();
      });
      foot.appendChild(delBtn);
    }
    foot.appendChild(saveBtn);

    var titleEl = sheet.querySelector("#ed-title");
    var sEl = sheet.querySelector("#ed-s");

    tap(saveBtn, function(){
      var title = titleEl.value.trim();
      if (!title){ titleEl.focus(); toast("이름을 적어주세요."); return; }
      if (!sEl.value){ sEl.focus(); toast("시작 시간을 골라주세요."); return; }

      var patch = {
        dayDate: cur.dayDate,
        s: sEl.value,
        e: sheet.querySelector("#ed-e").value || null,
        cat: cur.cat,
        meal: cur.meal || null,
        title: title,
        place: sheet.querySelector("#ed-place").value.trim() || null,
        lines: sheet.querySelector("#ed-lines").value.split("\n").map(function(x){ return x.trim(); }).filter(Boolean)
      };
      /* Keep a seed item's hand-picked emoji unless its kind actually changed. */
      var keepEmo = seed && seed.cat === patch.cat && (seed.meal || "") === (patch.meal || "");
      patch.emo = keepEmo ? seed.emo : autoEmo(patch.cat, patch.meal);

      Saved.saveItem({ id: item ? item.id : null, patch: patch });
      closeOverlay();
      toast(editing ? "수정했어요." : "추가했어요.");
      if (!editing){
        var di = TRIP.days.findIndex(function(d){ return d.date === patch.dayDate; });
        if (di >= 0) state.day = di;
      }
      render();
    });

    tap(sheet.querySelector("#sheet-x"), closeOverlay);
    sheet.addEventListener("click", function(e){ if (e.target === sheet) closeOverlay(); });
    overlay.appendChild(sheet);
    if (!editing) setTimeout(function(){ titleEl.focus(); }, 60);
  }

  function dayDateOfSeed(id){
    var found = null;
    TRIP.days.forEach(function(d){ d.items.forEach(function(it){ if (it.id === id) found = d.date; }); });
    return found;
  }

  /* ================= render ================= */
  function render(){
    if (state.view === "home") renderHome();
    else renderTrip();
  }

  (async function boot(){
    Theme.apply();
    await Saved.init();
    var di = todayIndex();
    if (di >= 0) state.day = di;
    render();
  })();
})();
</script>
</body>
</html>
